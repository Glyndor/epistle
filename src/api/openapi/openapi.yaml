        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/deliveries:
    get:
      operationId: listDeliveries
      tags: [Queue]
      summary: The per-recipient delivery log
      description: |-
        Newest day first. There is no cursor: narrow with `since`, `outcome`
        or `recipient`. A key bound to one account reads it with `mail:read`
        and sees only its own records; every other key needs `manage:read`.
        A key confined to some domains sees none, because records
        carry an account, not a domain. Records are kept for
        `[storage] delivery_log_days` (30 by default); with `0` the log is
        off and this answers `404`.
      x-epistle-scope: [mail:read, manage:read]
      parameters:
        - name: recipient
          in: query
          required: false
          description: Exact recipient address.
          schema:
            type: string
        - name: account
          in: query
          required: false
          description: The sending account. Ignored for a key bound to one account.
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: |-
            A duration such as `30s`, `15m`, `24h` or `7d`, or an RFC 3339
            timestamp. Records at or after it are returned.
          schema:
            type: string
        - name: outcome
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DeliveryOutcome"
        - name: limit
          in: query
          required: false
          description: Most records returned. Cut to the range 1 to 100.
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: The records.
          content:
            application/json:
              schema:
                type: object
