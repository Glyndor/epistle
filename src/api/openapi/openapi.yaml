  /api/v1/aliases:
    get:
      operationId: listAliases
      tags: [Aliases]
      summary: List the address aliases
      description: |-
        Needs the `alias` scope, and only that: `manage:read` does not open it. Ordered
        by address and keyset-paged by it. A key confined to some domains sees
        the aliases whose address and every member lie in them. `domain` and
        `account` filter; a domain or an account outside the key's reach
        answers exactly like one that does not exist.
      x-epistle-scope: [alias]
      parameters:
        - name: domain
          in: query
          required: false
          description: Only the aliases at this domain.
          schema:
            type: string
        - name: account
          in: query
          required: false
          description: Only the aliases that deliver to this account.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size. Above 100 it is cut to 100; 0 is refused.
          schema:
            type: integer
            minimum: 1
            default: 50
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page.
          schema:
            type: string
      responses:
        "200":
          description: A page of aliases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AliasPage"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: createAlias
      tags: [Aliases]
      summary: Make an address alias
      description: |-
        Needs the `alias` scope. The rules are those of `epistle alias add`:
        the address is in a hosted domain, no account, masked address or other
        alias holds it, and the caps of the domain (`max_aliases_per_domain`,
        `max_members_per_list`) apply. What differs is for the key: every
        member is the address of an account that exists, never an outside
        address, and a key confined to some domains needs the alias and every
        member in them. Role addresses (`postmaster`, `abuse`, `hostmaster`,
        `webmaster`, `security`, `noc`) are the operator's. A domain, a member
        or an account that does not exist and one that is not the key's get
        the same 400, so the answer teaches a confined key nothing about the
        others. Give `members`, or `target_account` for one account. An alias
        that exists is 409 with the text of the command. With `dry_run` the
        request is checked as it would be written and nothing is. The write
        is durable; the watcher applies it to the running server.
      x-epistle-scope: [alias]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAlias"
      responses:
        "200":
          description: "A dry run, so nothing was written: this is what would be made."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AliasCreated"
        "201":
          description: The alias was made.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AliasCreated"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "409":
          description: The alias exists, or a cap of the domain is reached (`limit_reached`); the message is the command's.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: The body is over 16 KiB. `text/plain`.
          content:
            text/plain:
              schema:
                type: string
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableBody"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/aliases/{alias}:
    delete:
      operationId: removeAlias
      tags: [Aliases]
      summary: Remove an address alias
      description: |-
        Needs the `alias` scope. An alias outside the domains of a confined key
        answers exactly like one that does not exist: 404
        `alias ADDRESS not found`. With `dry_run=true` nothing is removed.
      x-epistle-scope: [alias]
      parameters:
        - name: alias
          in: path
          required: true
          description: The alias address, percent-encoded; ASCII case is ignored.
          schema:
            type: string
        - name: dry_run
          in: query
          required: false
          description: Check the removal and change nothing.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The durable result; a changed state is applied by the file watcher.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AliasRemoved"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/accounts:
    get:
      operationId: listAccounts
      tags: [Accounts]
      summary: The accounts in the key's reach
      description: Not paged. A confined key sees only accounts whose addresses all lie in its domains.
      x-epistle-scope: [manage:read]
      responses:
        "200":
          description: The accounts.
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccountView"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
    post:
      operationId: createAccount
      tags: [Accounts]
      summary: Create an API-managed account
      description: |-
        The name is lowercased. Checks run in this order, so a refusal never
        reveals more than the step before it allowed: addresses inside the
        key's domains, name available, tenant `max_accounts`, password policy
        (12 to 64 printable ASCII characters, not in the bundled breach
        list), then the store (duplicate name or address, unknown domain,
        malformed name). Answers `200`, not `201`.
      x-epistle-scope: [manage:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccount"
      responses:
        "200":
          description: The account was created.
          content:
            application/json:
              schema:
                type: object
                required: [created]
                properties:
                  created:
                    type: string
                    description: The stored (lowercased) account name.
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "409":
          description: |-
            `conflict`: the tenant is at its `max_accounts`. Waiting does not
            help; delete an account or raise the cap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableBody"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/accounts/{name}:
    delete:
      operationId: deleteAccount
      tags: [Accounts]
      summary: Delete an API-managed account
      description: |-
        Removes the account, its mailbox, masked addresses, app passwords,
        suppression entries, correspondents and Bayesian rows. `queue` is
        required so a client never drops queued mail by omission. Accounts
        declared in the configuration file are not API-managed and answer
        `404 no such dynamic account`.
      x-epistle-scope: [manage:write]
      parameters:
        - $ref: "#/components/parameters/AccountName"
        - name: queue
          in: query
          required: true
          description: What to do with queued mail the account sent. `discard` drops it, `drain` leaves it to be delivered.
          schema:
            type: string
            enum: [discard, drain]
      responses:
        "200":
          description: What was removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountRemoved"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/accounts/{name}/password:
    put:
      operationId: setAccountPassword
      tags: [Accounts]
      summary: Replace the password of an API-managed account
      description: |-
        The same password policy as account creation. The SCRAM verifier is
        replaced too (or dropped when `[auth] scram = false`).
