              properties:
                display_name:
                  type: string
                  maxLength: 128
                  description: At most 128 characters after trimming, no control characters.
      responses:
        "200":
          description: The stored name, or null when it was cleared.
          content:
            application/json:
              schema:
                type: object
                required: [display_name]
                properties:
                  display_name:
                    type: [string, "null"]
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableBody"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/accounts/{name}/totp:
