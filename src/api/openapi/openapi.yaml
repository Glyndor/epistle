# The OpenAPI 3.1 description of the HTTP routes epistle registers.
#
# Served by `GET /api/v1/openapi.json` and checked against the routers by
# `route_openapi_tests.rs`: adding a route in the code without describing it
# here, or describing one the code does not register, fails the tests.
#
# Written in the YAML subset `yaml.rs` reads: block style, no anchors, no
# trailing comments, plain scalars that could be read as a number or a YAML
# 1.1 word are quoted.
openapi: "3.1.0"
info:
  title: Epistle HTTP API
  version: "1"
  license:
    name: MIT
    identifier: MIT
  summary: Management, send, JMAP, SCIM and OAuth routes of one epistle server.
  description: |-
    Everything under `/api/v1` is the versioned management API. `/jmap/*`,
    `/scim/v2/*` and `/oauth/*` are standard protocols served by the same
    listener. The routes at the end (autodiscovery, ACME, metrics) live on
    their own listeners, see their `servers` entries.

    **Authentication.** Every route of the API listener except `/healthz` and
    `/oauth/*` needs `Authorization: Bearer <token>`: the optional static token whose hash is
    `[api] token_hash`, or an API key made with `epistle api-key create`.
    JMAP also accepts locally issued OAuth access tokens, confined to the
    signed `sub` account and explicit `read`, `write`, `send` scopes (the names a
    client asks for; inside they are `mail:read`, `mail:write` and `send`). These
    tokens never authenticate `/api/v1` or SCIM.
    A key carries scopes (`manage:read`, `manage:write`, `mail:read`, `mail:write`,
    `send`, `scim`, `alias`, `ban`). A key made before 0.15.0 with `read` or `write` holds
    both halves of it, management and mail, until it is changed; a request the
    scopes do not cover is answered `403 forbidden` and does not count as a
    failed authentication; an unknown token is `401 unauthenticated`.
    `x-epistle-scope` on each operation names the
    scope it needs. Without `token_hash`, labelled keys in `api_keys.toml`
    authenticate bearer-protected routes, and local OAuth tokens authenticate JMAP. No current route becomes unreachable:
    SCIM accepts `scim` keys, and OAuth uses account credentials or grant codes.
    A static-only route without a per-key scope must refuse keys with `403`,
    even all-scope keys. An absent hash never matches any bearer.

    **Errors.** A failure the API itself decides is JSON,
    `{"error": {"code": "...", "message": "..."}}` (see `ApiError`). A body,
    query string or path the HTTP layer cannot read is refused before the
    handler runs, with `text/plain` and no `error` object: `400` for
    malformed JSON, query or path values, `415` without
    `Content-Type: application/json`, `422` for a missing or mistyped field.
    An unknown path is `404` with an empty body; a known path with another
    method is `405` with an `allow` header. Every `429` of `/api/v1` includes
    `Retry-After` in seconds, and every `401` includes
    `WWW-Authenticate: Bearer`. A client that sends
    `Accept: application/problem+json` gets each of these errors as an RFC 9457
    problem (`#/components/schemas/Problem`) instead of the `error` object; any
    other `Accept` keeps the `error` object. Client attribution
    uses the TCP peer unless `[api] trusted_proxies` permits a validated
    `X-Forwarded-For` chain, scanned from right to left.

    **Stability.** `/api/v1` keeps its paths, field names and error codes
    within the major version; new optional fields, new error codes and new
    routes can appear. `docs/api.md` lists what is stable.
servers:
  - url: "http://127.0.0.1:8025"
    description: The `api` listener. The port and address are the operator's choice.
tags:
  - name: Service
    description: Liveness, status and this description.
  - name: Accounts
    description: Accounts, passwords, two-factor, mailboxes, masked addresses and the archive.
  - name: Domains
    description: Hosted-domain reads and atomic writes shared with `epistle domain`.
  - name: DNS
    description: The records the hosted domains need in DNS, and a check of the live DNS against them.
  - name: Bans
    description: The bans in force, banning and lifting, and the allow list, through the same code as `epistle ban`.
  - name: Aliases
    description: Address aliases, written through the same rules as `epistle alias`.
  - name: Queue
    description: The outbound queue, the suppression list and the delivery log.
  - name: Send
    description: Mail submission from JSON.
  - name: JMAP
    description: JMAP (RFC 8620, 8621, 8887) over the same bearer keys.
  - name: SCIM
    description: SCIM 2.0 provisioning (RFC 7643, 7644).
  - name: OAuth
    description: The built-in authorization server; present only with an `[oauth]` signing key.
  - name: Discovery
    description: Mail client autodiscovery, on the autoconfig listeners.
  - name: Operations
    description: ACME HTTP-01 and Prometheus metrics, on their own listeners.
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthz
      tags: [Service]
      summary: Liveness probe
      description: Reveals nothing but that the process answers. Needs no credentials.
      security: []
      x-epistle-scope: []
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /api/v1/openapi.json:
    get:
      operationId: getOpenApi
      tags: [Service]
      summary: This description as JSON
      description: |-
        The OpenAPI document the running server was built with. It is behind
        the bearer check like the rest of `/api/v1`.
      x-epistle-scope: [manage:read]
      responses:
        "200":
          description: The OpenAPI 3.1 document.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
  /api/v1/status:
    get:
      operationId: getStatus
      tags: [Service]
      summary: Counters for the server, or for the reach of a confined key
      x-epistle-scope: [manage:read]
      responses:
        "200":
          description: The counters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/auth/verify:
    post:
      operationId: verifyCredentials
      tags: [Accounts]
      summary: Check an account login and password
      description: |-
        Lets a panel check the credentials of an operator without holding
        their password hash. An unknown login and a wrong password answer
        the same `valid: false`. `admin` is true only for a valid account
        listed in `[api] admins`. The attempt is attributed to the caller's
        IP like any other authentication attempt, so the account's own
        failure counters and bans apply. A key confined to some domains only
        gets a real check for logins inside them.
      x-epistle-scope: [manage:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "200":
          description: The verdict. Always 200 when the request was readable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
        "400":
          $ref: "#/components/responses/UnreadableRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableBody"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
  /api/v1/dns/records:
    get:
      operationId: listDnsRecords
      tags: [DNS]
      summary: The DNS records the hosted domains need
      description: |-
        The rows `epistle dns-records --json` prints, from the same code. The
        server lists the records of the domains in the key's reach and, for a
        key with no domain or account restriction that names no `domain`, the records of
        the mail host too (its address records and its TLSA record). A key
        confined to some domains gets those domains' records and never the
        host's. At most 200 domains are listed in one request; past that, name
        one with `domain`. `complete` is false when an input could not be read
        (a DKIM key, the certificate); the server's log says which.
      x-epistle-scope: [manage:read]
      parameters:
        - $ref: "#/components/parameters/DnsDomain"
      responses:
        "200":
          description: The records, and the groups the configuration does not publish.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DnsRecords"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/dns/verify:
    get:
      operationId: verifyDns
      tags: [DNS]
      summary: Check the live DNS against the records the domains need
      description: |-
        The result `epistle verify-dns --json` prints, from the same code, with
        the system resolver, built for each check, so no answer an earlier check
        cached is reused. It checks the domains in the
        key's reach and, for a key with no domain or account restriction that names no
        `domain`, the mail host first. Drift is an answer, not an error: `ok`
        is false when an expected record is missing, and a lookup that failed
        is `error`, which is inconclusive. A check makes a dozen lookups for
        each domain, so one request covers at most 20 domains (name one with
        `domain` past that), two checks run at once on a server, a third is
        answered `429` with `Retry-After`, and a check that is not finished in
        45 seconds is answered `504`.
      x-epistle-scope: [manage:read]
      parameters:
        - $ref: "#/components/parameters/DnsDomain"
      responses:
        "200":
          description: The groups of checks, the host first when it is included, then each domain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DnsVerification"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: |-
            `rate_limited`: this client's failed authentications, or two DNS
            checks are already running. Both carry `Retry-After`.
          headers:
            Retry-After:
              description: Seconds to wait.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          description: "`unavailable`: the system resolver could not be started."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: "`timeout`: the check was not finished in 45 seconds."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/bans:
    get:
      operationId: listBans
      tags: [Bans]
      summary: List the bans in force
      description: |-
        Needs the `ban` scope, and only that: `manage:read` and `mail:read` do not open it. Ordered
        by subject and keyset-paged by it, 100 to a page by default and 500 at
        most. The rows are those `epistle ban list --json` prints. The bans are
        the server's, so a key confined to domains is refused with `403`, as is
        a key bound to an account. Without a `[database]` the answer is `404`:
        bans are not manageable.
      x-epistle-scope: [ban]
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size. Above 500 it is cut to 500; 0 is refused.
          schema:
            type: integer
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the page before.
          schema:
            type: string
      responses:
        "200":
          description: A page of bans.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BanPage"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/BanForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: addBan
      tags: [Bans]
      summary: Ban an address or a network
      description: |-
        The ban `epistle ban add` makes, by the same code. The target is an
        address or a network; `for` is a number and a unit (`s`, `m`, `h`, `d`,
        `w`), a day when absent and at most ten years. A ban of the same target
        moves to the new end. Refused with `409` for an address on the allow
        list, and with `400` for a network wider than a /16 of IPv4 or a /32 of
        IPv6, which a key may not name (the command may). A key may leave at most
        10000 manual bans in force (automatic bans are not counted) and 100
        banned networks (`409`). The body is at most 4 KiB. Audited as
        `ban.added`.
      x-epistle-scope: [ban]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddBan"
      responses:
        "201":
          description: The ban, and when it ends.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BanAdded"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/BanForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The address is on the allow list, or the key has as many manual bans or banned networks in force as it may keep.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: The body is over 4 KiB. `text/plain`.
          content:
            text/plain:
              schema:
                type: string
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableBody"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/bans/{subject}:
    delete:
      operationId: removeBan
      tags: [Bans]
      summary: Lift a ban
      description: |-
        The lift `epistle ban remove` makes, by the same code: the ban on the
        subject goes and so do its failure records, so the next failure starts
        from zero. Name the subject as the listing prints it, percent-encoded:
        an address or a network (`203.0.113.9`, `cidr:203.0.113.0/24`), or one
        an automatic ban made (`pair:alice@example.org|203.0.113.9`,
        `account:alice@example.org`). A subject with no ban and no failure
        record is `404`. Audited as `ban.removed`.
      x-epistle-scope: [ban]
      parameters:
        - $ref: "#/components/parameters/BanSubject"
      responses:
        "200":
          description: What was lifted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BanLifted"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/BanForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/bans/allow:
    get:
      operationId: listBanAllow
      tags: [Bans]
      summary: The allow list
      description: |-
        The blocks that are never banned and never counted, canonical and
        sorted, as `epistle ban allow list --json` prints them. At most 1000.
        Needs the `ban` scope.
      x-epistle-scope: [ban]
      responses:
        "200":
          description: The blocks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BanAllowList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/BanForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: addBanAllow
      tags: [Bans]
      summary: Never ban an address or a network
      description: |-
        The entry `epistle ban allow add` makes, by the same code. A network
        wider than a /16 of IPv4 or a /32 of IPv6 is refused with `400` (the
        command accepts any), and a key may leave at most 1000 blocks, 100 of them
        networks, on the list (`409`).
        A block already on the list answers `200` with `changed` false. The
        body is at most 4 KiB. Audited as `ban.allow_added`.
      x-epistle-scope: [ban]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddBanAllow"
      responses:
        "200":
          description: The block was already on the list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BanAllowChanged"
        "201":
          description: The block joined the list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BanAllowChanged"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/BanForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The key has left as many allow-list entries or allowed networks as it may keep.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: The body is over 4 KiB. `text/plain`.
          content:
            text/plain:
              schema:
                type: string
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableBody"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/bans/allow/{cidr}:
    delete:
      operationId: removeBanAllow
      tags: [Bans]
      summary: Take a block off the allow list
      description: |-
        The removal `epistle ban allow remove` makes, by the same code. Name the
        block as it was added, percent-encoded (`10.1.0.0%2F16`). A block that
        is not on the list is `404`. Audited as `ban.allow_removed`.
      x-epistle-scope: [ban]
      parameters:
        - $ref: "#/components/parameters/BanCidr"
      responses:
        "200":
          description: The block that was removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BanAllowChanged"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/BanForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/domains:
    get:
      operationId: listDomains
      tags: [Domains]
      summary: The hosted domains in the key's reach
      x-epistle-scope: [manage:read]
      responses:
        "200":
          description: The domains, and which of them are switched off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domains"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
    post:
      operationId: addDomain
      tags: [Domains]
      summary: Host a new domain
      description: |-
        Requires an unconfined write key. Names use the CLI ASCII DNS-name rules;
        leading/trailing whitespace is trimmed and ASCII case is folded.
        Creates the same DKIM key and SRS secret as epistle domain add, exclusively
        under data_dir. No configuration file is written. Duplicate names are 409.
        The response never exposes key material or the SRS secret.
      x-epistle-scope: [manage:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddDomain"
      responses:
        "201":
          description: The durable result; a changed state is applied by the file watcher.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainChanged"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Already present, in use, or the last enabled domain; the CLI refusal message is preserved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableBody"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/domains/{domain}:
    get:
      operationId: getDomain
      tags: [Domains]
      summary: One hosted domain
      description: |-
        The object `epistle domain show <domain> --json` prints for the same
        name, read from the configuration the server started with. The name is
        compared as given except for ASCII case, and `domain` in the answer is
        the name as asked. A domain outside a confined key's domains answers
        exactly like one the server does not host.
      x-epistle-scope: [manage:read]
      parameters:
        - $ref: "#/components/parameters/DomainName"
      responses:
        "200":
          description: The domain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainView"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
    put:
      operationId: setDomain
      tags: [Domains]
      summary: Set a hosted domain role and limits atomically
      description: |-
        Needs `manage:write` and the domain in the key's reach. A foreign domain is
        404 no such domain. Omitted fields stay unchanged; null quota or
        submission_rate removes the domain override, falling back to server defaults.
        quota is bytes (0 means unlimited); submission_rate is recipients per minute.
        Naming quota or submission_rate, even as null, needs an unconfined key: a
        key confined to some domains gets 403, since limits belong to the operator;
        it may still change the role. An empty body object is 400. Values already in
        effect succeed with changed false and do not write a state file. The
        configuration file is never written.
      x-epistle-scope: [manage:write]
      parameters:
        - $ref: "#/components/parameters/DomainName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDomain"
      responses:
        "200":
          description: The durable result; a changed state is applied by the file watcher.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainChanged"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Already present, in use, or the last enabled domain; the CLI refusal message is preserved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableBody"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: removeDomain
      tags: [Domains]
      summary: Stop hosting an unused domain
      description: |-
        Needs `manage:write` and the domain in the key's reach. A foreign domain is
        404 no such domain. Refused while accounts, aliases or configuration entries
        still use it, with the same blockers as epistle domain remove. The 409 names
        them only for an unconfined key; a confined key gets "domain is still in use",
        so it learns nothing about other tenants. An account created through the API
        at the same moment can still land on the domain being removed, because the
        check reads accounts.toml while account creation checks the running
        snapshot; the command has the same race.
      x-epistle-scope: [manage:write]
      parameters:
        - $ref: "#/components/parameters/DomainName"
      responses:
        "200":
          description: The durable result; a changed state is applied by the file watcher.
