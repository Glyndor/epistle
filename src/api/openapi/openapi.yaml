      security: []
      x-epistle-scope: []
      responses:
        "200":
          description: The Autodiscover document.
          content:
            application/xml:
              schema:
                type: string
  /autodiscover/autodiscover.json:
    servers:
      - url: "https://autodiscover.example.org"
        description: The `autoconfig` (HTTP) or `autoconfigs` (HTTPS) listener.
