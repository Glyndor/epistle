components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |-
        The optional static token whose SHA-256 or legacy argon2id hash is
        `[api] token_hash`, or an
        API key from `epistle api-key create` (52 lowercase base32
        characters, shown once). The header is exactly
        `Authorization: Bearer <token>`; a token over 1024 bytes is not
        considered. The static token holds every scope and reaches every
        domain.
  parameters:
    DomainAliasName:
      name: alias
      in: path
      required: true
      description: An alias domain using the CLI ASCII DNS-name rules, percent-encoded; ASCII case is ignored.
      schema:
        type: string
    DomainName:
      name: domain
      in: path
      required: true
      description: A hosted domain, as the configuration spells it; ASCII case is ignored.
      schema:
        type: string
    DnsDomain:
      name: domain
      in: query
      required: false
      description: |-
        Only this hosted domain, as the configuration spells it; ASCII case is
        ignored. A domain the server does not host and one outside the key's
        domains are both `404`. Naming a domain leaves out the mail host.
      schema:
        type: string
    BanSubject:
      name: subject
      in: path
      required: true
      description: |-
        What to lift, as `GET /api/v1/bans` lists it, percent-encoded: an
        address, `cidr:<network>`, `pair:<login>|<client>` or `account:<login>`.
      schema:
        type: string
    BanCidr:
      name: cidr
      in: path
      required: true
      description: The allowed block as it was added, percent-encoded (`10.1.0.0%2F16`).
      schema:
        type: string
    AccountName:
      name: name
      in: path
      required: true
      description: The account name (lowercase letters, digits and hyphens, at most 64 characters).
      schema:
        type: string
    MaskedAddress:
      name: address
      in: path
      required: true
      description: The full masked address, percent-encoded.
      schema:
        type: string
    ScimId:
      name: id
      in: path
      required: true
      description: The account name, which is the SCIM `id`.
      schema:
        type: string
    EmailAddress:
      name: emailaddress
      in: query
      required: true
      description: An address whose domain is hosted here.
      schema:
        type: string
  responses:
    Unauthenticated:
      description: |-
        `unauthenticated`: no `Authorization: Bearer` header, an unknown or
        expired token, a key pinned to another client IP, or a key whose
        scopes do not cover this route. All four look the same on purpose.
      headers:
        WWW-Authenticate:
          description: The scheme the API accepts (RFC 6750 section 3), always `Bearer`.
          schema:
            type: string
            enum: [Bearer]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AccountBoundKey:
      description: |-
        `forbidden`: the key is bound to one account and this route is
        administrative. Bound keys reach JMAP, `/api/v1/send`,
        `/api/v1/deliveries` and that account's suppression list only.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    BanForbidden:
      description: |-
        `forbidden`: the key does not hold the `ban` scope, is confined to some
        domains (the bans belong to the whole server), or is bound to one
        account.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AuthRateLimited:
      description: |-
        `rate_limited`: this client address already made 20 requests with
        credentials that did not hold in the last 60 seconds, so every
        request from it, valid or not, is refused until the window passes;
        or too many credential checks are already waiting. Window-based refusals
        include `Retry-After` with the remaining seconds rounded up. Queue
        saturation has no fixed window and answers `Retry-After: 1`.
      headers:
        Retry-After:
          description: Seconds to wait; the remaining authentication window rounded up, or 1 when the queue is full.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: |-
        `not_found`. The message says what is missing: `no such account`,
        `no such dynamic account` (the account exists but is declared in the
        configuration file), `no such masked address`, `no such queue entry`,
        `no such domain`, `the delivery log is disabled`, `bans are not manageable`
        (no `[database]`), `no ban or failure record`, `not on the allow list`. Lifting a network ban or removing an allow-list block
        wider than a key may name is `400`. An account or a
        domain outside a confined key's domains answers exactly like one that
        does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InvalidInput:
      description: |-
        `invalid_input` with the reason in `message`, or, when the HTTP layer
        could not read the request (malformed JSON, a query or path value of
        the wrong type, an unreadable UUID), a `text/plain` message. As a
        problem, `code` is the cause (`field_missing`, `field_out_of_range`,
        `value_not_allowed`, or `invalid_input` when none applies) and
        `errors[].field` names the request field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
        text/plain:
          schema:
            type: string
    UnreadableRequest:
      description: The HTTP layer could not read the request (malformed JSON, a bad query or path value). `text/plain`, no `error` object.
      content:
        text/plain:
          schema:
            type: string
    UnsupportedMediaType:
      description: The request has no `Content-Type` of `application/json`. `text/plain`.
      content:
        text/plain:
          schema:
            type: string
    UnprocessableBody:
      description: A required field is missing or has the wrong type. `text/plain` naming the field, no `error` object.
      content:
        text/plain:
          schema:
            type: string
    Internal:
      description: |-
        `internal`: the server could not do it for a reason of its own
        (storage). The message never carries details. Retrying may work.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ScimBadRequest:
      description: A SCIM error with status "400".
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimConflict:
      description: A SCIM error with status 409, the user name or an address is taken, or the tenant is at its account cap.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimNotFound:
      description: A SCIM error with status "404". An account outside a confined key's domains answers like one that does not exist.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimNotImplemented:
      description: A SCIM error with status 501, Groups are not supported.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimInternal:
      description: A SCIM error with status "500".
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    OAuthError:
      description: |-
        An RFC 6749 error, `{"error": "<code>"}`: `invalid_request`,
        `invalid_grant`, `unsupported_grant_type`, `authorization_pending`,
        `expired_token` or `server_error`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthErrorBody"
    OAuthSlowDown:
      description: |-
        `{"error": "slow_down"}`: the device code was polled before its
        interval passed, or too many grants are pending. `Retry-After` gives
        the seconds until the next allowed poll or blocking grant expiry.
      headers:
        Retry-After:
          description: Remaining polling or grant expiry wait in seconds.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthErrorBody"
    OAuthTemporarilyUnavailable:
      description: |-
        `{"error": "temporarily_unavailable"}`: the server is at a cap it
        cannot lift right now, so nothing was issued. `Retry-After` gives
        the seconds until the codes counting against the cap expire.
      headers:
        Retry-After:
          description: Remaining wait for the codes that hold the room, in seconds.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthErrorBody"
  schemas:
    DomainChanged:
      type: object
      required: [changed, domain, reload]
      properties:
        changed:
          type: boolean
        domain:
          type: string
          description: Canonical hosted domain; for alias routes this is the target.
        reload:
          type: string
          enum: [watcher, none]
          description: The watcher applies a durable change asynchronously; none for a no-op.
    AddDomain:
      type: object
      additionalProperties: false
      required: [domain]
      properties:
        domain:
          type: string
          description: ASCII DNS name; Unicode names must use an A-label, as in the CLI.
        role:
          type: string
          enum: [full, send-only, receive-only]
          default: full
        shared_dkim_key:
          type: boolean
          default: false
    SetDomain:
      type: object
      additionalProperties: false
      properties:
        role:
          type: [string, "null"]
          enum: [full, send-only, receive-only, null]
          description: Omitted or null leaves the role unchanged.
        quota:
          type: [integer, "null"]
          minimum: 0
          maximum: 9223372036854775807
          description: Bytes; 0 means unlimited, null clears the domain override, omitted keeps it.
        submission_rate:
          type: [integer, "null"]
          minimum: 1
          maximum: 4294967295
          description: Recipients per minute; null clears the domain override, omitted keeps it.
    AliasRow:
      type: object
      required: [address, members, senders, hidden, list_id, enabled]
      properties:
        address:
          type: string
        members:
          type: array
          items:
            type: string
        senders:
          type: array
          items:
            type: string
          description: Addresses allowed to send as the alias; empty means any member.
        hidden:
          type: boolean
          description: Whether the membership stays out of directory queries.
        list_id:
          type: [string, "null"]
        enabled:
          type: boolean
          description: false when `epistle alias disable` switched it off.
    AliasPage:
      type: object
      required: [aliases]
      properties:
        aliases:
          type: array
          items:
            $ref: "#/components/schemas/AliasRow"
        next_cursor:
          type: string
          description: Present when more aliases remain; absent on the last page.
    CreateAlias:
      type: object
      additionalProperties: false
      required: [alias]
      properties:
        alias:
          type: string
          maxLength: 320
        members:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 320
          description: Addresses of accounts of this server. Not with `target_account`.
        target_account:
          type: string
          description: An account the alias is for; its address in the alias's domain is the member. Not with `members`.
        dry_run:
          type: boolean
          default: false
    AliasCreated:
      type: object
      required: [alias, changed, dry_run, reload]
      properties:
        alias:
          $ref: "#/components/schemas/AliasRow"
        changed:
          type: boolean
        dry_run:
          type: boolean
        reload:
          type: string
          enum: [watcher, none]
    AliasRemoved:
      type: object
      required: [alias, changed, dry_run, reload]
      properties:
        alias:
          type: string
        changed:
          type: boolean
        dry_run:
          type: boolean
        reload:
          type: string
          enum: [watcher, none]
    AddDomainAlias:
      type: object
      additionalProperties: false
      required: [alias]
      properties:
        alias:
          type: string
          description: ASCII DNS name of the alias; the target is the path domain.
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |-
                Stable, for programs. One of `unauthenticated` (401),
                `forbidden`, `forbidden_from` and `sending_off` (403), `not_found` (404),
                `invalid_input` (400), `conflict`, `already_sent` and `limit_reached`
                (409), `message_too_large`
                and `scan_too_large` (413), `virus_detected`,
                `attachment_refused`, `too_many_header_fields` and
                `marketing_refused` (422), `rate_limited` (429), `internal`
                (500), `scan_unavailable`, `evidence_unavailable` and `unavailable` (503),
                `timeout` (504),
                `mailbox_full` (507). New codes can appear.
            message:
              type: string
              description: For people; its wording is not a contract.
    Problem:
      type: object
      description: |-
        An RFC 9457 problem, sent as `application/problem+json` to a client
        whose `Accept` names that type. The `error` object stays the default.
      required: [type, title, status, detail, code, instance, request_id]
      properties:
        type:
          type: string
          description: A stable URN, `urn:epistle:problem:` followed by `code`.
        title:
          type: string
          description: A short summary of the type; the same for every occurrence.
        status:
          type: integer
        detail:
          type: string
          description: For people; its wording is not a contract.
        code:
          type: string
          description: |-
            Stable, for programs. The code of `ApiError`, except that an
            `invalid_input` with a known cause carries that cause instead:
            `field_missing`, `field_out_of_range` or `value_not_allowed`.
        instance:
          type: string
          description: '`urn:uuid:` followed by `request_id`, naming this occurrence.'
        request_id:
          type: string
          format: uuid
          description: Also written to the server log with the code and the route.
        errors:
          type: array
          description: Present for an input error whose field is known.
          items:
            type: object
            required: [field, detail]
            properties:
              field:
                type: string
                description: The request field, as named in the JSON body or the query.
              detail:
                type: string
    Status:
      type: object
      required: [version, domains, accounts]
      properties:
        version:
          type: string
          description: The server version.
        domains:
          type: integer
          description: Hosted domains in the key's reach.
        accounts:
          type: integer
          description: Accounts in the key's reach.
        queue_size:
          type: integer
          description: Messages in the outbound queue. Absent for a key confined to some domains, because the queue is shared.
    VerifyRequest:
      type: object
      required: [name, password]
      properties:
        name:
          type: string
          description: The login name or one of the account's addresses.
        password:
          type: string
    VerifyResponse:
      type: object
      required: [valid, admin]
      properties:
        valid:
          type: boolean
        admin:
          type: boolean
          description: Always false when `valid` is false.
    DnsRecords:
      type: object
      required: [records, skipped, complete]
      properties:
        records:
          type: array
          description: The records to publish, the rows `epistle dns-records --json` prints.
          items:
            $ref: "#/components/schemas/DnsRecord"
        skipped:
          type: array
          description: The groups the configuration does not publish, with how many records each holds; those records are not missing.
          items:
            type: object
            required: [group, records]
            properties:
              group:
                type: string
                description: The name the configuration writes for the group.
              records:
                type: integer
        complete:
          type: boolean
          description: False when an input could not be read (a DKIM key, the certificate), so the list may lack a record the configuration needs.
    DnsRecord:
      type: object
      required: [name, ttl, type, value]
      properties:
        name:
          type: string
        ttl:
          type: integer
        type:
          type: string
          description: The record type, such as `TXT`, `MX` or `CNAME`.
        value:
          type: string
          description: The value in presentation form; a TXT value is unsplit.
    DnsVerification:
      type: object
      required: [ok, groups]
      properties:
        ok:
          type: boolean
          description: False when an expected record is missing. A lookup that failed does not make it false.
        groups:
          type: array
          items:
            type: object
            required: [name, checks]
            properties:
              name:
                type: string
                description: The mail hostname or a domain.
              checks:
                type: array
                items:
                  type: object
                  required: [kind, name, status, detail]
                  properties:
                    kind:
                      type: string
                      description: The record checked, such as `MX`, `SPF` or `DKIM ed1`.
                    name:
                      type: string
                      description: The DNS name looked up.
                    status:
                      type: string
                      enum: [ok, missing, error, skipped]
                    detail:
                      type: string
                      description: What was found.
    BanRow:
      type: object
      required: [subject, reason, until]
      properties:
        subject:
          type: string
          description: "`ip:<address>`, `cidr:<network>`, `pair:<login>|<client>` or `account:<login>`."
        reason:
          type: string
          description: The rule that raised the ban, or `manual ban`.
        until:
          type: integer
          description: Unix seconds the ban ends.
    BanPage:
      type: object
      required: [bans]
      properties:
        bans:
          type: array
          items:
            $ref: "#/components/schemas/BanRow"
        next_cursor:
          type: string
          description: Pass as `cursor` to fetch the next page; absent on the last page.
    AddBan:
      type: object
      required: [target]
      additionalProperties: false
      properties:
        target:
          type: string
          description: An address (`203.0.113.9`) or a network (`203.0.113.0/24`).
        for:
          type: string
          description: How long the ban lasts, a number and a unit `s`, `m`, `h`, `d` or `w`. A day when absent.
    BanAdded:
      type: object
      required: [changed, target, until]
      properties:
        changed:
          type: boolean
        target:
          type: string
        until:
          type: integer
          description: Unix seconds the ban ends.
    BanLifted:
      type: object
      required: [changed, target, bans, failures]
      properties:
        changed:
          type: boolean
        target:
          type: string
        bans:
          type: integer
          description: Bans removed.
        failures:
          type: integer
          description: Failure records cleared.
    BanAllowList:
      type: object
      required: [allow]
      properties:
        allow:
          type: array
          items:
            type: string
    AddBanAllow:
      type: object
      required: [cidr]
      additionalProperties: false
      properties:
        cidr:
          type: string
          description: An address or a network.
    BanAllowChanged:
      type: object
      required: [changed, cidr]
      properties:
        changed:
          type: boolean
          description: False when the block was already on the list.
        cidr:
          type: string
          description: The block in its canonical form.
    Domains:
      type: object
      required: [domains, disabled, details]
      properties:
        domains:
          type: array
          items:
            type: string
        disabled:
          type: array
          description: The domains above that are switched off and take no mail.
          items:
            type: string
        details:
          type: array
          description: The same domains, each the row `epistle domain list --json` prints for it.
          items:
            $ref: "#/components/schemas/DomainRow"
    DomainRow:
      type: object
      required: [domain, enabled, role, aliases_to, aliases_from]
      properties:
        domain:
          type: string
        enabled:
          type: boolean
          description: "`false` for a domain in `disabled_domains`: mail for it is rejected and nobody may send as it."
        role:
          type: string
          enum: [full, send-only, receive-only, disabled]
        aliases_to:
          type: array
          description: The alias domains that resolve as this one.
          items:
            type: string
        aliases_from:
          type: array
          description: The domains this one resolves as, when it is itself an alias.
          items:
            type: string
    DomainView:
      type: object
      required: [domain, enabled, role, quota, submission_rate, aliases_to, aliases_from, accounts, aliases]
      properties:
        domain:
          type: string
          description: The domain as it was asked for.
        enabled:
          type: boolean
        role:
          type: string
          enum: [full, send-only, receive-only, disabled]
        quota:
          type: [integer, "null"]
          description: Default storage quota of the domain's accounts in bytes, when the domain overrides the server's.
        submission_rate:
          type: [integer, "null"]
          description: Recipients per minute a sender in the domain may submit, when the domain overrides the server's.
        aliases_to:
          type: array
          items:
            type: string
        aliases_from:
          type: array
          items:
            type: string
        accounts:
          type: array
          description: Addresses in the domain held by accounts declared in the configuration file; accounts made through the API are not listed.
          items:
            type: string
        aliases:
          type: array
          description: The `[[alias]]` addresses in the domain.
          items:
            type: string
    AccountView:
      type: object
      required: [name, display_name, addresses, dynamic]
      properties:
        name:
          type: string
        display_name:
          type: [string, "null"]
        addresses:
          type: array
          items:
            type: string
        dynamic:
          type: boolean
          description: True for an account made through the API (deletable here); false for one declared in the configuration file.
    CreateAccount:
      type: object
      required: [name, addresses, password]
      properties:
        name:
          type: string
          maxLength: 64
          description: Lowercased on the way in; then lowercase letters, digits and hyphens, not starting with a hyphen.
        addresses:
          type: array
          items:
            type: string
          description: Delivery addresses, each in a hosted domain.
        password:
          type: string
          minLength: 12
          maxLength: 64
          description: Printable ASCII, not in the bundled breach list.
        display_name:
          type: string
          maxLength: 128
          description: The person's name, trimmed; no control characters.
    AccountRemoved:
      type: object
      required: [removed, mailbox_files, masked_addresses, app_passwords, suppressed_addresses, correspondent_addresses, queued_messages_discarded, queued_messages_left, bayes_tokens_removed]
      properties:
        removed:
          type: string
        mailbox_files:
          type: integer
          description: Files removed from the account's mailbox directory, the directory included.
        masked_addresses:
          type: integer
        app_passwords:
          type: integer
        suppressed_addresses:
          type: integer
          description: Entries of the account's own suppression list.
        correspondent_addresses:
          type: integer
        queued_messages_discarded:
          type: integer
          description: Non-zero only with `queue=discard`.
        queued_messages_left:
          type: integer
          description: Non-zero only with `queue=drain`.
        bayes_tokens_removed:
          type: integer
    Updated:
      type: object
      required: [updated]
      properties:
        updated:
          type: string
          description: The account name.
    Mailboxes:
      type: object
      required: [mailboxes, tree]
      properties:
        mailboxes:
          type: array
          items:
            type: string
        tree:
          type: array
          items:
            type: object
            required: [id, name, parent_id]
            properties:
              id:
                type: string
                description: The stored name, `/` between levels.
              name:
                type: string
                description: The last level, for people.
              parent_id:
                type: [string, "null"]
                description: The nearest mailbox above it that exists.
    MaskedAddress:
      type: object
      required: [address, label, enabled, created_at]
      properties:
        address:
          type: string
        label:
          type: string
        enabled:
          type: boolean
        created_at:
          type: integer
          description: Epoch seconds.
        last_used_at:
          type: integer
          description: Epoch seconds of the last delivery; absent until it is used.
    RemovedAddress:
      type: object
      required: [removed]
      properties:
        removed:
          type: string
    DeliveryOutcome:
      type: string
      enum: [delivered, deferred, failed, suppressed, canceled]
      description: |-
        `delivered`: the remote server accepted the message for this
        recipient. `deferred`: a temporary failure, retried later; a new
        record is written only when the reason changes. `failed`: refused
        for good or expired in the queue. `suppressed`: a suppression list
        refused the recipient before any attempt. `canceled`: an operator
        removed the entry with the CLI first.
    DeliveryEntry:
      type: object
      required: [time, spool_id, account, from, recipient, outcome, remote, reply, attempt, extra]
      properties:
        time:
          type: integer
          description: Epoch seconds.
        spool_id:
          type: string
          format: uuid
          description: The `queued` id of the message.
        account:
          type: [string, "null"]
          description: The local account that submitted it; null for mail relayed from another server.
        from:
          type: string
          description: The envelope sender; empty for a bounce.
        recipient:
          type: string
        outcome:
          $ref: "#/components/schemas/DeliveryOutcome"
        remote:
          type: [string, "null"]
          description: The remote host that answered, when one did.
        reply:
          type: [string, "null"]
          description: The first 200 bytes of the remote reply.
        attempt:
          type: integer
          description: The attempt, counting from 1; 0 for a record with no attempt (suppression, cancel).
        extra:
          type: object
          additionalProperties:
            type: string
          description: The `extra` map the send request carried; empty otherwise.
    MailClass:
      type: string
      enum: [transactional, marketing, personal]
    SendPart:
      type: object
      required: [data]
      properties:
        name:
          type: string
          description: File name. At most 1000 bytes, no control characters.
        content_type:
          type: string
          description: Detected from the bytes and the name when empty. At most 1000 bytes.
        data:
          type: string
          description: Base64, standard alphabet with padding.
        content_id:
          type: string
          description: Required for `inline` parts, which the HTML refers to as `cid:<content_id>`.
    SendRecipient:
      description: |-
        A bare address, or an object with a display name. A string of the
        form `Name <address>` is refused: use the object. The name is
        written as a quoted string when it holds a comma, a quote, a
        backslash, parentheses, angle brackets or an at sign, and as RFC 2047
        encoded-words when it holds non-ASCII text. Control characters, line
        breaks and more than 128 characters are refused with the field
        `to[2].name`; the name is never dropped or altered. An address
        given twice is one recipient and the first name wins.
      oneOf:
        - type: string
          example: ana@example.org
        - type: object
          required: [name, address]
          additionalProperties: false
          properties:
            name:
              type: string
              maxLength: 128
              example: Ana Pérez
            address:
              type: string
              example: ana@example.org
    SendRequest:
      type: object
      required: [from, to]
      description: |-
        Fields the server does not know are ignored. Every value that ends
        up on a header line, in every field below including the attachment
        names and types, may not hold a control character other than a tab
        and is at most 1000 bytes.
      properties:
        from:
          type: string
          description: A bare address (no display name; use `from_name`) that the acting account owns.
        from_name:
          type: string
          maxLength: 128
          description: The sender's name for `From`. Absent uses the account's display name. Non-ASCII is written as RFC 2047.
        to:
          type: array
          items:
            $ref: "#/components/schemas/SendRecipient"
        cc:
          type: array
          items:
            $ref: "#/components/schemas/SendRecipient"
          default: []
        bcc:
          type: array
          items:
            $ref: "#/components/schemas/SendRecipient"
          default: []
          description: "Envelope only; never written into the message, and a name here appears in no header. With `to` and `cc` empty the message carries `To: undisclosed-recipients:;`."
        reply_to:
          description: One recipient, or a list of at most 10, written as one `Reply-To` header. An empty list writes none.
          oneOf:
            - $ref: "#/components/schemas/SendRecipient"
            - type: array
              maxItems: 10
              items:
                $ref: "#/components/schemas/SendRecipient"
        sender:
          type: string
          description: Written as `Sender`. Must be an address the account owns, like `from`.
        envelope_from:
          type: string
          description: The envelope sender (`MAIL FROM`), where bounces and delivery reports go. Must be an address the account owns, like `from`. Absent is `from`. An empty string is refused; the null sender is not offered. Held to the key's domains and to the tenants' sending limits like `from`.
        subject:
          type: string
          default: ""
          description: A request with no subject, no `text`, no `html` and no attachment or inline part is an empty message and is refused.
        text:
          type: string
        html:
          type: string
          description: With `text`, both go into a `multipart/alternative`, text first.
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/SendPart"
          default: []
        inline:
          type: array
          items:
            $ref: "#/components/schemas/SendPart"
          default: []
          description: Attachments and inline parts together are at most 100.
        in_reply_to:
          type: string
          description: Exactly one `<id@domain>` message id.
        references:
          type: string
          description: Up to 100 `<id@domain>` message ids separated by white space.
        importance:
          type: string
          enum: [high, normal, low]
          description: Writes `Importance` and `X-Priority`. Also accepted as `priority`. Case-insensitive.
        list_unsubscribe:
          type: array
          maxItems: 4
          items:
            type: string
          description: "`mailto:` and `https://` URLs, written as `List-Unsubscribe`."
        list_unsubscribe_post:
          type: boolean
          default: false
          description: Adds `List-Unsubscribe-Post` (RFC 8058). Needs an `https://` URL in `list_unsubscribe`.
        auto_submitted:
          type: string
          enum: ["no", auto-generated, auto-replied, auto-notified]
          description: |-
            Written as `Auto-Submitted`. Case-insensitive. A value in the
            request always wins. When absent and the API key has the per-key
            setting enabled, the server writes `auto-generated`.
        auto_response_suppress:
          type: boolean
          default: false
          description: "Writes `X-Auto-Response-Suppress: DR, NDR, RN, NRN, OOF, AutoReply` when true. Independent of auto_submitted and the server mail setting."
        feedback_id:
          type: string
          description: Written as `Feedback-ID`. Printable ASCII without spaces.
        headers:
          type: object
          maxProperties: 32
          additionalProperties:
            type: string
          description: Custom headers. A name is `X-` followed by letters, digits and hyphens, at most 76 characters, and neither `X-Priority` nor `X-Auto-Response-Suppress`.
        save_sent:
          type: boolean
          description: Whether a copy goes to the account's Sent folder. Absent follows the account setting. Transactional mail is never copied.
        extra:
          type: object
          maxProperties: 10
          additionalProperties:
            type: string
            maxLength: 256
          description: |-
            A correlation map returned by `/api/v1/deliveries` and in the
            webhook events of this message, never written into the message.
            Keys are printable ASCII without spaces, at most 64 bytes;
            values at most 256 bytes.
        class:
          $ref: "#/components/schemas/MailClass"
    Queued:
      type: object
      required: [queued, message_id, class]
      properties:
        queued:
          type: string
          format: uuid
          description: The queue id, also the `spool_id` of delivery records and webhook events.
        message_id:
          type: string
          description: The `Message-ID` header of the message as written, with its angle brackets (`<id@domain>`). It is the value a reply puts in `in_reply_to` and `references`.
        class:
          $ref: "#/components/schemas/MailClass"
        cancel_until:
          type: string
          format: date-time
          description: When the send delay releases the message; until then `DELETE /api/v1/send/{id}` takes it back. Absent when nothing holds the message (the default).
        suppressed:
          type: array
          items:
            type: string
          description: Recipients dropped because they are on a suppression list (marketing only). Absent when none.
    JmapSession:
      type: object
      description: The RFC 8620 Session resource.
      required: [capabilities, accounts, primaryAccounts, username, apiUrl, downloadUrl, uploadUrl, eventSourceUrl, state]
      properties:
        capabilities:
          type: object
          description: |-
            `urn:ietf:params:jmap:core` (with `maxSizeUpload`,
            `maxConcurrentUpload`, `maxSizeRequest`, `maxConcurrentRequests`,
            `maxCallsInRequest`, `maxObjectsInGet`, `maxObjectsInSet`),
            `mail`, `submission`, `quota`, `vacationresponse`, `sieve` and
            `websocket`.
        accounts:
          type: object
          description: The accounts the credential reaches, keyed by account name, which is the JMAP account id.
        primaryAccounts:
          type: object
        username:
          type: string
          description: Always empty.
        apiUrl:
          type: string
        downloadUrl:
          type: string
        uploadUrl:
          type: string
        eventSourceUrl:
          type: string
        state:
          type: string
    JmapRequest:
      type: object
      required: [methodCalls]
      properties:
        using:
          type: array
          items:
            type: string
          description: Accepted and ignored.
        methodCalls:
          type: array
          maxItems: 16
          description: Each call is `[name, arguments, callId]`.
          items:
            type: array
            minItems: 3
            maxItems: 3
    JmapResponse:
      type: object
      required: [methodResponses]
      properties:
        methodResponses:
          type: array
          items:
            type: array
    JmapProblem:
      type: object
      description: An RFC 7807 problem as RFC 8620 uses it.
      required: [type, status, detail]
      properties:
        type:
          type: string
          description: "`urn:ietf:params:jmap:error:<kind>`, for example `limit`, `notFound`, `invalidArguments`, `forbidden`, `serverFail`."
        status:
          type: integer
        detail:
          type: string
        limit:
          type: string
          description: For a `limit` problem, the limit that applied, such as `maxCallsInRequest` or `storage`.
    ScimEmail:
      type: object
      required: [value]
      properties:
        value:
          type: string
        type:
          type: string
          description: Rendered as `work` for the first address and `other` for the rest; ignored on input.
        primary:
          type: boolean
    ScimUser:
      type: object
      required: [userName, active]
      properties:
        schemas:
          type: array
          items:
            type: string
        id:
          type: string
          readOnly: true
          description: The account name.
        externalId:
          type: string
        userName:
          type: string
        displayName:
          type: string
        active:
          type: boolean
          description: False means the account is disabled.
        emails:
          type: array
          items:
            $ref: "#/components/schemas/ScimEmail"
        name:
          type: object
          properties:
            givenName:
              type: string
            familyName:
              type: string
        password:
          type: string
          writeOnly: true
          description: Same policy as account creation (12 to 64 printable ASCII characters).
    ScimList:
      type: object
      required: [schemas, totalResults, Resources, startIndex, itemsPerPage]
      properties:
        schemas:
          type: array
          items:
            type: string
        totalResults:
          type: integer
          description: The number of users on this page, not the number that match.
        Resources:
          type: array
          items:
            $ref: "#/components/schemas/ScimUser"
        startIndex:
          type: integer
        itemsPerPage:
          type: integer
    ScimPatch:
      type: object
      required: [Operations]
      properties:
        schemas:
          type: array
          items:
            type: string
        Operations:
          type: array
          items:
            type: object
            required: [op, path]
            properties:
              op:
                type: string
                enum: [replace, add]
              path:
                type: string
                enum: [active, password, displayName]
              value:
                description: A boolean for `active`, a string for the others.
    ScimError:
      type: object
      required: [schemas, status, detail]
      properties:
        schemas:
          type: array
          items:
            type: string
        status:
          type: string
          description: The HTTP status as a string.
        detail:
          type: string
    DeviceAuthorizationRequest:
      type: object
      required: [client_id]
      properties:
        client_id:
          type: string
        scope:
          type: string
          description: Space-separated read, write, send; omitted means read.
    DeviceAuthorization:
      type: object
      required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval]
      properties:
        device_code:
          type: string
        user_code:
          type: string
          description: "`XXXX-XXXX` from an alphabet without look-alike characters."
        verification_uri:
          type: string
          description: Always `/oauth/device/approve`, a relative path.
        verification_uri_complete:
          type: string
        expires_in:
          type: integer
          description: "600."
        interval:
          type: integer
          description: "5."
        scope:
          type: string
          description: The scopes the device asked for, space-separated. The approval has to name them.
    DeviceApproveRequest:
      type: object
      required: [user_code]
      properties:
        scope:
          type: string
          description: |
            The scopes being approved. Required when the device asked for anything
            beyond `read`, and it has to name exactly the scopes the device asked
            for (any order); otherwise the answer is `400 invalid_grant`.
        user_code:
          type: string
        login:
          type: string
        password:
          type: string
    RevokeRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          writeOnly: true
    AuthorizeRequest:
      type: object
      required: [client_id, code_challenge, code_challenge_method]
      properties:
        client_id:
          type: string
        code_challenge:
          type: string
        code_challenge_method:
          type: string
          enum: [S256]
        scope:
          type: string
          description: Space-separated read, write, send; omitted means read.
        state:
          type: string
        login:
          type: string
        password:
          type: string
    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum: ["urn:ietf:params:oauth:grant-type:device_code", authorization_code, refresh_token]
        device_code:
          type: string
        refresh_token:
          type: string
        scope:
          type: string
          description: With `refresh_token`, a subset of the scopes granted.
        code:
          type: string
        code_verifier:
          type: string
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token:
          type: string
          description: An ES256 JWT with `sub` the account name.
        scope:
          type: string
          description: The granted space-separated scopes.
        token_type:
          type: string
          enum: [Bearer]
        refresh_token:
          type: string
          description: Present only when `[oauth] refresh_token_ttl_secs` is set.
        expires_in:
          type: integer
          description: The access token lifetime in seconds, 3600 unless configured.
    OAuthErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: string
