        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/send/{id}:
    delete:
      operationId: cancelSend
      tags: [Send]
      summary: Take back a message the send delay still holds
      description: |-
        With `[queue.undo_send]` on, what an account sends waits on disk until
        its release time (`cancel_until` in the answer to `POST /api/v1/send`).
        Until then this removes it, and nothing of it is delivered or queued.
        A key bound to one account cancels that account's messages, a key
        confined to some domains those of the accounts it reaches, an
        unconfined key any. An id that is unknown, belongs to an account the
        key does not reach, or was never held answers the same `404`. A message
        already handed on answers `409 already_sent`.
      x-epistle-scope: [send, manage:write]
      parameters:
        - name: id
          in: path
          required: true
          description: The `queued` id of the send.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The message was taken back.
          content:
            application/json:
              schema:
                type: object
                required: [canceled]
                properties:
                  canceled:
                    type: string
                    format: uuid
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: No such pending message for this key.
        "409":
          description: The message was already handed on (`already_sent`).
  /api/v1/send:
    post:
      operationId: sendMail
      tags: [Send]
      summary: Build a message from JSON and submit it
      description: |-
        The message takes the path of SMTP submission: DKIM-signed for the
        sender's domain when mail leaves the server, delivered at once to
        local recipients, queued for the rest. The `queued` id names the
        queue entry and is the `spool_id` of delivery records and webhook
        events. There is no idempotency key: a retried request is a second
        message.

        The sender (`from`, and `sender` when given) must be an address the
        acting account owns. A key bound to one account acts for that
        account; any other key acts for the account that owns `from`, if the
        key reaches it. Anything else answers `403 forbidden_from`, the same
        whether the address belongs to another account or to none.

        A request body larger than `[server] max_message_size` (25 MiB by
        default) is refused before it is read with a plain-text `413`; one
        whose built message is larger answers `413 message_too_large`.

        When the request omits `auto_submitted` and the API key has the
        per-key setting enabled, the server writes
        `Auto-Submitted: auto-generated`. A value in the request always wins.
        Other credentials and other send paths do not receive this default.
      x-epistle-scope: [send]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendRequest"
      responses:
        "200":
          description: The message was accepted for delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queued"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |-
            `forbidden_from`: the sender is not an address the credential may
            act for. `sending_off`: the account's send switch is off. Also
            `forbidden` when the bound account is disabled or gone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: |-
            `message_too_large` (JSON) when the built message exceeds the
            limit, or `scan_too_large` (JSON) when the message is too large
            for the content scan and the server lets nothing pass unscanned.
            A request body over the limit is `text/plain`: `Failed to buffer
            the request body: length limit exceeded`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            text/plain:
              schema:
                type: string
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: |-
            Refused for its content, and sending it again unchanged is
            refused again: `virus_detected`, `attachment_refused`,
            `too_many_header_fields`, `marketing_refused` (marketing mail
            without a working one-click unsubscribe, or every recipient on a
            suppression list). A missing or mistyped field is a `text/plain`
            `422` instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            text/plain:
              schema:
                type: string
        "429":
          description: |-
            `rate_limited` from the authentication limiter (too many failed
            attempts from this client), or from the sending limits: the
            per-account or per-tenant submission rate (`sending rate limit
            exceeded; retry later`) or the daily cap on first-time
            recipients (`too many new recipients today; retry tomorrow`).
            Nothing was sent. The message tells them apart. `Retry-After`
            gives the seconds to wait: the remaining authentication window
            rounded up, 60 for a submission rate limit, 86400 for the daily
            cap on first-time recipients.
          headers:
            Retry-After:
              description: Seconds to wait before the request can succeed.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          description: |-
            Nothing was sent and retrying later works: `scan_unavailable`
            (the content scan cannot run now) or `evidence_unavailable`
            (transactional mail whose evidence cannot be recorded, or is held
            until an operator acknowledges a break).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "507":
          description: |-
            `mailbox_full`: a local recipient's mailbox is full or would be
            with this message. Nothing was queued for anyone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /.well-known/jmap:
    get:
      operationId: jmapWellKnown
      tags: [JMAP]
      summary: JMAP autodiscovery (RFC 8620 section 2.2)
      description: |-
        Answers the Session resource itself, not a redirect to
        `/jmap/session`. A key bound to one account is allowed here.
      x-epistle-scope: [mail:read]
