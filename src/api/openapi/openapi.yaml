components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |-
        The static token whose `sha256:` hash is `[api] token_hash`, or an
        API key from `epistle api-key create` (52 lowercase base32
        characters, shown once). The header is exactly
        `Authorization: Bearer <token>`; a token over 1024 bytes is not
        considered. The static token holds every scope and reaches every
        domain.
  parameters:
    AccountName:
      name: name
      in: path
      required: true
      description: The account name (lowercase letters, digits and hyphens, at most 64 characters).
      schema:
        type: string
    MaskedAddress:
      name: address
      in: path
      required: true
      description: The full masked address, percent-encoded.
      schema:
        type: string
    ScimId:
      name: id
      in: path
      required: true
      description: The account name, which is the SCIM `id`.
      schema:
        type: string
    EmailAddress:
      name: emailaddress
      in: query
      required: true
      description: An address whose domain is hosted here.
      schema:
        type: string
  responses:
    Unauthenticated:
      description: |-
        `unauthenticated`: no `Authorization: Bearer` header, an unknown or
        expired token, a key pinned to another client IP, or a key whose
        scopes do not cover this route. All four look the same on purpose.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AccountBoundKey:
      description: |-
        `forbidden`: the key is bound to one account and this route is
        administrative. Bound keys reach JMAP, `/api/v1/send` and
        `/api/v1/deliveries` only.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AuthRateLimited:
      description: |-
        `rate_limited`: this client address already made 20 requests with
        credentials that did not hold in the last 60 seconds, so every
        request from it, valid or not, is refused until the window passes;
        or too many credential checks are already waiting. There is no
        `Retry-After`; wait a minute.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: |-
        `not_found`. The message says what is missing: `no such account`,
        `no such dynamic account` (the account exists but is declared in the
        configuration file), `no such masked address`, `no such queue entry`,
        `the delivery log is disabled`. An account outside a confined key's
        domains answers exactly like one that does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InvalidInput:
      description: |-
        `invalid_input` with the reason in `message`, or, when the HTTP layer
        could not read the request (malformed JSON, a query or path value of
        the wrong type, an unreadable UUID), a `text/plain` message.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
        text/plain:
          schema:
            type: string
    UnreadableRequest:
      description: The HTTP layer could not read the request (malformed JSON, a bad query or path value). `text/plain`, no `error` object.
      content:
        text/plain:
          schema:
            type: string
    UnsupportedMediaType:
      description: The request has no `Content-Type` of `application/json`. `text/plain`.
      content:
        text/plain:
          schema:
            type: string
    UnprocessableBody:
      description: A required field is missing or has the wrong type. `text/plain` naming the field, no `error` object.
      content:
        text/plain:
          schema:
            type: string
    Internal:
      description: |-
        `internal`: the server could not do it for a reason of its own
        (storage). The message never carries details. Retrying may work.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ScimBadRequest:
      description: A SCIM error with status "400".
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimConflict:
      description: A SCIM error with status 409, the user name or an address is taken, or the tenant is at its account cap.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimNotFound:
      description: A SCIM error with status "404". An account outside a confined key's domains answers like one that does not exist.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimNotImplemented:
      description: A SCIM error with status 501, Groups are not supported.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimInternal:
      description: A SCIM error with status "500".
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    OAuthError:
      description: |-
        An RFC 6749 error, `{"error": "<code>"}`: `invalid_request`,
        `invalid_grant`, `unsupported_grant_type`, `authorization_pending`,
        `expired_token` or `server_error`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthErrorBody"
    OAuthSlowDown:
      description: |-
        `{"error": "slow_down"}`: the device code was polled before its
        interval passed, or too many grants are pending.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthErrorBody"
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |-
                Stable, for programs. One of `unauthenticated` (401),
                `forbidden` and `forbidden_from` (403), `not_found` (404),
                `invalid_input` (400), `conflict` (409), `message_too_large`
                and `scan_too_large` (413), `virus_detected`,
                `attachment_refused`, `too_many_header_fields` and
                `marketing_refused` (422), `rate_limited` (429), `internal`
                (500), `scan_unavailable` and `evidence_unavailable` (503),
                `mailbox_full` (507). New codes can appear.
            message:
              type: string
              description: For people; its wording is not a contract.
    Status:
      type: object
      required: [version, domains, accounts]
      properties:
        version:
          type: string
          description: The server version.
        domains:
          type: integer
          description: Hosted domains in the key's reach.
        accounts:
          type: integer
          description: Accounts in the key's reach.
        queue_size:
          type: integer
          description: Messages in the outbound queue. Absent for a key confined to some domains, because the queue is shared.
    VerifyRequest:
      type: object
      required: [name, password]
      properties:
        name:
          type: string
          description: The login name or one of the account's addresses.
        password:
          type: string
    VerifyResponse:
      type: object
      required: [valid, admin]
      properties:
        valid:
          type: boolean
        admin:
          type: boolean
          description: Always false when `valid` is false.
    Domains:
      type: object
      required: [domains, disabled]
      properties:
        domains:
          type: array
          items:
            type: string
        disabled:
          type: array
          description: The domains above that are switched off and take no mail.
          items:
            type: string
    AccountView:
      type: object
      required: [name, display_name, addresses, dynamic]
      properties:
        name:
          type: string
        display_name:
          type: [string, "null"]
        addresses:
          type: array
          items:
            type: string
        dynamic:
          type: boolean
          description: True for an account made through the API (deletable here); false for one declared in the configuration file.
    CreateAccount:
      type: object
      required: [name, addresses, password]
      properties:
        name:
          type: string
          maxLength: 64
          description: Lowercased on the way in; then lowercase letters, digits and hyphens, not starting with a hyphen.
        addresses:
          type: array
          items:
            type: string
          description: Delivery addresses, each in a hosted domain.
        password:
          type: string
          minLength: 12
          maxLength: 64
          description: Printable ASCII, not in the bundled breach list.
        display_name:
          type: string
          maxLength: 128
          description: The person's name, trimmed; no control characters.
    AccountRemoved:
      type: object
      required: [removed, mailbox_files, masked_addresses, app_passwords, suppressed_addresses, correspondent_addresses, queued_messages_discarded, queued_messages_left, bayes_tokens_removed]
      properties:
        removed:
          type: string
        mailbox_files:
          type: integer
          description: Files removed from the account's mailbox directory, the directory included.
        masked_addresses:
          type: integer
        app_passwords:
          type: integer
        suppressed_addresses:
          type: integer
          description: Entries of the account's own suppression list.
        correspondent_addresses:
          type: integer
        queued_messages_discarded:
          type: integer
          description: Non-zero only with `queue=discard`.
        queued_messages_left:
          type: integer
          description: Non-zero only with `queue=drain`.
        bayes_tokens_removed:
          type: integer
    Updated:
      type: object
      required: [updated]
      properties:
        updated:
          type: string
          description: The account name.
    Mailboxes:
      type: object
      required: [mailboxes, tree]
      properties:
        mailboxes:
          type: array
          items:
            type: string
        tree:
          type: array
          items:
            type: object
            required: [id, name, parent_id]
            properties:
              id:
                type: string
                description: The stored name, `/` between levels.
              name:
                type: string
                description: The last level, for people.
              parent_id:
                type: [string, "null"]
                description: The nearest mailbox above it that exists.
    MaskedAddress:
      type: object
      required: [address, label, enabled, created_at]
      properties:
        address:
          type: string
        label:
          type: string
        enabled:
          type: boolean
        created_at:
          type: integer
          description: Epoch seconds.
        last_used_at:
          type: integer
          description: Epoch seconds of the last delivery; absent until it is used.
    RemovedAddress:
      type: object
      required: [removed]
      properties:
        removed:
          type: string
    DeliveryOutcome:
      type: string
      enum: [delivered, deferred, failed, suppressed, canceled]
      description: |-
        `delivered`: the remote server accepted the message for this
        recipient. `deferred`: a temporary failure, retried later; a new
        record is written only when the reason changes. `failed`: refused
        for good or expired in the queue. `suppressed`: a suppression list
        refused the recipient before any attempt. `canceled`: an operator
        removed the entry with the CLI first.
    DeliveryEntry:
      type: object
      required: [time, spool_id, account, from, recipient, outcome, remote, reply, attempt, extra]
      properties:
        time:
          type: integer
          description: Epoch seconds.
        spool_id:
          type: string
          format: uuid
          description: The `queued` id of the message.
        account:
          type: [string, "null"]
          description: The local account that submitted it; null for mail relayed from another server.
        from:
          type: string
          description: The envelope sender; empty for a bounce.
        recipient:
          type: string
        outcome:
          $ref: "#/components/schemas/DeliveryOutcome"
        remote:
          type: [string, "null"]
          description: The remote host that answered, when one did.
        reply:
          type: [string, "null"]
          description: The first 200 bytes of the remote reply.
        attempt:
          type: integer
          description: The attempt, counting from 1; 0 for a record with no attempt (suppression, cancel).
        extra:
          type: object
          additionalProperties:
            type: string
          description: The `extra` map the send request carried; empty otherwise.
    MailClass:
      type: string
      enum: [transactional, marketing, personal]
    SendPart:
      type: object
      required: [data]
      properties:
        name:
          type: string
          description: File name. At most 1000 bytes, no control characters.
        content_type:
          type: string
          description: Detected from the bytes and the name when empty. At most 1000 bytes.
        data:
          type: string
          description: Base64, standard alphabet with padding.
        content_id:
          type: string
          description: Required for `inline` parts, which the HTML refers to as `cid:<content_id>`.
    SendRequest:
      type: object
      required: [from, to]
      description: |-
        Fields the server does not know are ignored. Every value that ends
        up on a header line, in every field below including the attachment
        names and types, may not hold a control character other than a tab
        and is at most 1000 bytes.
      properties:
        from:
          type: string
          description: A bare address (no display name; use `from_name`) that the acting account owns.
        from_name:
          type: string
          maxLength: 128
          description: The sender's name for `From`. Absent uses the account's display name. Non-ASCII is written as RFC 2047.
        to:
          type: array
          items:
            type: string
        cc:
          type: array
          items:
            type: string
          default: []
        bcc:
          type: array
          items:
            type: string
          default: []
          description: Envelope only; never written into the message.
        reply_to:
          type: string
        sender:
          type: string
          description: Written as `Sender`. Must be an address the account owns, like `from`.
        subject:
          type: string
          default: ""
        text:
          type: string
        html:
          type: string
          description: With `text`, both go into a `multipart/alternative`, text first.
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/SendPart"
          default: []
        inline:
          type: array
          items:
            $ref: "#/components/schemas/SendPart"
          default: []
          description: Attachments and inline parts together are at most 100.
        in_reply_to:
          type: string
          description: Exactly one `<id@domain>` message id.
        references:
          type: string
          description: Up to 100 `<id@domain>` message ids separated by white space.
        importance:
          type: string
          enum: [high, normal, low]
          description: Writes `Importance` and `X-Priority`. Also accepted as `priority`. Case-insensitive.
        list_unsubscribe:
          type: array
          maxItems: 4
          items:
            type: string
          description: "`mailto:` and `https://` URLs, written as `List-Unsubscribe`."
        list_unsubscribe_post:
          type: boolean
          default: false
          description: Adds `List-Unsubscribe-Post` (RFC 8058). Needs an `https://` URL in `list_unsubscribe`.
        auto_submitted:
          type: string
          enum: ["no", auto-generated, auto-replied, auto-notified]
          description: Written as `Auto-Submitted`. Case-insensitive.
        feedback_id:
          type: string
          description: Written as `Feedback-ID`. Printable ASCII without spaces.
        headers:
          type: object
          maxProperties: 32
          additionalProperties:
            type: string
          description: Custom headers. A name is `X-` followed by letters, digits and hyphens, at most 76 characters, and not `X-Priority`.
        save_sent:
          type: boolean
          description: Whether a copy goes to the account's Sent folder. Absent follows the account setting. Transactional mail is never copied.
        extra:
          type: object
          maxProperties: 10
          additionalProperties:
            type: string
            maxLength: 256
          description: |-
            A correlation map returned by `/api/v1/deliveries` and in the
            webhook events of this message, never written into the message.
            Keys are printable ASCII without spaces, at most 64 bytes;
            values at most 256 bytes.
        class:
          $ref: "#/components/schemas/MailClass"
    Queued:
      type: object
      required: [queued, class]
      properties:
        queued:
          type: string
          format: uuid
          description: The queue id, also the `spool_id` of delivery records and webhook events.
        class:
          $ref: "#/components/schemas/MailClass"
        suppressed:
          type: array
          items:
            type: string
          description: Recipients dropped because they are on a suppression list (marketing only). Absent when none.
    JmapSession:
      type: object
      description: The RFC 8620 Session resource.
      required: [capabilities, accounts, primaryAccounts, username, apiUrl, downloadUrl, uploadUrl, eventSourceUrl, state]
      properties:
        capabilities:
          type: object
          description: |-
            `urn:ietf:params:jmap:core` (with `maxSizeUpload`,
            `maxConcurrentUpload`, `maxSizeRequest`, `maxConcurrentRequests`,
            `maxCallsInRequest`, `maxObjectsInGet`, `maxObjectsInSet`),
            `mail`, `submission`, `quota`, `vacationresponse`, `sieve` and
            `websocket`.
        accounts:
          type: object
          description: The accounts the credential reaches, keyed by account name, which is the JMAP account id.
        primaryAccounts:
          type: object
        username:
          type: string
          description: Always empty.
        apiUrl:
          type: string
        downloadUrl:
          type: string
        uploadUrl:
          type: string
        eventSourceUrl:
          type: string
        state:
          type: string
    JmapRequest:
      type: object
      required: [methodCalls]
      properties:
        using:
          type: array
          items:
            type: string
          description: Accepted and ignored.
        methodCalls:
          type: array
          maxItems: 16
          description: Each call is `[name, arguments, callId]`.
          items:
            type: array
            minItems: 3
            maxItems: 3
    JmapResponse:
      type: object
      required: [methodResponses]
      properties:
        methodResponses:
          type: array
          items:
            type: array
    JmapProblem:
      type: object
      description: An RFC 7807 problem as RFC 8620 uses it.
      required: [type, status, detail]
      properties:
        type:
          type: string
          description: "`urn:ietf:params:jmap:error:<kind>`, for example `limit`, `notFound`, `invalidArguments`, `forbidden`, `serverFail`."
        status:
          type: integer
        detail:
          type: string
        limit:
          type: string
          description: For a `limit` problem, the limit that applied, such as `maxCallsInRequest` or `storage`.
    ScimEmail:
      type: object
      required: [value]
      properties:
        value:
          type: string
        type:
          type: string
          description: Rendered as `work` for the first address and `other` for the rest; ignored on input.
        primary:
          type: boolean
    ScimUser:
      type: object
      required: [userName, active]
      properties:
        schemas:
          type: array
          items:
            type: string
        id:
          type: string
          readOnly: true
          description: The account name.
        externalId:
          type: string
        userName:
          type: string
        displayName:
          type: string
        active:
          type: boolean
          description: False means the account is disabled.
        emails:
          type: array
          items:
            $ref: "#/components/schemas/ScimEmail"
        name:
          type: object
          properties:
            givenName:
              type: string
            familyName:
              type: string
        password:
          type: string
          writeOnly: true
          description: Same policy as account creation (12 to 64 printable ASCII characters).
    ScimList:
      type: object
      required: [schemas, totalResults, Resources, startIndex, itemsPerPage]
      properties:
        schemas:
          type: array
          items:
            type: string
        totalResults:
          type: integer
          description: The number of users on this page, not the number that match.
        Resources:
          type: array
          items:
            $ref: "#/components/schemas/ScimUser"
        startIndex:
          type: integer
        itemsPerPage:
          type: integer
    ScimPatch:
      type: object
      required: [Operations]
      properties:
        schemas:
          type: array
          items:
            type: string
        Operations:
          type: array
          items:
            type: object
            required: [op, path]
            properties:
              op:
                type: string
                enum: [replace, add]
              path:
                type: string
                enum: [active, password, displayName]
              value:
                description: A boolean for `active`, a string for the others.
    ScimError:
      type: object
      required: [schemas, status, detail]
      properties:
        schemas:
          type: array
          items:
            type: string
        status:
          type: string
          description: The HTTP status as a string.
        detail:
          type: string
    DeviceAuthorizationRequest:
      type: object
      required: [client_id]
      properties:
        client_id:
          type: string
        scope:
          type: string
          description: Ignored.
    DeviceAuthorization:
      type: object
      required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval]
      properties:
        device_code:
          type: string
        user_code:
          type: string
          description: "`XXXX-XXXX` from an alphabet without look-alike characters."
        verification_uri:
          type: string
          description: Always `/oauth/device/approve`, a relative path.
        verification_uri_complete:
          type: string
        expires_in:
          type: integer
          description: "600."
        interval:
          type: integer
          description: "5."
    DeviceApproveRequest:
      type: object
      required: [user_code]
      properties:
        user_code:
          type: string
        login:
          type: string
        password:
          type: string
    AuthorizeRequest:
      type: object
      required: [client_id, code_challenge, code_challenge_method]
      properties:
        client_id:
          type: string
        code_challenge:
          type: string
        code_challenge_method:
          type: string
          enum: [S256]
        state:
          type: string
        login:
          type: string
        password:
          type: string
    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum: ["urn:ietf:params:oauth:grant-type:device_code", authorization_code]
        device_code:
          type: string
        code:
          type: string
        code_verifier:
          type: string
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: An ES256 JWT with `sub` the account name.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: "3600."
    OAuthErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: string
