      parameters:
        - $ref: "#/components/parameters/AccountName"
        - $ref: "#/components/parameters/MaskedAddress"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: The new state.
          content:
            application/json:
              schema:
                type: object
                required: [address, enabled]
                properties:
                  address:
                    type: string
                  enabled:
                    type: boolean
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
