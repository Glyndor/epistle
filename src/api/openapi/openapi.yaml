  /oauth/device_authorization:
    post:
      operationId: oauthDeviceAuthorization
      tags: [OAuth]
      summary: Start a device authorization (RFC 8628)
      description: |-
        Present only when `[oauth] signing_key` is configured; without it
        every `/oauth/*` path answers `401` without a bearer and `404` with a valid
        one. When the server is configured, no bearer is needed. The body
        is form-encoded or a JSON object of strings. `client_id` must be
        non-empty and is not otherwise checked; `scope` is ignored. At most
        10 grants may be pending per client address (an IPv6 /64), 100 per
        IPv6 /48 and 10,000 in all; past them the answer is `429 slow_down`.
      security: []
      x-epistle-scope: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/DeviceAuthorizationRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceAuthorizationRequest"
      responses:
        "200":
          description: The codes. The grant lives 600 seconds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAuthorization"
        "400":
          $ref: "#/components/responses/OAuthError"
        "429":
          $ref: "#/components/responses/OAuthSlowDown"
  /oauth/device/approve:
    post:
      operationId: oauthDeviceApprove
      tags: [OAuth]
      summary: Approve a device grant with an account's credentials
      description: |-
        The headless stand-in for a verification page. Send `user_code` and
        the account's `login` and `password` (form or JSON), or the
        credentials as HTTP Basic. No bearer is needed. A wrong code, an
        expired code, an unknown account, a wrong password, an account that
        may not use the API protocol and a grant someone else already
        approved all answer the same `400 invalid_grant`.
      security: []
      x-epistle-scope: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/DeviceApproveRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceApproveRequest"
      responses:
        "200":
          description: The grant is approved; the device's next poll gets a token.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [approved]
        "400":
          $ref: "#/components/responses/OAuthError"
  /oauth/authorize:
    post:
      operationId: oauthAuthorize
      tags: [OAuth]
      summary: Issue an authorization code (PKCE, S256 only)
      description: |-
        Send `client_id` (non-empty, not otherwise checked),
        `code_challenge`, `code_challenge_method=S256` and the account's
        `login` and `password` (form or JSON) or HTTP Basic. No bearer is
        needed. The code lives 600 seconds and is single-use. `plain` is
        refused. Bad credentials are `400 invalid_grant`.
      security: []
      x-epistle-scope: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/AuthorizeRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizeRequest"
      responses:
        "200":
          description: The code, and `state` echoed when it was sent.
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code:
                    type: string
                  state:
                    type: string
        "400":
          $ref: "#/components/responses/OAuthError"
  /oauth/token:
    post:
      operationId: oauthToken
      tags: [OAuth]
      summary: Redeem a device code or an authorization code
      description: |-
        Form or JSON. `grant_type` is
        `urn:ietf:params:oauth:grant-type:device_code` (with `device_code`;
        poll no faster than every 5 seconds or get `429 slow_down`) or
        `authorization_code` (with `code` and `code_verifier`; the code is
        consumed even when the verifier is wrong). The token is an ES256 JWT
        with `sub` the account name, valid for 3600 seconds. It is for
        OAUTHBEARER on IMAP and SMTP submission; the REST API does not
        accept it as a bearer.
      security: []
      x-epistle-scope: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: The access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/OAuthError"
        "429":
          $ref: "#/components/responses/OAuthSlowDown"
