  /api/v1/events:
    get:
      operationId: streamEvents
      tags: [Service]
      summary: Notifications that something changed, for live dashboards
      description: |-
        A `text/event-stream` that stays open. Each event is named after a
        topic (`queue`, `deliveries`, `suppression`, `status`, `accounts` or
        `domains`), carries `{"topic": "<name>"}` and an opaque `id`, and
        says nothing about what changed: no address, subject, content or
        credential. The client fetches the detail from the route it already
        uses. Changes are looked for once a second and a burst is one event
        per topic. Send the last `id` as `Last-Event-ID` to be sent what came
        after it; an id the server cannot replay from gets one event per
        topic the key may be told about, meaning "fetch again". A key
        confined to some domains is told only `status`, `accounts` and
        `domains`, and only about what it reaches; a key bound to one
        account is refused. A `:heartbeat` comment keeps an idle stream
        alive. The stream ends after `[api] event_stream_max_secs`, or when
        the key is revoked, expires, is narrowed or loses `manage:read`. A key may
        hold `[api] event_streams_per_key` streams and the server
        `event_streams_per_server`.
      x-epistle-scope: [manage:read]
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: The `id` of the last event received.
          schema:
            type: string
      responses:
        "200":
          description: The event stream.
          headers:
            X-Accel-Buffering:
              description: Always `no`, so an nginx in front does not buffer the stream.
              schema:
                type: string
                enum: ["no"]
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "429":
          description: |-
            `rate_limited`: the key already holds its streams, or the server
            holds all it allows. `Retry-After` gives the seconds to wait. The
            authentication limiter answers the same status for a client
            address with too many failed credentials.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/queue:
    get:
      operationId: listQueue
      tags: [Queue]
      summary: Messages waiting in the outbound queue
      description: |-
        Oldest first, keyset-paged by the queue id (a UUIDv7, so ids sort by
        time). A key confined to some domains sees only entries whose sender
        lies in them; to find a page of its own the server reads at most
        1000 entries per request, so a page can come back short with a
        `next_cursor` and the next call carries on. Bounces (empty sender)
        are shown only to unconfined keys.
      x-epistle-scope: [manage:read]
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size. Above 100 it is cut to 100; 0 is refused.
          schema:
            type: integer
            minimum: 1
            default: 50
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of queue entries.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      required: [id, reverse_path, recipients]
                      properties:
                        id:
                          type: string
                          format: uuid
                        reverse_path:
                          type: string
                          description: The envelope sender; empty for a bounce.
                        recipients:
                          type: array
                          items:
                            type: string
                          description: The envelope recipients still pending, Bcc included.
                  next_cursor:
                    type: string
                    format: uuid
                    description: Present when more entries remain; absent on the last page.
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/queue/{id}:
    delete:
      operationId: cancelQueueEntry
      tags: [Queue]
      summary: Remove a message from the queue
      description: |-
        The entry is removed in one step. For an entry that keeps evidence
        (transactional mail) a `canceled` outcome per pending recipient is
        written to the evidence chain first, and the entry stays if that
        cannot be done. Each pending recipient gets a delivery-log record with
        outcome `canceled`; when the delivery log is enabled, the configured
        webhook receives a `canceled` event with the message's `extra`. An
        entry of another tenant answers like one that is not there.
      x-epistle-scope: [manage:write]
      parameters:
        - name: id
          in: path
          required: true
          description: The queue id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The entry was removed.
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/UnreadableRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |-
            `conflict`: the entry has evidence outcomes waiting to be written
            and stays until they are. Retrying later works.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/suppression:
    get:
      operationId: listSuppression
      tags: [Queue]
      summary: Suppressed recipient addresses
      description: |-
        Without `account`, the global list, which is shared by every tenant:
        a key confined to some domains is refused with `403 forbidden`. With
        `account`, that sending account's own list. A key bound to one account
        reads its own list with `mail:read`; every other key needs `manage:read`,
        and is refused with `403 forbidden` without it.
      x-epistle-scope: [mail:read, manage:read]
      parameters:
        - name: account
          in: query
          required: false
          description: The account name or sending address whose list to show.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size. Above 100 it is cut to 100; 0 is refused.
          schema:
            type: integer
            minimum: 1
            default: 50
        - name: after
          in: query
          required: false
          description: The `next_cursor` of the previous page; addresses strictly after it are returned.
          schema:
            type: string
      responses:
        "200":
          description: A page of addresses, sorted.
          content:
            application/json:
              schema:
                type: object
                required: [addresses]
                properties:
                  addresses:
                    type: array
                    items:
                      type: string
                  next_cursor:
                    type: string
                    description: Present when more remain.
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: addSuppression
      tags: [Queue]
      summary: Add an address to a suppression list
      description: |-
        Adds a recipient to the global list, or to the sending account's list
        with `account`. A key bound to one account may do so with `mail:write`;
        every other key needs `manage:write`, and is refused with `403
        forbidden` without it. The global list is refused to a key confined to an
        account or domain. The address is validated by the server. Adding an
        address already on the list succeeds without replacing its first
        reason or timestamp.
      x-epistle-scope: [mail:write, manage:write]
      parameters:
        - name: account
          in: query
          required: false
