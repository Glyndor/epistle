      summary: Read one account
      x-epistle-scope: [scim]
      parameters:
        - $ref: "#/components/parameters/ScimId"
      responses:
        "200":
          description: The account as a SCIM user.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ScimNotFound"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
    put:
      operationId: scimReplaceUser
      tags: [SCIM]
      summary: Replace an account
      description: |-
        `userName` must equal the id. `emails` replaces the addresses (an
        empty list keeps the current ones), `active` sets the disabled flag,
        `password` when present sets a new one, and an absent `displayName`
        clears it.
      x-epistle-scope: [scim]
      parameters:
        - $ref: "#/components/parameters/ScimId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScimUser"
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimUser"
      responses:
        "200":
          description: The account as it is now.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "400":
          $ref: "#/components/responses/ScimBadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ScimNotFound"
        "409":
          $ref: "#/components/responses/ScimConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableBody"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/ScimInternal"
    patch:
      operationId: scimPatchUser
      tags: [SCIM]
      summary: Change one attribute of an account
      description: |-
        Operations are applied in order and a failing one stops the rest
        (the ones before it stay applied). Only `replace` and `add`, with a
        `path` of `active` (boolean), `password` (string) or `displayName`
        (string). `remove` and any other path are a 400.
      x-epistle-scope: [scim]
      parameters:
