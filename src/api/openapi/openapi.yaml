# The OpenAPI 3.1 description of the HTTP routes epistle registers.
#
# Served by `GET /api/v1/openapi.json` and checked against the routers by
# `route_openapi_tests.rs`: adding a route in the code without describing it
# here, or describing one the code does not register, fails the tests.
#
# Written in the YAML subset `yaml.rs` reads: block style, no anchors, no
# trailing comments, plain scalars that could be read as a number or a YAML
# 1.1 word are quoted.
openapi: "3.1.0"
info:
  title: Epistle HTTP API
  version: "1"
  license:
    name: MIT
    identifier: MIT
  summary: Management, send, JMAP, SCIM and OAuth routes of one epistle server.
  description: |-
    Everything under `/api/v1` is the versioned management API. `/jmap/*`,
    `/scim/v2/*` and `/oauth/*` are standard protocols served by the same
    listener. The routes at the end (autodiscovery, ACME, metrics) live on
    their own listeners, see their `servers` entries.

    **Authentication.** Every route of the API listener except `/healthz` and
    `/oauth/*` needs `Authorization: Bearer <token>`: the token whose hash is
    `[api] token_hash`, or an API key made with `epistle api-key create`.
    A key carries scopes (`read`, `write`, `send`, `scim`); a request the
    scopes do not cover is answered `401 unauthenticated`, the same as an
    unknown token, not `403`. `x-epistle-scope` on each operation names the
    scope it needs.

    **Errors.** A failure the API itself decides is JSON,
    `{"error": {"code": "...", "message": "..."}}` (see `ApiError`). A body,
    query string or path the HTTP layer cannot read is refused before the
    handler runs, with `text/plain` and no `error` object: `400` for
    malformed JSON, query or path values, `415` without
    `Content-Type: application/json`, `422` for a missing or mistyped field.
    An unknown path is `404` with an empty body; a known path with another
    method is `405` with an `allow` header. Nothing sends `Retry-After`.

    **Stability.** `/api/v1` keeps its paths, field names and error codes
    within the major version; new optional fields, new error codes and new
    routes can appear. `docs/api.md` lists what is stable.
servers:
  - url: "http://127.0.0.1:8025"
    description: The `api` listener. The port and address are the operator's choice.
tags:
  - name: Service
    description: Liveness, status and this description.
  - name: Accounts
    description: Accounts, passwords, two-factor, mailboxes, masked addresses and the archive.
  - name: Queue
    description: The outbound queue, the suppression list and the delivery log.
  - name: Send
    description: Mail submission from JSON.
  - name: JMAP
    description: JMAP (RFC 8620, 8621, 8887) over the same bearer keys.
  - name: SCIM
    description: SCIM 2.0 provisioning (RFC 7643, 7644).
  - name: OAuth
    description: The built-in authorization server; present only with an `[oauth]` signing key.
  - name: Discovery
    description: Mail client autodiscovery, on the autoconfig listeners.
  - name: Operations
    description: ACME HTTP-01 and Prometheus metrics, on their own listeners.
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthz
      tags: [Service]
      summary: Liveness probe
      description: Reveals nothing but that the process answers. Needs no credentials.
      security: []
      x-epistle-scope: []
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /api/v1/openapi.json:
    get:
      operationId: getOpenApi
      tags: [Service]
      summary: This description as JSON
      description: |-
        The OpenAPI document the running server was built with. It is behind
        the bearer check like the rest of `/api/v1`.
      x-epistle-scope: [read]
      responses:
        "200":
          description: The OpenAPI 3.1 document.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
  /api/v1/status:
    get:
      operationId: getStatus
      tags: [Service]
      summary: Counters for the server, or for the reach of a confined key
      x-epistle-scope: [read]
      responses:
        "200":
          description: The counters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/auth/verify:
    post:
      operationId: verifyCredentials
      tags: [Accounts]
      summary: Check an account login and password
      description: |-
        Lets a panel check the credentials of an operator without holding
        their password hash. An unknown login and a wrong password answer
        the same `valid: false`. `admin` is true only for a valid account
        listed in `[api] admins`. The attempt is attributed to the caller's
        IP like any other authentication attempt, so the account's own
        failure counters and bans apply. A key confined to some domains only
        gets a real check for logins inside them.
      x-epistle-scope: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "200":
          description: The verdict. Always 200 when the request was readable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
        "400":
          $ref: "#/components/responses/UnreadableRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableBody"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
  /api/v1/domains:
    get:
      operationId: listDomains
      tags: [Accounts]
      summary: The hosted domains in the key's reach
      x-epistle-scope: [read]
      responses:
        "200":
          description: The domains, and which of them are switched off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domains"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
  /api/v1/accounts:
    get:
      operationId: listAccounts
      tags: [Accounts]
      summary: The accounts in the key's reach
      description: Not paged. A confined key sees only accounts whose addresses all lie in its domains.
      x-epistle-scope: [read]
      responses:
        "200":
          description: The accounts.
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccountView"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
    post:
      operationId: createAccount
      tags: [Accounts]
      summary: Create an API-managed account
      description: |-
        The name is lowercased. Checks run in this order, so a refusal never
        reveals more than the step before it allowed: addresses inside the
        key's domains, name available, tenant `max_accounts`, password policy
        (12 to 64 printable ASCII characters, not in the bundled breach
        list), then the store (duplicate name or address, unknown domain,
        malformed name). Answers `200`, not `201`.
      x-epistle-scope: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccount"
      responses:
        "200":
          description: The account was created.
          content:
            application/json:
              schema:
                type: object
                required: [created]
                properties:
                  created:
                    type: string
                    description: The stored (lowercased) account name.
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "409":
          description: |-
            `conflict`: the tenant is at its `max_accounts`. Waiting does not
            help; delete an account or raise the cap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableBody"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/accounts/{name}:
    delete:
      operationId: deleteAccount
      tags: [Accounts]
      summary: Delete an API-managed account
      description: |-
        Removes the account, its mailbox, masked addresses, app passwords,
        suppression entries, correspondents and Bayesian rows. `queue` is
        required so a client never drops queued mail by omission. Accounts
        declared in the configuration file are not API-managed and answer
        `404 no such dynamic account`.
      x-epistle-scope: [write]
      parameters:
        - $ref: "#/components/parameters/AccountName"
        - name: queue
          in: query
          required: true
          description: What to do with queued mail the account sent. `discard` drops it, `drain` leaves it to be delivered.
          schema:
            type: string
            enum: [discard, drain]
      responses:
        "200":
          description: What was removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountRemoved"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/accounts/{name}/password:
    put:
      operationId: setAccountPassword
      tags: [Accounts]
      summary: Replace the password of an API-managed account
      description: |-
        The same password policy as account creation. The SCRAM verifier is
        replaced too (or dropped when `[auth] scram = false`).
      x-epistle-scope: [write]
      parameters:
        - $ref: "#/components/parameters/AccountName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 12
                  maxLength: 64
                  description: Printable ASCII, 12 to 64 characters, not in the bundled breach list.
      responses:
        "200":
          description: The password was replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Updated"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableBody"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/accounts/{name}/display_name:
    put:
      operationId: setAccountDisplayName
      tags: [Accounts]
      summary: Set or clear the person's name of an API-managed account
      description: |-
        Kept as written, trimmed; an empty value clears it. It becomes the
        phrase of the `From` header of mail sent with `POST /api/v1/send`
        when the request names none.
      x-epistle-scope: [write]
      parameters:
        - $ref: "#/components/parameters/AccountName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name:
                  type: string
                  maxLength: 128
                  description: At most 128 characters after trimming, no control characters.
      responses:
        "200":
          description: The stored name, or null when it was cleared.
          content:
            application/json:
              schema:
                type: object
                required: [display_name]
                properties:
                  display_name:
                    type: [string, "null"]
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableBody"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/accounts/{name}/totp:
    post:
      operationId: enrollTotp
      tags: [Accounts]
      summary: Generate and store a fresh TOTP secret
      description: |-
        Replaces any secret the account had and takes effect at once; there
        is no confirmation step. The secret is returned here and nowhere else.
      x-epistle-scope: [write]
      parameters:
        - $ref: "#/components/parameters/AccountName"
      responses:
        "200":
          description: The secret and its provisioning URI.
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauth_uri]
                properties:
                  secret:
                    type: string
                    description: Base32 secret.
                  otpauth_uri:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: disableTotp
      tags: [Accounts]
      summary: Turn off two-factor authentication for an account
      x-epistle-scope: [write]
      parameters:
        - $ref: "#/components/parameters/AccountName"
      responses:
        "200":
          description: Two-factor authentication is off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Updated"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/accounts/{name}/mailboxes:
    get:
      operationId: listMailboxes
      tags: [Accounts]
      summary: The mailboxes of an account
      x-epistle-scope: [read]
      parameters:
        - $ref: "#/components/parameters/AccountName"
      responses:
        "200":
          description: Every stored mailbox name, and the same mailboxes as a tree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mailboxes"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
  /api/v1/accounts/{name}/masked:
    get:
      operationId: listMaskedAddresses
      tags: [Accounts]
      summary: The masked addresses of an account
      x-epistle-scope: [read]
      parameters:
        - $ref: "#/components/parameters/AccountName"
      responses:
        "200":
          description: Every masked address the account owns, in creation order.
          content:
            application/json:
              schema:
                type: object
                required: [addresses]
                properties:
                  addresses:
                    type: array
                    items:
                      $ref: "#/components/schemas/MaskedAddress"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
    post:
      operationId: createMaskedAddress
      tags: [Accounts]
      summary: Mint a masked address
      description: |-
        The local part is the label reduced to lowercase letters, digits and
        hyphens, a dot and 8 random base32 characters; the domain is that of
        the account's first address. Mail sent to it lands in the account
        while it is enabled.
      x-epistle-scope: [write]
      parameters:
        - $ref: "#/components/parameters/AccountName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
                  description: Must contain at least one ASCII letter or digit.
      responses:
        "201":
          description: The address was minted.
          content:
            application/json:
              schema:
                type: object
                required: [address]
                properties:
                  address:
                    type: string
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |-
            `conflict`: the account is at the per-account cap of masked
            addresses (`masked_addresses_max`). Delete one or raise the cap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableBody"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/accounts/{name}/masked/{address}:
    patch:
      operationId: updateMaskedAddress
      tags: [Accounts]
      summary: Enable or disable a masked address
      x-epistle-scope: [write]
      parameters:
        - $ref: "#/components/parameters/AccountName"
        - $ref: "#/components/parameters/MaskedAddress"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: The new state.
          content:
            application/json:
              schema:
                type: object
                required: [address, enabled]
                properties:
                  address:
                    type: string
                  enabled:
                    type: boolean
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableBody"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: deleteMaskedAddress
      tags: [Accounts]
      summary: Remove a masked address
      x-epistle-scope: [write]
      parameters:
        - $ref: "#/components/parameters/AccountName"
        - $ref: "#/components/parameters/MaskedAddress"
      responses:
        "200":
          description: The address that was removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemovedAddress"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/accounts/{name}/archive:
    get:
      operationId: listArchive
      tags: [Accounts]
      summary: Archived (expunged) messages of an account
      description: |-
        The archive exists when `[storage] deleted_retention_days` is set.
        Oldest first, not paged. A failure to read the archive answers
        `404 not_found` with the reason in the message.
      x-epistle-scope: [read]
      parameters:
        - $ref: "#/components/parameters/AccountName"
      responses:
        "200":
          description: The archived messages.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      required: [id, mailbox, deleted_at]
                      properties:
                        id:
                          type: string
                          format: uuid
                        mailbox:
                          type: string
                          description: The mailbox the message was in when it was expunged.
                        deleted_at:
                          type: integer
                          description: Epoch seconds.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
  /api/v1/accounts/{name}/archive/{id}/restore:
    post:
      operationId: restoreArchived
      tags: [Accounts]
      summary: Put an archived message back
      description: |-
        Re-appends it to the mailbox it was expunged from, or to `INBOX`
        when that mailbox no longer exists, and removes it from the archive.
        Any failure, an unknown id included, answers `404 not_found` with
        `cannot restore: ...`.
      x-epistle-scope: [write]
      parameters:
        - $ref: "#/components/parameters/AccountName"
        - name: id
          in: path
          required: true
          description: The archive entry id from `listArchive`.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Where the message went.
          content:
            application/json:
              schema:
                type: object
                required: [id, restored_to]
                properties:
                  id:
                    type: string
                    format: uuid
                  restored_to:
                    type: string
        "400":
          $ref: "#/components/responses/UnreadableRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
  /api/v1/queue:
    get:
      operationId: listQueue
      tags: [Queue]
      summary: Messages waiting in the outbound queue
      description: |-
        Oldest first, keyset-paged by the queue id (a UUIDv7, so ids sort by
        time). A key confined to some domains sees only entries whose sender
        lies in them; to find a page of its own the server reads at most
        1000 entries per request, so a page can come back short with a
        `next_cursor` and the next call carries on. Bounces (empty sender)
        are shown only to unconfined keys.
      x-epistle-scope: [read]
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size. Above 100 it is cut to 100; 0 is refused.
          schema:
            type: integer
            minimum: 1
            default: 50
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of queue entries.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      required: [id, reverse_path, recipients]
                      properties:
                        id:
                          type: string
                          format: uuid
                        reverse_path:
                          type: string
                          description: The envelope sender; empty for a bounce.
                        recipients:
                          type: array
                          items:
                            type: string
                          description: The envelope recipients still pending, Bcc included.
                  next_cursor:
                    type: string
                    format: uuid
                    description: Present when more entries remain; absent on the last page.
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/queue/{id}:
    delete:
      operationId: cancelQueueEntry
      tags: [Queue]
      summary: Remove a message from the queue
      description: |-
        The entry is removed in one step. For an entry that keeps evidence
        (transactional mail) a `canceled` outcome per pending recipient is
        written to the evidence chain first, and the entry stays if that
        cannot be done. Unlike `epistle queue remove`, this route writes no
        delivery-log record and posts no `canceled` webhook event. An entry
        of another tenant answers like one that is not there.
      x-epistle-scope: [write]
      parameters:
        - name: id
          in: path
          required: true
          description: The queue id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The entry was removed.
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/UnreadableRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |-
            `conflict`: the entry has evidence outcomes waiting to be written
            and stays until they are. Retrying later works.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/suppression:
    get:
      operationId: listSuppression
      tags: [Queue]
      summary: Suppressed recipient addresses
      description: |-
        Without `account`, the global list, which is shared by every tenant:
        a key confined to some domains is refused with `403 forbidden`. With
        `account`, that sending account's own list.
      x-epistle-scope: [read]
      parameters:
        - name: account
          in: query
          required: false
          description: The sending account whose list to show.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size. Above 100 it is cut to 100; 0 is refused.
          schema:
            type: integer
            minimum: 1
            default: 50
        - name: after
          in: query
          required: false
          description: The `next_cursor` of the previous page; addresses strictly after it are returned.
          schema:
            type: string
      responses:
        "200":
          description: A page of addresses, sorted.
          content:
            application/json:
              schema:
                type: object
                required: [addresses]
                properties:
                  addresses:
                    type: array
                    items:
                      type: string
                  next_cursor:
                    type: string
                    description: Present when more remain.
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/suppression/{address}:
    delete:
      operationId: removeSuppression
      tags: [Queue]
      summary: Take an address off a suppression list
      description: |-
        Removing an address that is not on the list still answers `200`.
        The global list is refused to a confined key, as for the listing.
      x-epistle-scope: [write]
      parameters:
        - name: address
          in: path
          required: true
          description: The address, percent-encoded.
          schema:
            type: string
        - name: account
          in: query
          required: false
          description: Remove from this sending account's list instead of the global one.
          schema:
            type: string
      responses:
        "200":
          description: The address that was removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemovedAddress"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/deliveries:
    get:
      operationId: listDeliveries
      tags: [Queue]
      summary: The per-recipient delivery log
      description: |-
        Newest day first. There is no cursor: narrow with `since`, `outcome`
        or `recipient`. A key bound to one account sees only its own
        records; a key confined to some domains sees none, because records
        carry an account, not a domain. Records are kept for
        `[storage] delivery_log_days` (30 by default); with `0` the log is
        off and this answers `404`.
      x-epistle-scope: [read]
      parameters:
        - name: recipient
          in: query
          required: false
          description: Exact recipient address.
          schema:
            type: string
        - name: account
          in: query
          required: false
          description: The sending account. Ignored for a key bound to one account.
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: |-
            A duration such as `30s`, `15m`, `24h` or `7d`, or an RFC 3339
            timestamp. Records at or after it are returned.
          schema:
            type: string
        - name: outcome
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DeliveryOutcome"
        - name: limit
          in: query
          required: false
          description: Most records returned. Cut to the range 1 to 100.
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: The records.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeliveryEntry"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/send:
    post:
      operationId: sendMail
      tags: [Send]
      summary: Build a message from JSON and submit it
      description: |-
        The message takes the path of SMTP submission: DKIM-signed for the
        sender's domain when mail leaves the server, delivered at once to
        local recipients, queued for the rest. The `queued` id names the
        queue entry and is the `spool_id` of delivery records and webhook
        events. There is no idempotency key: a retried request is a second
        message.

        The sender (`from`, and `sender` when given) must be an address the
        acting account owns. A key bound to one account acts for that
        account; any other key acts for the account that owns `from`, if the
        key reaches it. Anything else answers `403 forbidden_from`, the same
        whether the address belongs to another account or to none.

        A request body larger than `[server] max_message_size` (25 MiB by
        default) is refused before it is read with a plain-text `413`; one
        whose built message is larger answers `413 message_too_large`.
      x-epistle-scope: [send]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendRequest"
      responses:
        "200":
          description: The message was accepted for delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queued"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |-
            `forbidden_from`: the sender is not an address the credential may
            act for. Also `forbidden` when the bound account is disabled or
            gone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: |-
            `message_too_large` (JSON) when the built message exceeds the
            limit, or `scan_too_large` (JSON) when the message is too large
            for the content scan and the server lets nothing pass unscanned.
            A request body over the limit is `text/plain`: `Failed to buffer
            the request body: length limit exceeded`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            text/plain:
              schema:
                type: string
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: |-
            Refused for its content, and sending it again unchanged is
            refused again: `virus_detected`, `attachment_refused`,
            `too_many_header_fields`, `marketing_refused` (marketing mail
            without a working one-click unsubscribe, or every recipient on a
            suppression list). A missing or mistyped field is a `text/plain`
            `422` instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
            text/plain:
              schema:
                type: string
        "429":
          description: |-
            `rate_limited` from the authentication limiter (too many failed
            attempts from this client), or from the sending limits: the
            per-account or per-tenant submission rate (`sending rate limit
            exceeded; retry later`) or the daily cap on first-time
            recipients (`too many new recipients today; retry tomorrow`).
            Nothing was sent. The message tells them apart; there is no
            `Retry-After`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          description: |-
            Nothing was sent and retrying later works: `scan_unavailable`
            (the content scan cannot run now) or `evidence_unavailable`
            (transactional mail whose evidence cannot be recorded, or is held
            until an operator acknowledges a break).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "507":
          description: |-
            `mailbox_full`: a local recipient's mailbox is full or would be
            with this message. Nothing was queued for anyone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /.well-known/jmap:
    get:
      operationId: jmapWellKnown
      tags: [JMAP]
      summary: JMAP autodiscovery (RFC 8620 section 2.2)
      description: |-
        Answers the Session resource itself, not a redirect to
        `/jmap/session`. A key bound to one account is allowed here.
      x-epistle-scope: [read]
      responses:
        "200":
          description: The Session resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JmapSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
  /jmap/session:
    get:
      operationId: jmapSession
      tags: [JMAP]
      summary: The JMAP Session resource
      description: |-
        Lists the accounts the key reaches (all of them for an unconfined
        key, the accounts inside its domains for a confined one, only its own
        for a bound key), the capabilities and the limits. The URLs in it are
        relative.
      x-epistle-scope: [read]
      responses:
        "200":
          description: The Session resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JmapSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
  /jmap/api:
    post:
      operationId: jmapApi
      tags: [JMAP]
      summary: Run JMAP method calls
      description: |-
        The coarse check lets any key with `read`, `write` or `send` in; each
        method call is then checked against the scope it needs, and a call
        the key's scopes do not cover answers a `forbidden` method error
        inside a `200` response. `read` covers `*/get`, `*/query`,
        `*/changes`, `*/queryChanges`, `Identity/get`, `Quota/get`,
        `PushSubscription/get`, `VacationResponse/get`, `SieveScript/get`,
        `SieveScript/query` and `SieveScript/validate`; `write` covers
        `Mailbox/set`, `Email/set`, `Email/copy`, `PushSubscription/set`,
        `VacationResponse/set` and `SieveScript/set`; `send` covers
        `EmailSubmission/set`. `Core/echo` needs none. Other methods answer
        `unknownMethod`. `using` is accepted and ignored.

        Limits (also in the Session): body at most 10,000,000 octets, 16
        calls per request, 500 objects per `/get` or `/set`, 4 requests in
        flight per credential. `EmailSubmission/set` accepts the extension
        property `epistle:class`.
      x-epistle-scope: [read, write, send]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JmapRequest"
      responses:
        "200":
          description: One response per method call, errors included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JmapResponse"
        "400":
          description: |-
            A request-level problem: more than 16 calls (a
            `urn:ietf:params:jmap:error:limit` problem naming
            `maxCallsInRequest`), or a body that is not a JMAP request
            (`text/plain`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JmapProblem"
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "413":
          description: The body is over `maxSizeRequest`; a `limit` problem.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JmapProblem"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableBody"
        "429":
          description: |-
            Either the authentication limiter (`rate_limited`, an `ApiError`)
            or a `limit` problem naming `maxConcurrentRequests`: this
            credential already has 4 requests in flight.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ApiError"
                  - $ref: "#/components/schemas/JmapProblem"
  /jmap/ws:
    get:
      operationId: jmapWebSocket
      tags: [JMAP]
      summary: JMAP over WebSocket (RFC 8887)
      description: |-
        Upgrades to a WebSocket. Text frames only, each a JSON object with an
        `@type` of `Request`, `WebSocketPushEnable` or `WebSocketPushDisable`;
        the server answers `Response`, `StateChange` and `RequestError`
        frames. The `Authorization` header is read on the upgrade, so a
        browser, which cannot set it on a WebSocket, cannot use this route.
        The server does not answer the `jmap` subprotocol. The credential is
        checked again on every frame; once it no longer holds, the frame is
        refused with a `forbidden` `RequestError` and the socket closes with
        code 1008. A `Request` frame counts against the same
        `maxSizeRequest` and `maxConcurrentRequests` as `POST /jmap/api`.
        Push is connection-scoped: a `StateChange` follows only the requests
        made on the same socket. Use the event source for changes made
        elsewhere.
      x-epistle-scope: [read]
      responses:
        "101":
          description: Switching protocols.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
  /jmap/eventsource:
    get:
      operationId: jmapEventSource
      tags: [JMAP]
      summary: JMAP push over server-sent events (RFC 8620 section 7.3)
      description: |-
        A `text/event-stream` that stays open. A `state` event carries a
        `StateChange` whenever the state of `Email`, `Mailbox` or `Thread`
        moves in an account the credential reaches, whichever protocol made
        the change (the account's change journal is polled every second). A
        `ping` event, `{"interval": N}`, is sent when nothing else was. The
        stream ends when the credential stops holding or loses `read`. No
        event ids are sent, so there is no replay: catch up with `/changes`
        from the states you hold. One credential may hold 4 streams.
      x-epistle-scope: [read]
      parameters:
        - name: types
          in: query
          required: false
          description: "`*` (the default) or a comma-separated list. Only `Email`, `Mailbox` and `Thread` have states; other names are accepted and never pushed."
          schema:
            type: string
            default: "*"
        - name: closeafter
          in: query
          required: false
          description: "`state` ends the response after the first `state` event; `no` (the default) keeps it open."
          schema:
            type: string
            enum: [state, "no"]
        - name: ping
          in: query
          required: false
          description: Seconds between `ping` events; 0 for none. Cut to 1 to 300.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: A `urn:ietf:params:jmap:error:invalidArguments` problem for a bad parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JmapProblem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The credential has no identity to count the stream against (a `forbidden` problem).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JmapProblem"
        "429":
          description: |-
            Either the authentication limiter or a `limit` problem naming
            `maxConcurrentEventSources`: 4 streams are already open.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ApiError"
                  - $ref: "#/components/schemas/JmapProblem"
  /jmap/download/{account_id}/{blob_id}/{name}:
    get:
      operationId: jmapDownload
      tags: [JMAP]
      summary: Download a blob (RFC 8620 section 6.2)
      description: |-
        The transfer-decoded bytes of a stored message, one of its parts
        (`<message id>.<part id>`), an uploaded blob or a Sieve script. The
        `name` segment is ignored. The media type is the one recorded for
        the blob; a stored message is `application/octet-stream`. An account
        the key does not reach answers the same `404` as one that does not
        exist.
      x-epistle-scope: [read]
      parameters:
        - name: account_id
          in: path
          required: true
          description: The account name, which is the JMAP account id.
          schema:
            type: string
        - name: blob_id
          in: path
          required: true
          description: "The blob id: a message id, `<message id>.<part id>`, an uploaded blob id or a Sieve script id."
          schema:
            type: string
        - name: name
          in: path
          required: true
          description: A file name for the client; ignored.
          schema:
            type: string
      responses:
        "200":
          description: The blob.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: A `urn:ietf:params:jmap:error:notFound` problem.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JmapProblem"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
  /jmap/upload/{account_id}:
    post:
      operationId: jmapUpload
      tags: [JMAP]
      summary: Upload a blob (RFC 8620 section 6.1)
      description: |-
        Stores the request body and returns its blob id. The `Content-Type`
        of the request is recorded and served back on download (default
        `application/octet-stream`). The body is held to `maxSizeUpload`,
        which is `[server] max_message_size`; the account's storage quota
        and the tenant's aggregate quota apply; 4 uploads may be in flight
        per credential. Uploaded blobs are reclaimed after a while if no
        message refers to them.
      x-epistle-scope: [write]
      parameters:
        - name: account_id
          in: path
          required: true
          description: The account name, which is the JMAP account id.
          schema:
            type: string
      requestBody:
        required: true
        content:
          "*/*":
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The stored blob.
          content:
            application/json:
              schema:
                type: object
                required: [accountId, blobId, type, size]
                properties:
                  accountId:
                    type: string
                  blobId:
                    type: string
                  type:
                    type: string
                  size:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: The account does not exist or the key does not reach it (a `notFound` problem).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JmapProblem"
        "413":
          description: The body is over `maxSizeUpload` (a `limit` problem).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JmapProblem"
        "429":
          description: |-
            Either the authentication limiter or a `limit` problem naming
            `maxConcurrentUpload`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ApiError"
                  - $ref: "#/components/schemas/JmapProblem"
        "500":
          description: The blob could not be stored (a `serverFail` problem).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JmapProblem"
        "507":
          description: |-
            The upload would exceed the account's storage quota (`limit:
            storage`) or the tenant's aggregate quota (`limit:
            tenant_storage`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JmapProblem"
  /scim/v2/ServiceProviderConfig:
