                type: object
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
  /scim/v2/Users:
    get:
      operationId: scimListUsers
      tags: [SCIM]
      summary: List the API-managed accounts as SCIM users
      description: |-
        Only API-managed (dynamic) accounts inside the key's domains. The
        only filter is `userName eq "x"`. `totalResults` is the number of
        users on this page, not the number that match.
      x-epistle-scope: [scim]
      parameters:
        - name: filter
          in: query
          required: false
          description: "Only `userName eq \"name\"`; anything else is a 400."
          schema:
            type: string
        - name: startIndex
          in: query
          required: false
          description: 1-based index of the first user. Defaults to 1.
          schema:
            type: integer
            minimum: 1
        - name: count
          in: query
          required: false
          description: Users per page, cut to the range 1 to 200. Defaults to 100.
          schema:
            type: integer
      responses:
        "200":
          description: A ListResponse.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimList"
        "400":
          $ref: "#/components/responses/ScimBadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
    post:
      operationId: scimCreateUser
      tags: [SCIM]
      summary: Create an account
      description: |-
        `userName` becomes the lowercased account name and the `id`.
        `emails` give the addresses. Without `password` the account is made
        with no usable password. `active: false` creates it disabled.
      x-epistle-scope: [scim]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScimUser"
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimUser"
      responses:
        "201":
          description: The account, rendered as a SCIM user.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "400":
