                address:
                  type: string
                  description: Recipient address to suppress.
                reason:
                  type: string
                  maxLength: 512
                  description: Optional reason kept with the entry. The suppression listing returns addresses only.
      responses:
        "200":
          description: The normalized address now on the list.
          content:
            application/json:
              schema:
                type: object
                required: [suppressed]
                properties:
                  suppressed:
                    type: string
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: The request body exceeds 4096 bytes.
          content:
            text/plain:
              schema:
                type: string
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableBody"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/suppression/{address}:
    delete:
      operationId: removeSuppression
      tags: [Queue]
      summary: Take an address off a suppression list
      description: |-
        Removing an address that is not on the list still answers `200`.
        The global list is refused to a confined key, as for the listing, and
        a key that is not bound to one account needs `manage:write`.
      x-epistle-scope: [mail:write, manage:write]
      parameters:
        - name: address
