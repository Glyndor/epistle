      operationId: listMaskedAddresses
      tags: [Accounts]
      summary: The masked addresses of an account
      x-epistle-scope: [manage:read]
      parameters:
        - $ref: "#/components/parameters/AccountName"
      responses:
        "200":
          description: Every masked address the account owns, in creation order.
          content:
            application/json:
              schema:
                type: object
                required: [addresses]
                properties:
                  addresses:
                    type: array
                    items:
                      $ref: "#/components/schemas/MaskedAddress"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
    post:
      operationId: createMaskedAddress
      tags: [Accounts]
      summary: Mint a masked address
      description: |-
        The local part is the label reduced to lowercase letters, digits and
        hyphens, a dot and 8 random base32 characters; the domain is that of
        the account's first address, falling back to the first configured
        domain only when the account has no address. Mail sent to it lands in
        the account while it is enabled.
      x-epistle-scope: [manage:write]
      parameters:
        - $ref: "#/components/parameters/AccountName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
                  description: Must contain at least one ASCII letter or digit.
      responses:
        "201":
          description: The address was minted.
          content:
            application/json:
              schema:
                type: object
                required: [address]
                properties:
                  address:
                    type: string
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountBoundKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |-
            `conflict`: the account is at the per-account cap of masked
            addresses (`masked_addresses_max`); delete one or raise the cap.
            `conflict`: the address's domain is disabled; enable the domain
            before creating a masked address under it.
          content:
            application/json:
              schema:
