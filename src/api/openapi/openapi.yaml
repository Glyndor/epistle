  /oauth/device_authorization:
    post:
      operationId: oauthDeviceAuthorization
      tags: [OAuth]
      summary: Start a device authorization (RFC 8628)
      description: |-
        Present only when `[oauth] signing_key` is configured; without it
        every `/oauth/*` path answers `401` without a bearer and `404` with a valid
        one. When the server is configured, no bearer is needed. The body
        is form-encoded or a JSON object of strings. `client_id` must be
        non-empty and is not otherwise checked. `scope` is a space-separated
        subset of `read write send`, defaulting to `read` when omitted. Empty
        or unknown scopes return `400 invalid_scope`. At most
        10 grants may be pending per client address (an IPv6 /64), 100 per
        IPv6 /48 and 10,000 in all; past them the answer is `429 slow_down`.
      security: []
      x-epistle-scope: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/DeviceAuthorizationRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceAuthorizationRequest"
      responses:
        "200":
          description: The codes. The grant lives 600 seconds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAuthorization"
        "400":
          $ref: "#/components/responses/OAuthError"
        "429":
          $ref: "#/components/responses/OAuthSlowDown"
  /oauth/device/approve:
    post:
      operationId: oauthDeviceApprove
      tags: [OAuth]
      summary: Approve a device grant with an account's credentials
      description: |-
        The headless stand-in for a verification page. Send `user_code` and
        the account's `login` and `password` (form or JSON), or the
        credentials as HTTP Basic. No bearer is needed. A wrong code, an
        expired code, an unknown account, a wrong password, an account that
        may not use the API protocol and a grant someone else already
        approved all answer the same `400 invalid_grant`.
      security: []
      x-epistle-scope: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/DeviceApproveRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceApproveRequest"
      responses:
        "200":
          description: The grant is approved; the device's next poll gets a token.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [approved]
        "400":
          $ref: "#/components/responses/OAuthError"
  /oauth/authorize:
    post:
      operationId: oauthAuthorize
      tags: [OAuth]
      summary: Issue an authorization code (PKCE, S256 only)
      description: |-
        Send `client_id` (non-empty, not otherwise checked),
        `code_challenge`, `code_challenge_method=S256` and the account's
        `login` and `password` (form or JSON) or HTTP Basic. No bearer is
        needed. `scope` is a space-separated subset of `read write send`,
        defaulting to `read`; empty or unknown scopes return `400 invalid_scope`.
        The code lives 600 seconds and is single-use. `plain` is
        refused. Bad credentials are `400 invalid_grant`. The
        `code_challenge` is the digest of the verifier, so it is exactly 43
        characters of `A-Z a-z 0-9 - _` (RFC 7636 section 4.2); another
        length or another character is `400 invalid_request`. At most 100
        codes may be alive for one account, 50 for one client address and
        10,000 in all; past them the answer is `429 temporarily_unavailable`.
      security: []
      x-epistle-scope: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/AuthorizeRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizeRequest"
      responses:
        "200":
          description: The code, and `state` echoed when it was sent.
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code:
                    type: string
                  state:
                    type: string
        "400":
          $ref: "#/components/responses/OAuthError"
        "429":
          $ref: "#/components/responses/OAuthTemporarilyUnavailable"
  /oauth/token:
    post:
      operationId: oauthToken
      tags: [OAuth]
      summary: Redeem a device code or an authorization code
      description: |-
        Form or JSON. `grant_type` is
        `urn:ietf:params:oauth:grant-type:device_code` (with `device_code`;
        poll no faster than every 5 seconds or get `429 slow_down`) or
        `authorization_code` (with `code` and `code_verifier`; the code is
        consumed even when the verifier is wrong) or, only when
        `[oauth] refresh_token_ttl_secs` is set, `refresh_token` (with
        `refresh_token` and an optional narrower `scope`; the token presented is
        retired and a new one returned, and presenting a retired one revokes the
        whole family). Otherwise `refresh_token` is `unsupported_grant_type`. The token is an ES256 JWT
        with `sub` the account name, valid for 3600 seconds unless
        `[oauth] access_token_ttl_secs` sets another lifetime. It is accepted
        on JMAP only for that account, with the scopes stored in the grant.
        Redemption cannot widen scopes. A missing scope claim, invalid signature,
        issuer or audience, expiry or revocation returns `401` on JMAP,
        counting in the ordinary bearer failure limiter. Tokens also support
        OAUTHBEARER on IMAP and SMTP submission; REST administration refuses them.
        The response carries `Cache-Control: no-store` and `Pragma: no-cache`.
      security: []
      x-epistle-scope: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: The access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/OAuthError"
        "429":
          $ref: "#/components/responses/OAuthSlowDown"
  /oauth/revoke:
    post:
      operationId: oauthRevoke
      tags: [OAuth]
      summary: Revoke a local access token for JMAP (RFC 7009)
      description: |-
        Possession of the token permits revoking it. No other credential is
        needed. Revocations survive restart and are checked on each JMAP request,
        WebSocket frame and event-source poll. Invalid, expired and already
        revoked tokens receive the same empty success response. A storage failure
        returns `503` and does not report successful revocation.
      security: []
      x-epistle-scope: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/RevokeRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeRequest"
      responses:
        "200":
          description: Empty success response, including for an invalid token.
        "400":
          $ref: "#/components/responses/OAuthError"
        "503":
          description: Revocation storage unavailable. Retry later.
  /mail/config-v1.1.xml:
