# No advisory is ignored. RUSTSEC-2026-0459 (the C SQLite bundled by
# `libsqlite3-sys` below 0.39) used to be listed here until sqlx 0.9.1 allowed
# `libsqlite3-sys` 0.40; both lockfiles now carry 0.40.0, which is patched.
# The list stays so that `tests/repository/advisory_ignores_agree.rs` keeps
# comparing it with `deny.toml`. An entry added here needs the same entry,
# with its reason, in `deny.toml` and a line in `docs/threat-model.md`.
[advisories]
ignore = []
