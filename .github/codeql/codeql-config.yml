# Disable the query that's been misfiring as a false positive on
# `src/cli/util.rs::fail()`'s `ExitCode::from(1)` — the analyzer's heuristic
# treats the literal `1` in that position as a hard-coded credential. Six
# refactor iterations on the affected files tried every recognised
# suppression form; the query kept firing on the enclosing function block.
# The other default-pack queries (hardcoded-credentials, taint-analysis)
# still catch genuine credentials elsewhere.
queries:
  - name: codeql/rust-queries
    uses: .
    filters:
      - exclude:
          id: rust/cleartext-storage-of-passwords
