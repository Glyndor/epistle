name: Supply chain

on:
  push:
    branches: [develop, main]
  pull_request:
  # Required check `sbom-and-licenses / SBOM and license attribution`.
  # `paths:` and `branches:` filters do not apply to merge_group, so the
  # trigger sits at the top level. See docs/merge-queue.md.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  sbom-and-licenses:
    uses: ./.github/workflows/reusable-rust-supply-chain.yml
