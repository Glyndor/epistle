name: Supply chain

on:
  push:
    branches: [main]
  pull_request:
  # Required check `sbom-and-licenses / SBOM and license attribution`.
  # `paths:` and `branches:` filters do not apply to merge_group, so the
  # trigger sits at the top level. See docs/operations/merge-queue.md.
  merge_group:
    types: [checks_requested]

# A newer push to a pull request supersedes the run in flight. Queue and
# branch runs are never cancelled: only a pull_request event is.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  sbom-and-licenses:
    uses: ./.github/workflows/reusable-rust-supply-chain.yml
