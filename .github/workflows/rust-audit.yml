name: Rust audit

on:
  schedule:
    # Weekly, Monday 06:00 UTC: catch new RUSTSEC advisories on a fixed tree.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"

permissions:
  contents: read

jobs:
  audit:
    uses: Glyndor/.github/.github/workflows/rust-audit.yml@61be27ae252d2133fab5bf17dcf03f7c13a86cb3 # v1.6.0
