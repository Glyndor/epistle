name: Rust audit

# No push trigger. The audit answers "are dependencies clean of new
# advisories or license issues on a fixed tree?", which the weekly
# schedule on main handles. workflow_dispatch is for ad hoc reruns.
# pull_request is path-filtered to changes that touch Cargo.toml,
# Cargo.lock, or deny.toml.

on:
  schedule:
    # Weekly, Monday 06:00 UTC: catch new RUSTSEC advisories on a fixed tree.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"

permissions:
  contents: read

jobs:
  audit:
    uses: ./.github/workflows/reusable-rust-audit.yml
