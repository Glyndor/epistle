name: Database

on:
  push:
    branches: [develop, main]
  pull_request:
    paths:
      - "migrations/**"
      - "src/db/**"
      - "tests/database.rs"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

jobs:
  db-tests:
    name: integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Digest-pinned: `postgres:18` is a moving major tag, so a retag would
        # silently change what the integration tests run against. Bump this
        # deliberately, the way rust-debian.yml pins its build image.
        image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: epistle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/epistle_test
      # Compile the sqlx query! macros against the committed .sqlx cache; the
      # service database is migrated at runtime by the tests themselves, so a
      # live compile-time check would race the (not-yet-applied) schema.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run database integration tests
        run: cargo test --locked --test database
