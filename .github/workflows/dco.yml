name: DCO

# Pull request and merge queue. This check walks
# `git rev-list --no-merges BASE_SHA..HEAD_SHA`, and a push has no such range.
# The question is "does every commit that is about to land carry a
# Signed-off-by trailer?", which exists for a pull request and for a merge
# group, not for a push.

on:
  pull_request:
  # Required check `dco / Signed-off-by present on every commit`. The reusable
  # reads the range off whichever event fired; on merge_group it is the squash
  # commit GitHub builds for the group, so the trailer is checked on the commit
  # that will land on develop. `paths:` and `branches:` filters do not apply to
  # merge_group.
  merge_group:
    types: [checks_requested]

# A newer push to a pull request supersedes the run in flight. Queue and
# branch runs are never cancelled: only a pull_request event is.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dco:
    # Local copy of Glyndor/.github's dco.yml at v1.21.0, byte-identical and
    # verified by sha256. The job id stays `dco` so the emitted check name stays
    # `dco / Signed-off-by present on every commit`, which the develop ruleset
    # requires character for character.
    uses: ./.github/workflows/reusable-dco.yml

  # Same range as the job above, one extra job instead of an edit to the
  # byte-identical reusable. A personal address in an author or sign-off line
  # cannot be rewritten once it is on develop, so it is refused before the
  # merge. Not part of the required `dco` check.
  noreply:
    name: author and sign-off use a GitHub noreply address
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check author and trailer addresses
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: bash .github/scripts/check_noreply_signoff.sh "$BASE_SHA" "$HEAD_SHA"

  # What the lines of a change add, not who wrote them: a private key, a known
  # token format, or a long value assigned to a name like token or signing key.
  # GitHub's push protection knows other services' token formats, not a key of
  # our own. Reports the file and line, never the value; the test of the check
  # runs first. Not part of the required `dco` check.
  secret-scan:
    name: no credential-shaped line is added
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # This job judges and runs nothing else: no file of the change is executed here
      # before or after the scan, so nothing the change carries can prepare the runner
      # (the path, a function, a `git` or a `tar`, the environment) for the judge. The
      # scanner is the one the base already has, taken out of the base with `git
      # archive`: a change that rewrote the check could otherwise make it say nothing
      # about itself. There is no fallback to the scanner of the change: a base that
      # cannot be read, or that has no scanner, stops the job. The tests of the scanner
      # run in the job `secret-scan-tests` of ci.yml, which `CI gate` waits for.
      # `scan-credentials.sh` is the name the base has today; it is dropped from the loop
      # in the pull request after this one, once the base has `check-secrets.sh`.
      - name: Scan what this change adds, every commit of it and every message
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          dir=scripts/scan-credentials
          git rev-parse --verify "$BASE_SHA^{commit}" > /dev/null || { echo "::error::the base $BASE_SHA cannot be read, so nothing was scanned"; exit 1; }
          scanner=""
          for name in check-secrets.sh scan-credentials.sh; do
            if git cat-file -e "$BASE_SHA:$dir/$name" 2>/dev/null; then
              mkdir -p "$RUNNER_TEMP/scanner"
              git archive "$BASE_SHA" "$dir/$name" | tar -x -C "$RUNNER_TEMP/scanner"
              scanner="$RUNNER_TEMP/scanner/$dir/$name"
              break
            fi
          done
          [ -n "$scanner" ] || { echo "::error::the base has no secret scan, so nothing was scanned"; exit 1; }
          bash "$scanner" "$BASE_SHA" "$HEAD_SHA"
