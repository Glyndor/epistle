name: DCO

# Pull request and merge queue. This check walks
# `git rev-list --no-merges BASE_SHA..HEAD_SHA`, and a push has no such range.
# The question is "does every commit that is about to land carry a
# Signed-off-by trailer?", which exists for a pull request and for a merge
# group, not for a push.

on:
  pull_request:
  # Required check `dco / Signed-off-by present on every commit`. The reusable
  # reads the range off whichever event fired; on merge_group it is the squash
  # commit GitHub builds for the group, so the trailer is checked on the commit
  # that will land on develop. `paths:` and `branches:` filters do not apply to
  # merge_group. See docs/operations/merge-queue.md.
  merge_group:
    types: [checks_requested]

# A newer push to a pull request supersedes the run in flight. Queue and
# branch runs are never cancelled: only a pull_request event is.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dco:
    # Local copy of Glyndor/.github's dco.yml at v1.21.0, byte-identical and
    # verified by sha256. The job id stays `dco` so the emitted check name stays
    # `dco / Signed-off-by present on every commit`, which the develop ruleset
    # requires character for character.
    uses: ./.github/workflows/reusable-dco.yml

  # Same range as the job above, one extra job instead of an edit to the
  # byte-identical reusable. A personal address in an author or sign-off line
  # cannot be rewritten once it is on develop, so it is refused before the
  # merge. Not part of the required `dco` check.
  noreply:
    name: author and sign-off use a GitHub noreply address
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check author and trailer addresses
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: bash .github/scripts/check_noreply_signoff.sh "$BASE_SHA" "$HEAD_SHA"
