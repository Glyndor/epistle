name: Interop

# Path filter on pull_request only. The protocol interop tests run
# against a reference MTA, so a PR that does not touch the protocol-
# facing modules or the test itself does not pay for the run. Push
# to develop or main is a checkpoint, so the full run fires there
# unconditionally.

on:
  push:
    branches: [develop, main]
  pull_request:
    paths:
      - "src/smtp/**"
      - "src/imap/**"
      - "src/queue/**"
      - "src/storage/**"
      - "src/tls/**"
      - "tests/interop.rs"
      - ".github/workflows/interop.yml"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

jobs:
  interop-tests:
    name: protocol interop
    runs-on: ubuntu-latest
    services:
      # Postfix as the reference outbound peer. boky/postfix is a maintained
      # image that boots an SMTP server (smtpd on 25) for the given domains with
      # no extra config; ALLOWED_SENDER_DOMAINS opens relay/acceptance for the
      # test sender domain. Host port 1025 maps to the container's plaintext 25.
      postfix:
        # Digest-pinned: `latest` is the worst case of a moving tag - the
        # reference MTA the interop tests measure against could change between
        # two runs of the same commit.
        image: boky/postfix:latest@sha256:aafc772384232497bed875e1eb66b4d3e54ba1ebc86e2e185a6dc1dbc48182ef
        env:
          ALLOWED_SENDER_DOMAINS: epistle.interop.test localhost
        ports:
          - 1025:25
        options: >-
          --health-cmd "nc -z 127.0.0.1 25 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      INTEROP_POSTFIX_HOST: localhost
      INTEROP_POSTFIX_PORT: "1025"
      # The interop tests bind epistle's own servers in-process and migrate
      # nothing, but a compile can still touch sqlx; keep the macros offline.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        run: |
          # Pinned to match ci.yml. This job exercises epistle against a
          # reference MTA (Postfix) and writes no SBOM of its own, but
          # `stable` here would still let protocol interop drift away from
          # what the gate tests on a 1.98 compiler.
          rustup toolchain install 1.98 --profile minimal
          rustup default 1.98

      - name: Run protocol interop tests
        run: cargo test --locked --test interop
