name: Release

# Tag push and manual dispatch only. This workflow answers "is this
# tag ready to release?", which is a question about a specific tag,
# not branch state. workflow_dispatch lets a maintainer re-run a
# release for an existing tag whose previous attempt failed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re-)release, e.g. v0.2.0
        required: true
        type: string
      images-only:
        description: Skip the .deb and the GitHub release (already published) and only build and publish the container image
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  # Gate every release on promoted, version-matched, advisory-free code.
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install toolchain
        run: |
          # Same pin as the build job below and as ci.yml. This job only reads
          # metadata and runs the audit, so the version matters less here - but a
          # release workflow where two jobs disagree about the compiler is a
          # question nobody wants to answer later.
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0

      - name: Tag matches the crate version
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match crate version v$version"
            exit 1
          fi

      - name: Tagged commit is on origin/main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${TAG}^{commit}" origin/main; then
            echo "::error::$TAG is not reachable from origin/main; only promoted code is released"
            exit 1
          fi

      - name: Debian changelog carries the same version
        run: |
          set -euo pipefail
          # dpkg-buildpackage takes the .deb version from debian/changelog and
          # nowhere else, so a changelog left behind produces a package labelled
          # with the version the user already has - apt then reports nothing to
          # upgrade and the release never reaches them. The tag check above
          # cannot catch it, because the tag and Cargo.toml can agree perfectly
          # while the changelog lags. Parsed here rather than with
          # dpkg-parsechangelog, which lives in dpkg-dev and this job does not
          # install.
          crate="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["packages"][0]["version"])')"
          deb="$(sed -n '1s/^[^(]*(\([^)]*\)).*/\1/p' debian/changelog)"
          if [ "$deb" != "$crate" ]; then
            echo "::error::debian/changelog is at ${deb} but Cargo.toml is at ${crate}; add a changelog entry so the .deb carries the released version."
            exit 1
          fi

      - name: Audit dependencies at release time
        run: |
          command -v cargo-audit >/dev/null || cargo install cargo-audit --locked --version "^0.22"
          cargo audit

      - name: Tag has no published release yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Releases are immutable: refuse to re-publish an existing one. The
          # workflow_dispatch path may only re-run a tag whose release failed.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::a release for $TAG already exists; releases are immutable, cut a new patch instead"
            exit 1
          fi

  build-deb:
    name: Build Debian package (${{ matrix.arch }})
    needs: verify
    if: ${{ !inputs.images-only }}
    runs-on: ${{ matrix.runner }}
    # The image, not dpkg, provides the toolchain: this is upstream 1.98, the
    # same version ci.yml pins, so the .deb users install is built by the
    # compiler that validated the code. Debian's own rustc is too old anyway -
    # trixie ships 1.85 and the dependency floor is 1.94 (set by sqlx 0.9's
    # `rust-version`), which edition 2024 alone does not tell you. Digest-pinned
    # so a retag cannot change the build environment.
    container: docker.io/library/rust@sha256:fb4b2f1dc68c06f46618948b09d0ade147e6d2b11a6581e599b0c808d5b8a167 # 1.98-slim-trixie
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Install packaging tooling
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          # musl-tools provides musl-gcc, which `ring` needs to compile its C
          # against a musl target. It is not a Rust dependency, so it cannot be
          # declared in Cargo.toml and has to be installed here.
          apt-get install -y --no-install-recommends dpkg-dev debhelper musl-tools

      - name: Install the musl target debian/rules builds for
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # debian/rules has built for musl since #758, to stop the .deb
          # carrying a glibc floor. The image ships only its own target's
          # standard library, so `--target` cannot resolve without this and the
          # build dies on "can't find crate for `core`". The PR-time job
          # installs it through the reusable workflow's `rust-target` input;
          # this one had no equivalent, so releasing has been impossible since
          # that change landed and nothing said so until a release was cut.
          case "$ARCH" in
            amd64) target=x86_64-unknown-linux-musl ;;
            arm64) target=aarch64-unknown-linux-musl ;;
            *) echo "::error::no musl target mapped for $ARCH"; exit 1 ;;
          esac
          rustup target add "$target"
          # Fail here rather than 200 crates into the build.
          rustc --print target-libdir --target "$target" >/dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Build the package
        env:
          # The queries are checked against the committed .sqlx cache, so no
          # database is needed and none is reachable from here.
          SQLX_OFFLINE: "true"
        run: |
          # dpkg-buildpackage builds for the host architecture, so each runner
          # produces its own arch's .deb natively - no emulation.
          #
          # -d skips the build-dependency check on purpose. Build-Depends
          # declares what a source rebuild with Debian's own tools needs, and
          # that is a true and useful statement, but this image satisfies the
          # toolchain from /usr/local/cargo rather than from dpkg, so the check
          # would fail on a requirement that is already met.
          dpkg-buildpackage -us -uc -b -d

      - name: Stage the .deb into the workspace
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          deb=$(find .. -maxdepth 1 -name "epistle_*_${ARCH}.deb" | sort | head -n1)
          if [ -z "$deb" ]; then
            echo "::error::no ${ARCH} .deb artifact was produced"
            exit 1
          fi
          cp "$deb" "$(basename "$deb")"
          echo "Staged $(basename "$deb")"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: epistle_*_${{ matrix.arch }}.deb

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: epistle-deb-${{ matrix.arch }}
          path: epistle_*_${{ matrix.arch }}.deb
          retention-days: 1
          if-no-files-found: error

  build:
    name: Build and publish
    needs: [verify, build-deb]
    if: ${{ !inputs.images-only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Install toolchain
        run: |
          # Pinned, not `stable`. ci.yml pins 1.98 and the .deb job builds in a
          # digest-pinned 1.98.0 image, so tracking `stable` here would mean the
          # binary the .deb carries is built by a compiler nothing agreed on -
          # and unlike CI, a release bakes that in permanently, because releases
          # are immutable. Bump this with ci.yml's toolchain input, deliberately,
          # in the same change.
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0

      - name: Build release binary
        run: cargo build --release --locked

      - name: Generate CycloneDX SBOM
        run: |
          command -v cargo-cyclonedx >/dev/null || cargo install --locked cargo-cyclonedx --version "^0.5"
          cargo cyclonedx --format json --all-features

      - name: Collect the Debian packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: epistle-deb-*
          merge-multiple: true
          path: dist

      - name: Prepare artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/epistle "dist/epistle-${TAG}-x86_64-linux"
          cp epistle.cdx.json "dist/epistle-${TAG}.cdx.json"
          # Both architectures must have arrived. The apt archive is rebuilt
          # from scratch and synced with --delete, so a product whose declared
          # architecture is missing is evicted from the served archive rather
          # than left at its previous version.
          for arch in amd64 arm64; do
            ls dist/epistle_*_"$arch".deb >/dev/null 2>&1 \
              || { echo "::error::no ${arch} .deb reached the release job"; exit 1; }
          done
          cd dist
          # SHA256SUMS is computed last so it covers the .debs too. The .sig
          # files do not exist yet, which is why they are not in it.
          sha256sum * > SHA256SUMS

      - name: Sign artifacts with the org Ed25519 key
        env:
          GLYNDOR_RELEASE_ED25519_KEY: ${{ secrets.GLYNDOR_RELEASE_ED25519_KEY }}
        run: |
          set -euo pipefail
          # Fail closed: never publish unsigned artifacts. Verifiers and the
          # apt archive trust this org Ed25519 signature.
          if [ -z "${GLYNDOR_RELEASE_ED25519_KEY:-}" ]; then
            echo "::error::GLYNDOR_RELEASE_ED25519_KEY secret is not configured; refusing to release unsigned artifacts."
            exit 1
          fi
          # Install the signing dependencies into an isolated, hash-pinned
          # virtualenv so a system-managed cryptography cannot break the pin.
          python3 -m venv "$RUNNER_TEMP/signvenv"
          venv_py="$RUNNER_TEMP/signvenv/bin/python"
          "$venv_py" -m pip install --quiet --require-hashes -r .github/scripts/sign-requirements.txt
          # The key is read from GLYNDOR_RELEASE_ED25519_KEY in the environment, not argv.
          "$venv_py" .github/scripts/sign.py "dist/epistle-${TAG}-x86_64-linux"
          # Each .deb gets its own detached signature: the apt archive verifies
          # every package against <deb>.sig before admitting it, and refuses to
          # re-sign with its own GPG key anything it did not verify first.
          for deb in dist/epistle_*.deb; do
            "$venv_py" .github/scripts/sign.py "$deb"
          done
          "$venv_py" .github/scripts/sign.py dist/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/epistle-*-x86_64-linux

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --generate-notes \
            --verify-tag \
            dist/*

  # The container stack pulls ghcr.io/glyndor/epistle:<version>, so every
  # release publishes the image next to the .deb.
  image-build:
    name: Build and push image (${{ matrix.arch }})
    needs: [verify, build]
    # An images-only dispatch skips build; the image still needs verify.
    if: ${{ always() && needs.verify.result == 'success' && (needs.build.result == 'success' || inputs.images-only) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      # The release job receives `v0.8.0`; the image tags are
      # unqualified, so strip the leading `v` once and pass it
      # down.
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      REGISTRY_IMAGE: ghcr.io/glyndor/epistle
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Build the image for ${{ matrix.arch }}
        env:
          # `VERSION` keeps its leading `v` here; the OCI label
          # records the unversioned `0.8.0` so the image is
          # addressable on its own. `REVISION` is the commit the
          # checkout above actually produced, not `${{ github.sha }}`:
          # on `workflow_dispatch` with a tag input, `github.sha` is
          # the dispatch commit (a ref-creation event in the UI), not
          # the commit the tag points at. `git rev-parse HEAD` reads
          # the commit the runner's working tree is on, which is the
          # tag's commit because the checkout step above checked out
          # the tag.
          LABEL_VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail
          crate_version="${LABEL_VERSION#v}"
          revision="$(git rev-parse HEAD)"
          podman build \
            --platform "linux/${{ matrix.arch }}" \
            --build-arg "VERSION=${crate_version}" \
            --build-arg "REVISION=${revision}" \
            -t "${REGISTRY_IMAGE}:${crate_version}-${{ matrix.arch }}" \
            .

      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `podman login` accepts `--password-stdin` so the token
          # never lands on the command line or in the runner log.
          echo "${GH_TOKEN}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push ${{ matrix.arch }} image
        env:
          CRATE_VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail
          crate_version="${CRATE_VERSION#v}"
          podman push \
            "${REGISTRY_IMAGE}:${crate_version}-${{ matrix.arch }}"

  image-manifest:
    name: Publish multi-arch image manifest
    needs: image-build
    if: ${{ always() && needs.image-build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Provenance is signed with the GitHub OIDC token. The
      # `attestations: write` permission is what the workflow-run
      # token needs to upload the signed envelope to the
      # repository's attestations endpoint.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      REGISTRY_IMAGE: ghcr.io/glyndor/epistle
    steps:
      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `actions/attest-build-provenance` with `push-to-registry: true`
          # reads `~/.docker/config.json`, the docker config file. podman's
          # default auth file lives elsewhere under `~/.config/containers/`
          # and is invisible to that action, so the attestation step would
          # fail to push the signed envelope. `--compat-auth-file` writes
          # the docker-shaped file podman's auth dir would have produced
          # (supported on podman 4.9+) so the OIDC-signed envelope lands at
          # the registry.
          mkdir -p "$HOME/.docker"
          echo "${GH_TOKEN}" | podman login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin \
            --compat-auth-file "$HOME/.docker/config.json"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERSION }}
          persist-credentials: false

      - name: Build and push the multi-arch manifest list
        id: tags
        env:
          CRATE_VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail
          crate_version="${CRATE_VERSION#v}"
          # `.github/scripts/image_tags.py` is the gate that decides
          # which tags a given version publishes. Prereleases like
          # `1.0.0-rc.1` publish the exact tag only; plain versions
          # publish the exact, the `<major>.<minor>`, and the `<major>`
          # tags. A prerelease that produced floating tags would move
          # `:0` onto a candidate and a consumer pinning the major
          # would pull the candidate as if it were the next stable.
          # The test in `.github/scripts/test_image_tags.py` pins the
          # behaviour; `scripts.yml` discovers it on its own.
          mapfile -t tags < <(python3 "$GITHUB_WORKSPACE/.github/scripts/image_tags.py" "${CRATE_VERSION}")
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "::error::image_tags.py produced no tags for ${CRATE_VERSION}"
            exit 1
          fi
          printf 'Publishing tags:'
          printf ' %s' "${tags[@]}"
          printf '\n'
          # The list of tags is emitted as a `tags` output (newline-
          # separated) so the next step can read it without re-running
          # the gate. Quoting the joined string preserves the
          # newlines through GitHub Actions' output encoding.
          {
            printf 'tags<<EOF\n'
            printf '%s\n' "${tags[@]}"
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"
          # Each tag points at the same manifest list, so a consumer
          # pinning `0.8` keeps getting patches and a consumer
          # pinning `0` keeps getting minors.
          for tag in "${tags[@]}"; do
            podman manifest create "${REGISTRY_IMAGE}:${tag}"
            # `manifest create` accepts references on the command
            # line too, but pulling them in by transport here keeps
            # the list's contents visible at the top of the job
            # and leaves `manifest create` to handle the empty-list
            # start state.
            podman manifest add "${REGISTRY_IMAGE}:${tag}" \
              "docker://${REGISTRY_IMAGE}:${crate_version}-amd64"
            podman manifest add "${REGISTRY_IMAGE}:${tag}" \
              "docker://${REGISTRY_IMAGE}:${crate_version}-arm64"
            podman manifest push --all \
              --digestfile "$RUNNER_TEMP/digest-${tag}" \
              "${REGISTRY_IMAGE}:${tag}"
          done

      - name: Read back the manifest digest for the pinned tag
        id: digest
        env:
          CRATE_VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail
          crate_version="${CRATE_VERSION#v}"
          # `podman manifest inspect --format` does not exist on
          # podman 5.x, so the digest is taken from the file
          # `manifest push --digestfile` wrote. The list of tags is
          # the one the previous step published, read back from its
          # output: prereleases publish one tag, plain versions
          # three, and the assertion below requires all of them to
          # point at the same list. Any divergence means the
          # registry is serving different lists and the attestation
          # would land on the wrong one.
          mapfile -t tags <<< "${{ steps.tags.outputs.tags }}"
          # mapfile reads the trailing newline as an empty last
          # element; drop it so the loop does not iterate over a
          # blank tag.
          if [ "${#tags[@]}" -gt 0 ] && [ -z "${tags[-1]}" ]; then
            unset 'tags[-1]'
          fi
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "::error::no tags were published for ${CRATE_VERSION}"
            exit 1
          fi
          for tag in "${tags[@]}"; do
            f="$RUNNER_TEMP/digest-${tag}"
            if [ ! -s "$f" ]; then
              echo "::error::no digest was written for tag ${tag}"
              exit 1
            fi
            d=$(cat "$f")
            if [ -z "${full_digest:-}" ]; then
              full_digest="$d"
            elif [ "$d" != "$full_digest" ]; then
              echo "::error::tag ${tag} digest ${d} differs from ${tags[0]} digest ${full_digest}; the published tags must point at the same list"
              exit 1
            fi
          done
          digest="$full_digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Manifest digest for ${REGISTRY_IMAGE}:${crate_version}: ${digest}"

      - name: Attest the multi-arch image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # The same action the .deb and the binary attest; the
          # SHA is already pinned at the top of this workflow.
          # `subject-name` + `subject-digest` target an OCI image
          # in the registry rather than a local file.
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

