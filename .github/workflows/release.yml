name: Release

# Tag push and manual dispatch only. This workflow answers "is this
# tag ready to release?", which is a question about a specific tag,
# not branch state. workflow_dispatch lets a maintainer re-run a
# release for an existing tag whose previous attempt failed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re-)release, e.g. v0.2.0
        required: true
        type: string
      images-only:
        description: Skip the .deb and the GitHub release (already published) and only build and publish the container image
        required: false
        type: boolean
        default: false
      dry-run:
        description: Rehearsal. Build, sign and check everything, then stop before the GitHub release and the container images are published
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  # Gate every release on promoted, version-matched, advisory-free code.
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # The one commit this release names. Every build job checks out this
      # SHA rather than resolving the tag again, so nothing can be built from
      # a tree the gate did not look at.
      commit: ${{ steps.resolve.outputs.commit }}
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Reject a tag that is not a release name
        # A dispatch carries the tag as free text and every later step reads
        # it as a ref, so the shape is checked before it reaches git. Nothing
        # here is interpolated into the shell: TAG arrives in the environment
        # and the pattern is spelled out here.
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::$TAG is not a release tag of the form vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac

      - name: Resolve the commit this release names
        id: resolve
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$TAG"
          tag_repo="$(mktemp -d "$RUNNER_TEMP/release-tag.XXXXXX")"
          trap 'rm -rf "$tag_repo"' EXIT
          git -C "$tag_repo" init --quiet
          git -C "$tag_repo" fetch --no-tags --depth=1 \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            "refs/tags/$TAG:refs/tags/$TAG"
          commit="$(git -C "$tag_repo" rev-parse --verify "refs/tags/${TAG}^{commit}")"
          echo "Releasing ${TAG} at ${commit}"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A literal ref: nothing a dispatch supplies decides what the runner
          # checks out before the gate has looked at it.
          ref: main
          fetch-depth: 0

      - name: Move to the release commit, only when it is promoted
        env:
          RELEASE_COMMIT: ${{ steps.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          # The tag must name a commit reachable from main, so the tree every
          # later step runs is code that already went through promotion. The
          # check runs before the switch and before any build tool starts.
          git fetch --no-tags origin "refs/tags/$TAG"
          test "$(git rev-parse --verify 'FETCH_HEAD^{commit}')" = "$RELEASE_COMMIT"
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main; then
            echo "::error::$TAG is not reachable from origin/main; only promoted code is released"
            exit 1
          fi
          git checkout --detach "$RELEASE_COMMIT"

      - name: Check the verified checkout
        env:
          RELEASE_COMMIT: ${{ steps.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"

      - name: Install toolchain
        run: |
          # Same pin as the build job below and as ci.yml. This job only reads
          # metadata and runs the audit, so the version matters less here - but a
          # release workflow where two jobs disagree about the compiler is a
          # question nobody wants to answer later.
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0

      - name: Tag matches the crate version
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match crate version v$version"
            exit 1
          fi

      - name: Debian changelog carries the same version
        run: |
          set -euo pipefail
          # dpkg-buildpackage takes the .deb version from debian/changelog and
          # nowhere else, so a changelog left behind produces a package labelled
          # with the version the user already has - apt then reports nothing to
          # upgrade and the release never reaches them. The tag check above
          # cannot catch it, because the tag and Cargo.toml can agree perfectly
          # while the changelog lags. Parsed here rather than with
          # dpkg-parsechangelog, which lives in dpkg-dev and this job does not
          # install.
          crate="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["packages"][0]["version"])')"
          deb="$(sed -n '1s/^[^(]*(\([^)]*\)).*/\1/p' debian/changelog)"
          if [ "$deb" != "$crate" ]; then
            echo "::error::debian/changelog is at ${deb} but Cargo.toml is at ${crate}; add a changelog entry so the .deb carries the released version."
            exit 1
          fi

      - name: Audit dependencies at release time
        run: |
          command -v cargo-audit >/dev/null || cargo install cargo-audit --locked --version "^0.22"
          cargo audit

      - name: Tag has no published release yet
        # An images-only dispatch exists to finish the images of a release
        # that is already published, so this gate is the full release path
        # only. It used to run for both, which made images-only unusable:
        # verify failed, image-build needs verify to succeed, and nothing ran.
        # A rehearsal publishes nothing, so it may run on a tag that is already
        # released: that is the safest tag to rehearse on.
        if: ${{ !inputs.images-only && !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Releases are immutable: refuse to re-publish an existing one. The
          # workflow_dispatch path may only re-run a tag whose release failed.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::a release for $TAG already exists; releases are immutable, cut a new patch instead"
            exit 1
          fi

      - name: The release images-only completes is published
        if: ${{ inputs.images-only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The mirror of the gate above: an images-only dispatch must point
          # at a published release for the tag this job just verified, or it
          # would push images for a version no release carries.
          published="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName --jq '.tagName' 2>/dev/null || true)"
          if [ "$published" != "$TAG" ]; then
            echo "::error::no release is published for $TAG; images-only completes the images of a published release, it does not publish one"
            exit 1
          fi

  build-deb:
    name: Build Debian package (${{ matrix.arch }})
    needs: verify
    if: ${{ !inputs.images-only }}
    runs-on: ${{ matrix.runner }}
    # The image, not dpkg, provides the toolchain: this is upstream 1.99, the
    # same version ci.yml pins, so the .deb users install is built by the
    # compiler that validated the code. Debian's own rustc is too old anyway -
    # trixie ships 1.85 and the dependency floor is 1.94 (set by sqlx 0.9's
    # `rust-version`), which edition 2024 alone does not tell you. Digest-pinned
    # so a retag cannot change the build environment.
    container: docker.io/library/rust@sha256:b8e062b1c3a80183df83d9ba187cadd2b5ab84bc78d453dbfeb2fccd5f982247 # 1.99-slim-trixie
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Install packaging tooling
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          # musl-tools provides musl-gcc, which `ring` needs to compile its C
          # against a musl target. It is not a Rust dependency, so it cannot be
          # declared in Cargo.toml and has to be installed here.
          apt-get install -y --no-install-recommends dpkg-dev debhelper musl-tools fakeroot

      - name: Install the musl target debian/rules builds for
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # debian/rules has built for musl since #758, to stop the .deb
          # carrying a glibc floor. The image ships only its own target's
          # standard library, so `--target` cannot resolve without this and the
          # build dies on "can't find crate for `core`". The PR-time job
          # installs it through the reusable workflow's `rust-target` input;
          # this one had no equivalent, so releasing has been impossible since
          # that change landed and nothing said so until a release was cut.
          case "$ARCH" in
            amd64) target=x86_64-unknown-linux-musl ;;
            arm64) target=aarch64-unknown-linux-musl ;;
            *) echo "::error::no musl target mapped for $ARCH"; exit 1 ;;
          esac
          rustup target add "$target"
          # Fail here rather than 200 crates into the build.
          rustc --print target-libdir --target "$target" >/dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit `verify` resolved, so the package is built from the
          # tree that was audited and version-checked.
          ref: ${{ needs.verify.outputs.commit }}

      - name: Build the package
        env:
          # The queries are checked against the committed .sqlx cache, so no
          # database is needed and none is reachable from here.
          SQLX_OFFLINE: "true"
        run: |
          # dpkg-buildpackage builds for the host architecture, so each runner
          # produces its own arch's .deb natively - no emulation.
          #
          # -d skips the build-dependency check on purpose. Build-Depends
          # declares what a source rebuild with Debian's own tools needs, and
          # that is a true and useful statement, but this image satisfies the
          # toolchain from /usr/local/cargo rather than from dpkg, so the check
          # would fail on a requirement that is already met.
          dpkg-buildpackage -us -uc -b -d

      - name: Stage the .deb into the workspace
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          deb=$(find .. -maxdepth 1 -name "epistle_*_${ARCH}.deb" | sort | head -n1)
          if [ -z "$deb" ]; then
            echo "::error::no ${ARCH} .deb artifact was produced"
            exit 1
          fi
          cp "$deb" "$(basename "$deb")"
          echo "Staged $(basename "$deb")"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: epistle_*_${{ matrix.arch }}.deb

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: epistle-deb-${{ matrix.arch }}
          path: epistle_*_${{ matrix.arch }}.deb
          retention-days: 1
          if-no-files-found: error

  # The release is made in three jobs so that nothing that runs a dependency
  # ever sees the signing key, and the job that holds the key never runs
  # anything it did not take from the verified commit:
  #
  #   build    compiles and attests; `contents: read`, no secret.
  #   sign     clean runner, only downloads the files, checks them and signs
  #            them; the key is given to the signing step alone.
  #   publish  attaches the files to the release; `contents: write`, no secret.
  #
  # A rehearsal (`dry-run`) goes through build and sign and stops there.
  build:
    name: Build
    needs: [verify, build-deb]
    if: ${{ !inputs.images-only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The provenance attestation has to be made in the job that produced
      # the artifact, and it needs the OIDC token and this permission.
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit `verify` resolved, not the tag name again.
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false

      - name: Install toolchain
        run: |
          # Pinned, not `stable`. ci.yml pins 1.99 and the .deb job builds in a
          # digest-pinned 1.99.1 image, so tracking `stable` here would mean the
          # binary the .deb carries is built by a compiler nothing agreed on -
          # and unlike CI, a release bakes that in permanently, because releases
          # are immutable. Bump this with ci.yml's toolchain input, deliberately,
          # in the same change.
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0

      - name: Build release binary
        run: cargo build --release --locked

      - name: Generate CycloneDX SBOM
        run: |
          # An exact version: a range here ran whatever the registry served that
          # day, in the job that builds the release.
          command -v cargo-cyclonedx >/dev/null || cargo install --locked cargo-cyclonedx --version "=0.5.9"
          cargo cyclonedx --format json --all-features

      - name: Collect the Debian packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: epistle-deb-*
          merge-multiple: true
          path: dist

      - name: Prepare artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/epistle "dist/epistle-${TAG}-x86_64-linux"
          cp epistle.cdx.json "dist/epistle-${TAG}.cdx.json"
          # Both architectures must have arrived. The apt archive is rebuilt
          # from scratch and synced with --delete, so a product whose declared
          # architecture is missing is evicted from the served archive rather
          # than left at its previous version.
          for arch in amd64 arm64; do
            ls dist/epistle_*_"$arch".deb >/dev/null 2>&1 \
              || { echo "::error::no ${arch} .deb reached the release job"; exit 1; }
          done
          cd dist
          # SHA256SUMS is computed last so it covers the .debs too. The .sig
          # files do not exist yet, which is why they are not in it.
          sha256sum -- * > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/epistle-*-x86_64-linux

      - name: Hand the files to the next job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/*
          retention-days: 1
          if-no-files-found: error

  sign:
    name: Sign
    needs: [verify, build]
    if: ${{ !inputs.images-only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The signing script and its requirements come from the verified
          # commit, never from the artifact.
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false

      - name: Receive the files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Check what arrived
        run: |
          set -euo pipefail
          cd dist
          # Only the files the build job makes, with the names it gives them, as
          # plain files. Anything else is refused before a key is near it.
          if find . -mindepth 1 \( -type l -o ! -type f \) -print -quit | grep -q .; then
            echo "::error::the artifact holds something that is not a plain file"; exit 1
          fi
          for f in *; do
            case "$f" in
              "epistle-${TAG}-x86_64-linux"|"epistle-${TAG}.cdx.json"|SHA256SUMS) ;;
              epistle_*_amd64.deb|epistle_*_arm64.deb) ;;
              *) echo "::error::unexpected file in the artifact: $f"; exit 1 ;;
            esac
          done
          for want in "epistle-${TAG}-x86_64-linux" "epistle-${TAG}.cdx.json" SHA256SUMS; do
            [ -f "$want" ] || { echo "::error::missing from the artifact: $want"; exit 1; }
          done
          ls epistle_*_amd64.deb epistle_*_arm64.deb >/dev/null
          # The hashes the build job wrote must still match the bytes received.
          sha256sum --check --strict SHA256SUMS

      # A rehearsal never touches the org key: it signs with a key made on the
      # spot, so it exercises the same script and leaves nothing that anyone
      # could trust. Two steps with their own `if`, not one expression, because
      # `a && '' || b` falls through to `b` when `a` is true.
      - name: Make a throwaway key for the rehearsal
        if: ${{ inputs.dry-run }}
        run: |
          key=$(python3 -c 'import base64, os; print(base64.b64encode(os.urandom(32)).decode())')
          echo "::add-mask::$key"
          echo "REHEARSAL_KEY=$key" >> "$GITHUB_ENV"

      - name: Sign artifacts with the org Ed25519 key
        if: ${{ !inputs.dry-run }}
        env:
          GLYNDOR_RELEASE_ED25519_KEY: ${{ secrets.GLYNDOR_RELEASE_ED25519_KEY }}
        run: .github/scripts/sign_release.sh dist "$TAG"

      - name: Sign artifacts with the throwaway key (rehearsal)
        if: ${{ inputs.dry-run }}
        env:
          GLYNDOR_RELEASE_ED25519_KEY: ${{ env.REHEARSAL_KEY }}
        run: .github/scripts/sign_release.sh dist "$TAG"

      - name: Hand the signatures to the next job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signatures
          path: dist/*.sig
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [verify, build, sign]
    # A rehearsal stops before this job.
    if: ${{ !inputs.images-only && !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Receive the files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Receive the signatures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signatures
          path: dist

      - name: Check what is going to be published
        run: |
          set -euo pipefail
          cd dist
          if find . -mindepth 1 \( -type l -o ! -type f \) -print -quit | grep -q .; then
            echo "::error::the release files hold something that is not a plain file"; exit 1
          fi
          # The same allowlist the signing job applied, plus the signatures.
          for f in *; do
            case "$f" in
              "epistle-${TAG}-x86_64-linux"|"epistle-${TAG}.cdx.json"|SHA256SUMS) ;;
              epistle_*_amd64.deb|epistle_*_arm64.deb) ;;
              "epistle-${TAG}-x86_64-linux.sig"|SHA256SUMS.sig) ;;
              epistle_*_amd64.deb.sig|epistle_*_arm64.deb.sig) ;;
              *) echo "::error::unexpected file in the release: $f"; exit 1 ;;
            esac
          done
          # Every file but the signatures is signed, and every signature has
          # content.
          for f in *; do
            case "$f" in *.sig) [ -s "$f" ] || { echo "::error::empty signature $f"; exit 1; } ;; *) [ -f "$f.sig" ] || { echo "::error::no signature for $f"; exit 1; } ;; esac
          done
          # SHA256SUMS names exactly the files that are being published, no more
          # and no fewer, and their hashes match.
          published=$(for f in *; do case "$f" in *.sig|SHA256SUMS) ;; *) echo "$f" ;; esac; done | sort)
          listed=$(sed -E 's/^[0-9a-f]{64}[ *]+//' SHA256SUMS | sort)
          if [ "$published" != "$listed" ]; then
            echo "::error::SHA256SUMS does not name exactly the published files"
            printf 'files:\n%s\nlisted:\n%s\n' "$published" "$listed"
            exit 1
          fi
          sha256sum --check --strict SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --verify-tag \
            dist/*

  # The container stack pulls ghcr.io/glyndor/epistle:<version>, so every
  # release publishes the image next to the .deb.
  image-build:
    name: Build and push image (${{ matrix.arch }})
    needs: [verify, publish]
    # An images-only dispatch skips publish; the image still needs verify. A
    # rehearsal skips it too and builds nothing.
    if: ${{ always() && !inputs.dry-run && needs.verify.result == 'success' && (needs.publish.result == 'success' || inputs.images-only) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      # The release job receives `v0.8.0`; the image tags are
      # unqualified, so strip the leading `v` once and pass it
      # down.
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      REGISTRY_IMAGE: ghcr.io/glyndor/epistle
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit `verify` resolved, so the image carries the same tree
          # the gate audited.
          ref: ${{ needs.verify.outputs.commit }}

      - name: Build the image for ${{ matrix.arch }}
        env:
          # `VERSION` keeps its leading `v` here; the OCI label
          # records the unversioned `0.8.0` so the image is
          # addressable on its own. `REVISION` is the commit the
          # checkout above actually produced, not `${{ github.sha }}`:
          # on `workflow_dispatch` with a tag input, `github.sha` is
          # the dispatch commit (a ref-creation event in the UI), not
          # the commit the tag points at. `git rev-parse HEAD` reads
          # the commit the runner's working tree is on, which is the
          # tag's commit because the checkout step above checked out
          # the tag.
          LABEL_VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail
          crate_version="${LABEL_VERSION#v}"
          revision="$(git rev-parse HEAD)"
          podman build \
            --platform "linux/${{ matrix.arch }}" \
            --build-arg "VERSION=${crate_version}" \
            --build-arg "REVISION=${revision}" \
            -t "${REGISTRY_IMAGE}:${crate_version}-${{ matrix.arch }}" \
            .

      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `podman login` accepts `--password-stdin` so the token
          # never lands on the command line or in the runner log.
          echo "${GH_TOKEN}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push ${{ matrix.arch }} image
        env:
          CRATE_VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail
          crate_version="${CRATE_VERSION#v}"
          podman push \
            "${REGISTRY_IMAGE}:${crate_version}-${{ matrix.arch }}"

  image-manifest:
    name: Publish multi-arch image manifest
    needs: [verify, image-build]
    if: ${{ always() && needs.image-build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Provenance is signed with the GitHub OIDC token. The
      # `attestations: write` permission is what the workflow-run
      # token needs to upload the signed envelope to the
      # repository's attestations endpoint.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      REGISTRY_IMAGE: ghcr.io/glyndor/epistle
    steps:
      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `actions/attest-build-provenance` with `push-to-registry: true`
          # reads `~/.docker/config.json`, the docker config file. podman's
          # default auth file lives elsewhere under `~/.config/containers/`
          # and is invisible to that action, so the attestation step would
          # fail to push the signed envelope. `--compat-auth-file` writes
          # the docker-shaped file podman's auth dir would have produced
          # (supported on podman 4.9+) so the OIDC-signed envelope lands at
          # the registry.
          mkdir -p "$HOME/.docker"
          echo "${GH_TOKEN}" | podman login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin \
            --compat-auth-file "$HOME/.docker/config.json"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit `verify` resolved. This job only reads the tag gate
          # script from the tree, and it reads it from the released one.
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false

      - name: Build and push the multi-arch manifest list
        id: tags
        env:
          CRATE_VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail
          crate_version="${CRATE_VERSION#v}"
          # `.github/scripts/image_tags.py` is the gate that decides
          # which tags a given version publishes. Prereleases like
          # `1.0.0-rc.1` publish the exact tag only; plain versions
          # publish the exact, the `<major>.<minor>`, and the `<major>`
          # tags. A prerelease that produced floating tags would move
          # `:0` onto a candidate and a consumer pinning the major
          # would pull the candidate as if it were the next stable.
          # The test in `.github/scripts/test_image_tags.py` pins the
          # behaviour; `scripts.yml` discovers it on its own.
          mapfile -t tags < <(python3 "$GITHUB_WORKSPACE/.github/scripts/image_tags.py" "${CRATE_VERSION}")
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "::error::image_tags.py produced no tags for ${CRATE_VERSION}"
            exit 1
          fi
          printf 'Publishing tags:'
          printf ' %s' "${tags[@]}"
          printf '\n'
          # The list of tags is emitted as a `tags` output (newline-
          # separated) so the next step can read it without re-running
          # the gate. Quoting the joined string preserves the
          # newlines through GitHub Actions' output encoding.
          {
            printf 'tags<<EOF\n'
            printf '%s\n' "${tags[@]}"
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"
          # Each tag points at the same manifest list, so a consumer
          # pinning `0.8` keeps getting patches and a consumer
          # pinning `0` keeps getting minors.
          for tag in "${tags[@]}"; do
            podman manifest create "${REGISTRY_IMAGE}:${tag}"
            # `manifest create` accepts references on the command
            # line too, but pulling them in by transport here keeps
            # the list's contents visible at the top of the job
            # and leaves `manifest create` to handle the empty-list
            # start state.
            podman manifest add "${REGISTRY_IMAGE}:${tag}" \
              "docker://${REGISTRY_IMAGE}:${crate_version}-amd64"
            podman manifest add "${REGISTRY_IMAGE}:${tag}" \
              "docker://${REGISTRY_IMAGE}:${crate_version}-arm64"
            podman manifest push --all \
              --digestfile "$RUNNER_TEMP/digest-${tag}" \
              "${REGISTRY_IMAGE}:${tag}"
          done

      - name: Read back the manifest digest for the pinned tag
        id: digest
        env:
          CRATE_VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail
          crate_version="${CRATE_VERSION#v}"
          # `podman manifest inspect --format` does not exist on
          # podman 5.x, so the digest is taken from the file
          # `manifest push --digestfile` wrote. The list of tags is
          # the one the previous step published, read back from its
          # output: prereleases publish one tag, plain versions
          # three, and the assertion below requires all of them to
          # point at the same list. Any divergence means the
          # registry is serving different lists and the attestation
          # would land on the wrong one.
          mapfile -t tags <<< "${{ steps.tags.outputs.tags }}"
          # mapfile reads the trailing newline as an empty last
          # element; drop it so the loop does not iterate over a
          # blank tag.
          if [ "${#tags[@]}" -gt 0 ] && [ -z "${tags[-1]}" ]; then
            unset 'tags[-1]'
          fi
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "::error::no tags were published for ${CRATE_VERSION}"
            exit 1
          fi
          for tag in "${tags[@]}"; do
            f="$RUNNER_TEMP/digest-${tag}"
            if [ ! -s "$f" ]; then
              echo "::error::no digest was written for tag ${tag}"
              exit 1
            fi
            d=$(cat "$f")
            if [ -z "${full_digest:-}" ]; then
              full_digest="$d"
            elif [ "$d" != "$full_digest" ]; then
              echo "::error::tag ${tag} digest ${d} differs from ${tags[0]} digest ${full_digest}; the published tags must point at the same list"
              exit 1
            fi
          done
          digest="$full_digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Manifest digest for ${REGISTRY_IMAGE}:${crate_version}: ${digest}"

      - name: Attest the multi-arch image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # The same action the .deb and the binary attest; the
          # SHA is already pinned at the top of this workflow.
          # `subject-name` + `subject-digest` target an OCI image
          # in the registry rather than a local file.
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

