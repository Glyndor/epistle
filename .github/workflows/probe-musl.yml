name: Probe musl

# Throwaway. Answers one question that cannot be answered locally, because this
# machine has no way to install musl-tools: does epistle cross-compile to
# x86_64-unknown-linux-musl at all? #716 wants a statically linked .deb so the
# package stops carrying a glibc 2.39 floor nobody chose, and that whole plan
# rests on this being a yes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/probe-musl.yml"

permissions:
  contents: read

jobs:
  probe:
    name: musl viability
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain and musl target
        run: |
          rustup toolchain install 1.98 --profile minimal
          rustup default 1.98
          rustup target add x86_64-unknown-linux-musl

      - name: Install musl-tools
        # aws-lc-sys is the only -sys crate in the tree and it compiles C, so it
        # needs a C cross-compiler. Measured with `cargo tree`: nothing else in
        # the graph links C, and sqlx-postgres is pure Rust rather than a libpq
        # binding, which is what made this worth probing instead of assuming.
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build for musl
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Report what came out
        run: |
          set -euo pipefail
          bin=target/x86_64-unknown-linux-musl/release/epistle
          ls -la "$bin"
          file "$bin"
          # Assert the property, not a string. `file` says "statically linked"
          # for a classic static binary and "static-pie linked" for a
          # position-independent one, and a musl build produces the second.
          # Grepping for the first reports a perfectly static binary as a
          # failure, which is what the first run of this probe did.
          #
          # What actually matters is that nothing asks for a dynamic loader at
          # run time, so that is what gets checked: no PT_INTERP segment, and
          # no NEEDED entries.
          if readelf -l "$bin" | grep -q "Requesting program interpreter"; then
            echo "::error::binary requests a dynamic loader; the glibc floor would survive"
            readelf -l "$bin" | grep -A1 "INTERP"
            exit 1
          fi
          needed=$(readelf -d "$bin" 2>/dev/null | grep -c "NEEDED" || true)
          if [ "$needed" -ne 0 ]; then
            echo "::error::binary has $needed NEEDED entries; it links shared libraries"
            readelf -d "$bin" | grep "NEEDED"
            exit 1
          fi
          echo "STATIC: no interpreter, no NEEDED entries"
          "$bin" --version
