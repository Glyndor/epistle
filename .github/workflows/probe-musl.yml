name: Probe musl

# Throwaway. Answers one question that cannot be answered locally, because this
# machine has no way to install musl-tools: does epistle cross-compile to
# x86_64-unknown-linux-musl at all? #716 wants a statically linked .deb so the
# package stops carrying a glibc 2.39 floor nobody chose, and that whole plan
# rests on this being a yes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/probe-musl.yml"

permissions:
  contents: read

jobs:
  probe:
    name: musl viability
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain and musl target
        run: |
          rustup toolchain install 1.98 --profile minimal
          rustup default 1.98
          rustup target add x86_64-unknown-linux-musl

      - name: Install musl-tools
        # aws-lc-sys is the only -sys crate in the tree and it compiles C, so it
        # needs a C cross-compiler. Measured with `cargo tree`: nothing else in
        # the graph links C, and sqlx-postgres is pure Rust rather than a libpq
        # binding, which is what made this worth probing instead of assuming.
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build for musl
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Report what came out
        run: |
          set -euo pipefail
          bin=target/x86_64-unknown-linux-musl/release/epistle
          ls -la "$bin"
          file "$bin"
          # The whole point: no dynamic loader, no libc6 dependency.
          if file "$bin" | grep -q "statically linked"; then
            echo "STATIC: yes"
          else
            echo "::error::binary is not statically linked; the glibc floor would survive"
            exit 1
          fi
          "$bin" --version
