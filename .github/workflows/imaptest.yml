name: imaptest

# Dovecot's imaptest scripted tests against a server built from this commit.
# .github/scripts/imaptest.sh starts the server with an imaps listener and
# one account, runs every script from the imaptest source, and fails on any
# script outside its KNOWN_FAILING list, and on a listed one that passes.
# The imaptest image is pinned by digest and its scripts by commit, so a
# change upstream never changes the result here.
#
# Path filter on pull_request only, the same shape as upgrade.yml: a PR that
# does not touch IMAP, storage or this job does not pay for it. Push to
# `develop` or `main` runs it unconditionally.

on:
  push:
    branches: [develop, main]
    paths:
      - "src/imap/**"
      - "src/storage/**"
      - "src/smtp/line/mod.rs"
      - "tests/fixtures/imaptest.mbox"
      - ".github/scripts/imaptest.sh"
      - ".github/workflows/imaptest.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "src/imap/**"
      - "src/storage/**"
      - "src/smtp/line/mod.rs"
      - "tests/fixtures/imaptest.mbox"
      - ".github/scripts/imaptest.sh"
      - ".github/workflows/imaptest.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      # Files that only exist under #[cfg(test)] cannot change what this job
      # builds or runs, so a pull request that touches only them does not pay
      # for it. Same exclusions as db.yml. The module that declares them
      # (`mod tests;` in a mod.rs) is not matched, and the push above still
      # runs everything.
      - "!src/**/tests/**"
      - "!src/**/*_tests*.rs"
      - "!src/**/tests_*.rs"
      - "!src/**/test_support.rs"

# A newer push to a pull request supersedes the run in flight. Queue and
# branch runs are never cancelled: only a pull_request event is.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  imaptest:
    name: imaptest scripted
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAPTEST_IMAGE: docker.io/dovecot/imaptest@sha256:8e10d66bf5008a0f5d22425357fb653502f39dc83bc08367fb249edc69da546c
      CONTAINER: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The scripts live in the imaptest source, not in the image. Pinned to
      # the commit the image was built from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dovecot/imaptest
          ref: f50b6807297befe2d3a33f3c39124f3a832520c7
          path: imaptest-source
          persist-credentials: false

      - name: Install toolchain
        run: |
          rustup toolchain install 1.99 --profile minimal
          rustup default 1.99

      - name: Build
        run: cargo build --locked

      - name: Pull imaptest
        run: docker pull "$IMAPTEST_IMAGE"

      - name: Run imaptest
        run: .github/scripts/imaptest.sh target/debug/epistle imaptest-source
