name: Fuzz

# No push trigger. Fuzzing asks "does cargo fuzz surface parser panics
# on a fixed tree?", which is a property of HEAD, not a commit range.
# The nightly schedule lives on main, the branch GitHub reads schedule:
# triggers from. pull_request is path-filtered to keep per-PR cost down
# to parser-facing changes.

on:
  schedule:
    # Nightly short fuzz run to surface parser panics on a fixed tree.
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      # This file is in its own filter on purpose. A workflow whose path
      # list omits itself does not run on the pull request that changes
      # it, so a broken edit merges without ever having been executed.
      - ".github/workflows/fuzz.yml"
      - ".github/scripts/fuzz_targets.py"
      - "src/smtp/**"
      - "src/imap/**"
      - "src/sieve/**"
      - "src/pop3/**"
      - "src/managesieve/**"
      - "src/dkim/**"
      - "src/dmarc/**"
      - "src/reports/**"
      - "src/api/jmap/**"
      - "src/fuzzing.rs"
      - "fuzz/**"

# A newer push to a pull request supersedes the run in flight. Queue and
# branch runs are never cancelled: only a pull_request event is.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: choose targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A pull request runs the targets of the protocols it touches; a
      # schedule or a manual run, and any change the script cannot narrow,
      # run all of them. See .github/scripts/fuzz_targets.py.
      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/fuzz_targets.py

  fuzz:
    name: cargo fuzz
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nightly toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            fuzz/target
          key: cargo-fuzz-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.toml') }}

      - name: Install cargo-fuzz
        run: command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --locked --version "^0.13"

      - name: Fuzz ${{ matrix.target }}
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=60 -timeout=10
