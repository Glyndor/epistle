name: Fuzz

# No push trigger. Fuzzing asks "does cargo fuzz surface parser panics
# on a fixed tree?", which is a property of HEAD, not a commit range.
# The nightly schedule lives on main, the branch GitHub reads schedule:
# triggers from, and it checks out develop. pull_request is path-filtered to keep per-PR cost down
# to parser-facing changes.

on:
  schedule:
    # Nightly short fuzz run to surface parser panics on a fixed tree.
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      # This file is in its own filter on purpose. A workflow whose path
      # list omits itself does not run on the pull request that changes
      # it, so a broken edit merges without ever having been executed.
      - ".github/workflows/fuzz.yml"
      - ".github/scripts/fuzz_targets.py"
      # Neither root manifest file. The fuzz crate is a workspace of its own
      # and resolves from fuzz/Cargo.lock (below, under fuzz/**): with the root
      # Cargo.lock removed, `cargo metadata --locked` on fuzz/Cargo.toml prints
      # the same resolution, so the root lockfile changes nothing it builds. A
      # new or raised dependency moves fuzz/Cargo.lock as well, because
      # ci.yml's lint refuses a stale one. Cargo.toml stays off so that a pull
      # request that only declares a test target does not pay for this; a
      # change to a dependency's features there is left to the nightly run.
      # A version bump moves fuzz/Cargo.lock and runs no target: see
      # .github/scripts/fuzz_targets.py.
      - "src/smtp/**"
      - "src/imap/**"
      - "src/sieve/**"
      - "src/pop3/**"
      - "src/managesieve/**"
      - "src/dkim/**"
      - "src/dmarc/**"
      - "src/spf/**"
      - "src/reports/**"
      - "src/api/jmap/**"
      - "src/antispam/attachments/**"
      - "src/webdav/**"
      - "src/arc/**"
      - "src/config/**"
      - "src/jwt/**"
      - "src/queue/client/**"
      - "src/queue/srs/**"
      - "src/mtasts/**"
      - "src/tlsrpt/**"
      - "src/dane/**"
      - "src/rules/**"
      - "src/migrate/imap/**"
      - "src/cli/backup/**"
      - "src/antispam/arf/**"
      - "src/fuzzing/**"
      - "fuzz/**"
      # Files that only exist under #[cfg(test)] cannot change what this job
      # builds or runs, so a pull request that touches only them does not pay
      # for it. Same exclusions as db.yml. The module that declares them
      # (`mod tests;` in a mod.rs) is not matched, and the nightly run still
      # covers everything.
      - "!src/**/tests/**"
      - "!src/**/*_tests*.rs"
      - "!src/**/tests_*.rs"
      - "!src/**/test_support.rs"
      # More names that only exist under #[cfg(test)]: the tests.rs leaves, the
      # helper modules, the hostile HTTP harness and the keys and captures the
      # tests read with include_bytes!.
      - "!src/**/tests.rs"
      - "!src/**/*_test_support.rs"
      - "!src/test_support/**"
      - "!src/smtp/directory/fixtures/**"
      - "!src/smtp/session/test_hooks.rs"
      - "!src/dns/txt_fixtures.rs"
      - "!src/hostile_public_http/**"
      - "!src/**/testdata/**"
      - "!src/dkim/test_*.pem"

# A newer push to a pull request supersedes the run in flight. Queue and
# branch runs are never cancelled: only a pull_request event is.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: choose targets
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    # Measured 2026-10-30: the slowest of four green runs took 1 min.
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The nightly run fires from the workflow file on main, the branch
          # GitHub reads schedule: from, but main changes only at a release.
          # It fuzzes develop, so what was merged during the day is fuzzed
          # the same night; every other event keeps its own ref.
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
          fetch-depth: 0

      # A pull request runs the targets of the protocols it touches, and a
      # pure version bump none; a schedule or a manual run, and any change
      # the script cannot narrow, run all of them. The bump judge is read
      # from the base commit, which fetch-depth 0 brings. See
      # .github/scripts/fuzz_targets.py.
      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/fuzz_targets.py

  fuzz:
    name: cargo fuzz
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    # Measured 2026-10-30: the slowest of four green runs took 16 min.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The nightly run fires from the workflow file on main, the branch
          # GitHub reads schedule: from, but main changes only at a release.
          # It fuzzes develop, so what was merged during the day is fuzzed
          # the same night; every other event keeps its own ref.
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}

      # Pinned to a dated nightly. On 2026-11-01 the floating `nightly` stopped
      # compiling `ldap3` (error[E0391]: cycle detected when computing when
      # `lber::structures::explicit::ExplicitTag` needs async drop), which failed
      # every fuzz job on every pull request that touched the fuzz lockfile and
      # would have failed the daily run on main. 2026-10-31 built the whole fuzz
      # crate. Move the date forward when a newer nightly builds it again.
      - name: Install nightly toolchain
        run: |
          rustup toolchain install nightly-2026-10-31 --profile minimal
          rustup default nightly-2026-10-31

      # Restore only. A pull request and a merge queue group used to save their
      # own copy of `fuzz/target` (about 528 MB each), which evicted what the
      # default branches seeded; only a push or a schedule on a default branch
      # saves, with the condition `rust-cache` uses.
      - id: fuzz-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            fuzz/target
          key: cargo-fuzz-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.toml') }}

      - name: Install cargo-fuzz
        run: command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --locked --version "^0.13"

      - name: Show the tree under test
        run: git log -1 --format='%H %s'

      - name: Fuzz ${{ matrix.target }}
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: cargo fuzz run "$FUZZ_TARGET" -- -max_total_time=60 -timeout=10

      - if: >-
          ${{ !cancelled()
          && steps.fuzz-cache.outputs.cache-hit != 'true'
          && (github.event_name == 'push' || github.event_name == 'schedule')
          && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            fuzz/target
          key: cargo-fuzz-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.toml') }}
