name: Fuzz

# No push trigger. Fuzzing asks "does cargo fuzz surface parser panics
# on a fixed tree?", which is a property of HEAD, not a commit range.
# The nightly schedule lives on main, the branch GitHub reads schedule:
# triggers from. pull_request is path-filtered to keep per-PR cost down
# to parser-facing changes.

on:
  schedule:
    # Nightly short fuzz run to surface parser panics on a fixed tree.
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "src/smtp/**"
      - "src/imap/**"
      - "src/sieve/**"
      - "src/pop3/**"
      - "src/managesieve/**"
      - "fuzz/**"

permissions:
  contents: read

jobs:
  fuzz:
    name: cargo fuzz
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            smtp_command,
            smtp_line,
            smtp_address,
            imap_command,
            sieve_message,
            sieve_script,
            pop3_command,
            managesieve_command,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nightly toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            fuzz/target
          key: cargo-fuzz-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.toml') }}

      - name: Install cargo-fuzz
        run: command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --locked --version "^0.13"

      - name: Fuzz ${{ matrix.target }}
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=60 -timeout=10
