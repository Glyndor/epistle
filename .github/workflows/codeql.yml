name: CodeQL

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        language: [rust]

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Internal CodeQL: brings code scanning under the repo's control. The
      # presence of this workflow file replaces GitHub's default code scanning
      # for this repo, so the queries that run (and any exclusions) are now
      # whatever this file + the config-file below say — no external setup
      # running behind the scenes.
      #
      # The config-file is `.github/codeql/codeql-config.yml` and excludes the
      # `rust/cleartext-storage-of-passwords` query (false-positive pattern
      # across six refactor iterations on auth_tests.rs and cli/util.rs; see
      # #658 and the comments in the config file).
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          category: "/language:${{ matrix.language }}"
