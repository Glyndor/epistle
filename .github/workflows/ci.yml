name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    uses: Glyndor/.github/.github/workflows/rust-ci.yml@505d78df893bfc2f73261ff285529e6afd46f5ac # v1.9.1
    with:
      # Pin the toolchain so CI no longer floats to whatever `stable` is that
      # day — an unpinned toolchain turned every open PR red when Rust 1.97
      # widened a clippy lint. Now on 1.97 (the org default), with that lint
      # fixed; bump deliberately through this input, never by tracking stable.
      toolchain: "1.97"
      coverage-threshold: 90
      # The reputation and db modules are exercised by the Database workflow
      # (Postgres service), not the no-DB coverage job; exclude them here.
      coverage-ignore-regex: "(db/mod|antispam/(reputation|corpus|hook)|acme/(transport|renew)|pop3/(backend|server)|managesieve/server|directory_store/(sql|ldap))\\.rs"
