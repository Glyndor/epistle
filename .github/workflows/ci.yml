name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    uses: Glyndor/.github/.github/workflows/rust-ci.yml@61be27ae252d2133fab5bf17dcf03f7c13a86cb3 # v1.6.0
    with:
      coverage-threshold: 90
      # The reputation and db modules are exercised by the Database workflow
      # (Postgres service), not the no-DB coverage job; exclude them here.
      coverage-ignore-regex: "(db/mod|antispam/(reputation|corpus|hook)|acme/(transport|renew)|pop3/(backend|server)|managesieve/server|directory_store/(sql|ldap))\\.rs"
