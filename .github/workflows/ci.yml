name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  # Required checks `rust / Format & lint`, `rust / Test` and `rust / Coverage`: the merge queue fires
  # `merge_group` on a temporary `gh-readonly-queue/...` branch and a required check that
  # does not report there leaves the queue waiting forever.
  # `paths:` and `branches:` filters do not apply to merge_group, so the
  # trigger sits at the top level. See docs/merge-queue.md.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  rust:
    uses: ./.github/workflows/reusable-rust-ci.yml
    with:
      # Pin the toolchain so CI no longer floats to whatever `stable` is that
      # day — an unpinned toolchain turned every open PR red when Rust 1.97
      # widened a clippy lint. Now on 1.98 (the org default), with that lint
      # fixed; bump deliberately through this input, never by tracking stable.
      # Kept equal to the rust-supply-chain.yml default — a repo whose SBOM is
      # produced by a compiler its test suite never ran is podup#1487.
      toolchain: "1.98"
      # The floor CI builds on. It no longer comes from `debian/control`: the .deb
      # is built for musl with a rustup toolchain (`release.yml` pins 1.98.0), so
      # there is no packaging floor to promise. 1.94 is now derived from sqlx
      # 0.9's own `rust-version`, which makes it a measured floor on the build
      # graph rather than on the operating system, and tied to `rust-version` in
      # Cargo.toml by tests/msrv_agrees_with_ci.rs.
      #
      # 1.88 was the previous floor; it came from a build that failed (`rcgen`,
      # `time` and `icu_properties` each wanted more than `edition = "2024"`
      # implied), and was the one this input promised until sqlx 0.9 widened the
      # dep graph.
      msrv: "1.94"
      # fakeroot is what lets the packaging tests run the maintainer scripts.
      # Those scripts stat the owner and mode of every path they touch, and the
      # tests assert that a root-owned store is accepted and a writable one is
      # refused. Without fakeroot the scripts refuse to copy anything, so the
      # tests would fail for a reason that has nothing to do with the code under
      # test. The runner image carries it today; naming it makes the dependency
      # survive a different image rather than being rediscovered there.
      apt-packages: "fakeroot"
      # The `Doc warnings` job is gated on this input and this repository never
      # passed it, so the job has been skipping since it existed. It had ten
      # findings waiting when I turned it on: three unresolved intra-doc links,
      # one redundant link target, and six public items documenting their
      # contract in terms of constants that lived in a private module, so a
      # reader could see the promise and not the value it named. All fixed in
      # the same change, because a gate that lands red is a gate somebody
      # silences.
      doc-warnings: true
      coverage-threshold: 88
      # Files the no-DB coverage job cannot fairly measure — each needs a live
      # service or is thin connection-accept glue, so they are excluded here
      # rather than padded with hollow tests:
      #   db/mod, antispam/{reputation,corpus,hook}, directory_store/sql — need
      #     PostgreSQL; the Database workflow exercises them (without measuring).
      #   directory_store/ldap — needs an LDAP server (tests/ldap.rs, gated on
      #     INTEROP_LDAP_URL).
      #   acme/renew — the certificate-renewal path needs a live ACME directory.
      #   pop3/server, managesieve/server — connection-accept glue, exercised
      #     end-to-end rather than by unit tests.
      # acme/transport and pop3/backend are well covered and deliberately NOT
      # excluded (they count toward the gate).
      # Test files (the *_tests(_<word>)?.rs splits and test_support.rs) are
      # left out for a different reason: cargo llvm-cov does not separate them
      # from production code by name, and a test file split to stay under the
      # line limit raises the coverage number, which is the opposite of what
      # the gate is for. The number below dropped from 90 to 88 because the
      # gate stopped counting test code as covered production code; this is
      # the gate becoming honest, not a relaxed gate. Ratcheted up from here
      # (issue #921).
      # The test modules of storage/delivery and of imap/session/list_status
      # are named after their module, so they are listed one by one: the
      # folder holds the module itself (mod.rs) and its coverage must count.
      coverage-ignore-regex: "(db/mod|antispam/(reputation|corpus|hook|bans_sql)|acme/renew|pop3/server|managesieve/server|directory_store/(sql|ldap)|storage/delivery/(containment|default_mailboxes|sieve_limits|sieve_names|sieve_warnings)|imap/session/list_status/(hierarchy|root_hierarchy|special_use_selection)|_tests(_[a-z0-9_]+)?|test_support|tests_[a-z0-9_]+|/tests)\\.rs"
  dependabot-freshness:
    # Not a required check and it reads repository state, not the queued
    # commit, so it would only spend a runner inside the queue.
    if: github.event_name != 'merge_group'
    uses: ./.github/workflows/reusable-dependabot-freshness.yml
    with:
      max-age-days: 15
