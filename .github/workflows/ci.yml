name: CI

# One workflow carries every check a pull request must pass, and one job at the
# end, `gate`, is the check the ruleset requires. GitHub counts a skipped job
# as a pass, and the plan below skips work on purpose (a pull request that
# only edits documentation compiles nothing), so a required check that can end
# up skipped says "passed" for work that never ran. `gate` runs always and
# fails unless the plan succeeded and every suite either succeeded or was
# skipped because the plan said so. The suite names are not required any more.
#
# The jobs moved here from debian.yml, line-limit.yml and supply-chain.yml keep
# their ids and their reusable job names, so the checks they emit keep their
# names; only the file changed.

on:
  # develop is not listed: a push to develop would be a second run of the commit
  # the merge queue just built, and the queue is where it was checked.
  push:
    branches: [main]
  # The branch filter tells `develop` from `Develop`; an expression comparing
  # `base.ref == 'develop'` does not, since GitHub compares strings without regard
  # to case. This workflow emits the check the rulesets require, so it runs only
  # for a base that is exactly one of the two branches they protect, and the gate
  # checks that again in shell.
  pull_request:
    branches: [develop, main]
  schedule:
    # Seeds the cargo caches that pull requests and the merge queue restore from:
    # a cache written on a pull request or on a queue ref is invisible to every
    # other one, and only `main` and `develop` are visible to all of them. The
    # plan selects the Rust jobs for this event and nothing else.
    - cron: "17 2 * * *"
  # Required check `CI gate`, and the checks it replaces in the ruleset: the
  # merge queue fires `merge_group` on a temporary `gh-readonly-queue/...`
  # branch and a required check that does not report there leaves the queue
  # waiting forever.
  # `paths:` and `branches:` filters do not apply to merge_group, so the
  # trigger sits at the top level.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  plan:
    uses: ./.github/workflows/reusable-ci-plan.yml

  # The plan's answer is the `if` of the job that calls the reusable, so a suite
  # the plan skips shows as `skipped` here and `CI gate` can tell it from one
  # that ran: the result of a caller is `success` even when every job inside it
  # was skipped. `!= 'false'` keeps an empty or missing output on the side of
  # running.
  rust:
    needs: plan
    if: ${{ !cancelled() && (needs.plan.outputs.lint != 'false' || needs.plan.outputs.tests != 'false' || needs.plan.outputs.doc != 'false' || needs.plan.outputs.msrv != 'false') }}
    uses: ./.github/workflows/reusable-rust-ci.yml
    with:
      run-lint: ${{ needs.plan.outputs.lint != 'false' }}
      run-tests: ${{ needs.plan.outputs.tests != 'false' }}
      run-msrv: ${{ needs.plan.outputs.msrv != 'false' }}
      # Pin the toolchain so CI no longer floats to whatever `stable` is that
      # day — an unpinned toolchain turned every open PR red when Rust 1.97
      # widened a clippy lint. Now on 1.100 (the org default), with that lint
      # fixed; bump deliberately through this input, never by tracking stable.
      # Kept equal to the rust-supply-chain.yml default — a repo whose SBOM is
      # produced by a compiler its test suite never ran is podup#1487.
      toolchain: "1.100.0"
      # The floor CI builds on. It no longer comes from `debian/control`: the .deb
      # is built for musl with a rustup toolchain (`release.yml` pins 1.100.0), so
      # there is no packaging floor to promise. 1.98 is now derived from
      # mail-parser 1.0's own `rust-version`, which makes it a measured floor on
      # the build graph rather than on the operating system, and tied to `rust-version` in
      # Cargo.toml by tests/msrv_agrees_with_ci.rs.
      #
      # 1.88 was the previous floor; it came from a build that failed (`rcgen`,
      # `time` and `icu_properties` each wanted more than `edition = "2024"`
      # implied), and was the one this input promised until sqlx 0.9 widened the
      # dep graph.
      msrv: "1.98"
      # fakeroot is what lets the packaging tests run the maintainer scripts.
      # Those scripts stat the owner and mode of every path they touch, and the
      # tests assert that a root-owned store is accepted and a writable one is
      # refused. Without fakeroot the scripts refuse to copy anything, so the
      # tests would fail for a reason that has nothing to do with the code under
      # test. The runner image carries it today; naming it makes the dependency
      # survive a different image rather than being rediscovered there.
      apt-packages: "fakeroot"
      # The `Doc warnings` job is gated on this input and this repository never
      # passed it, so the job has been skipping since it existed. It had ten
      # findings waiting when I turned it on: three unresolved intra-doc links,
      # one redundant link target, and six public items documenting their
      # contract in terms of constants that lived in a private module, so a
      # reader could see the promise and not the value it named. All fixed in
      # the same change, because a gate that lands red is a gate somebody
      # silences.
      doc-warnings: ${{ needs.plan.outputs.doc != 'false' }}
      coverage-threshold: 88
      # Files the no-DB coverage job cannot fairly measure — each needs a live
      # service or is thin connection-accept glue, so they are excluded here
      # rather than padded with hollow tests:
      #   db/mod, antispam/{reputation,corpus,hook}, directory_store/sql — need
      #     PostgreSQL; the Database workflow exercises them (without measuring).
      #     antispam/corpus is a folder split by responsibility, so the entry
      #     names its files one by one; corpus/train/mod.rs stays counted here.
      #   directory_store/ldap — needs an LDAP server (tests/system/ldap.rs, gated on
      #     INTEROP_LDAP_URL).
      #     The two directory_store modules are folders now (sql/mod.rs and
      #     ldap/mod.rs), so the entry names both.
      #   acme/renew — the certificate-renewal path needs a live ACME directory.
      #     The module is a folder now (renew/mod.rs), so the entry names both.
      #   pop3/server, managesieve/server — connection-accept glue, exercised
      #     end-to-end rather than by unit tests. Both are folders now
      #     (server/mod.rs), so the entry names both.
      # acme/transport and pop3/backend are well covered and deliberately NOT
      # excluded (they count toward the gate).
      # Test files (the *_tests(_<word>)?.rs splits, the leaves of a tests/
      # folder and test_support.rs) are
      # left out for a different reason: cargo llvm-cov does not separate them
      # from production code by name, and a test file split to stay under the
      # line limit raises the coverage number, which is the opposite of what
      # the gate is for. The number below dropped from 90 to 88 because the
      # gate stopped counting test code as covered production code; this is
      # the gate becoming honest, not a relaxed gate. Ratcheted up from here
      # (issue #921).
      # The test modules of storage/delivery and of imap/session/list_status
      # are named after their module, so they are listed one by one: the
      # folder holds the module itself (mod.rs) and its coverage must count.
      # A leaf of a tests/ folder may carry helpers of its own, which live in
      # a folder named after it (src/smtp/identification/tests/base/client.rs),
      # so the last alternative covers the leaves of a tests/ folder under
      # src/ whatever their depth.
      coverage-ignore-regex: "(db/mod|antispam/((reputation|hook)(/mod)?|corpus(/(mod|store|score|training))?|bans/sql/mod)|acme/renew(/mod)?|pop3/server(/mod)?|managesieve/server(/mod)?|directory_store/(sql|ldap)(/mod)?|storage/delivery/(containment|default_mailboxes|sieve_limits|sieve_names|sieve_warnings)|imap/session/list_status/(hierarchy|root_hierarchy|special_use_selection)|_tests(_[a-z0-9_]+)?|test_support|tests_[a-z0-9_]+|/tests)\\.rs|/tests/[^/]+\\.rs|src/[^/]*(/[^/]+)*/tests(/[^/]+)*\\.rs"
  dependabot-freshness:
    # Not a required check and it reads repository state, not the queued
    # commit, so it would only spend a runner inside the queue.
    needs: plan
    if: ${{ !cancelled() && github.event_name != 'merge_group' && needs.plan.outputs.freshness != 'false' }}
    uses: ./.github/workflows/reusable-dependabot-freshness.yml
    with:
      max-age-days: 15

  # Is epistle still a legitimate Debian package? Two different questions, two
  # different builds: this one builds with Debian's own rustc through the
  # reusable, and `dpkg-checkbuilddeps` proves Build-Depends is satisfiable
  # rather than aspirational. release.yml answers the other question with a
  # pinned upstream toolchain (1.100.0, the version this workflow validates), so
  # the .deb a user installs is built by the compiler that vouched for the code.
  # Neither build subsumes the other. Coverage owns the workspace suite.
  debian:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.debian != 'false' }}
    uses: ./.github/workflows/reusable-rust-debian.yml
    with:
      package-name: epistle
      run-build: ${{ needs.plan.outputs.debian != 'false' }}
      # The package build runs as root in a container, which the ordinary test
      # job does not, so a test that relies on a permission bit passes there and
      # fails here. A pull request into develop and the merge queue skip the
      # tests (the build is the question they ask); the promotion into main and
      # the push to main run them, so the failure shows before the tag instead of
      # after it (0.13.0 and 0.13.1 were tagged and never published).
      run-tests: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || github.base_ref == 'main' }}
      # Not the reusable's trixie default: trixie ships rustc 1.85 and the
      # dependency floor is 1.94 (set by sqlx 0.9's `rust-version`), which
      # edition 2024 alone does not reveal. sid carries 1.95. Digest-pinned so
      # the check runs against a fixed environment instead of a moving tag.
      debian-image: "debian:sid@sha256:e276677157e13bc51ea5b8651f54ad28883f503cc37b3e3af2c4b6cc2f4efe7b"
      # Debian's toolchain ships no musl standard library, so debian/rules
      # builds for a target it has to bring itself. Keep this in step with the
      # toolchain of the `rust` job: the whole point is that the packaged binary
      # comes from the compiler CI validates with.
      rust-toolchain: "1.100.0"
      rust-target: x86_64-unknown-linux-musl
      # aws-lc-sys is the only -sys crate in the tree and it compiles C, so
      # cross-compiling to musl needs a C cross-compiler. ring and rcgen
      # compile C without being -sys crates; the same package covers all three.
      # Measured by .github/workflows/probe-musl.yml (epistle#757, closed):
      # without it the build fails at aws-lc-sys and the floor survives.
      apt-packages: "musl-tools fakeroot jq"

  # A statement about the state of the whole tree, not about a diff: the reusable
  # ends in `git ls-files -z` and counts the lines of every tracked file by
  # extension. It does not depend on the plan, because a change that touches no
  # source file can still be the one that leaves a file over the limit (a moved
  # exception, a new extension), and it costs seconds.
  line-limit:
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/reusable-line-limit.yml

  sbom-and-licenses:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.supply != 'false' }}
    uses: ./.github/workflows/reusable-rust-supply-chain.yml
    with:
      run-sbom: ${{ needs.plan.outputs.supply != 'false' }}

  # The one check the ruleset requires from this workflow. It runs whatever
  # happened to the jobs it waits for, because a job that `needs` a failed job is
  # skipped and a skipped job reports success. It fails unless:
  #   - the plan succeeded, and every output it gives is `true` or `false`;
  #   - every suite succeeded, or was skipped and the plan said `false` for each
  #     thing that suite does.
  # A suite that failed, was cancelled, or was skipped without that `false` is a
  # failure here. A `needs` entry the table below does not know is a failure too,
  # so a job added to this workflow cannot be left outside the gate.
  # `dependabot-freshness` is outside on purpose: it reads the age of the newest
  # Dependabot pull request, not the commit, so it would fail unrelated work.
  # The ruleset requires `CI gate` and `dco / Signed-off-by present on every
  # commit`; the names of the suites above are not required.
  gate:
    # `CI gate` in the merge queue and on a pull request into develop, `CI gate
    # (main)` on a pull request into main, which plans differently, and a name no
    # ruleset requires for any other event. The trigger only lets those two bases
    # through; the step checks the base again. A job that is skipped emits its name
    # too, and a skipped job counts as passed, so nothing else may carry the name a
    # ruleset requires.
    name: ${{ github.event_name == 'merge_group' && 'CI gate' || github.event_name == 'pull_request' && (github.event.pull_request.base.ref == 'main' && 'CI gate (main)' || 'CI gate') || format('CI gate ({0})', github.event_name) }}
    needs: [plan, rust, debian, line-limit, sbom-and-licenses]
    if: always()
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every suite ran or the plan said it could be skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import sys

          SUITES = {
              "rust": ("lint", "tests", "doc", "msrv"),
              "debian": ("debian",),
              "line-limit": (),
              "sbom-and-licenses": ("supply",),
          }
          needs = json.loads(os.environ["NEEDS"])
          problems = []

          # Compared here, in code that tells `develop` from `Develop`, and not
          # only in the expression that names this job.
          if os.environ.get("EVENT_NAME") == "pull_request" and os.environ.get("BASE_REF") not in ("develop", "main"):
              problems.append(f"the base of this pull request is {os.environ.get('BASE_REF')!r}, not develop or main")

          plan = needs.get("plan") or {}
          if plan.get("result") != "success":
              problems.append(f"the plan job did not succeed (result: {plan.get('result')})")
          outputs = plan.get("outputs") or {}
          for dims in SUITES.values():
              for dim in dims:
                  if outputs.get(dim) not in ("true", "false"):
                      problems.append(f"plan output {dim!r} is neither true nor false: {outputs.get(dim)!r}")

          for name in needs:
              if name != "plan" and name not in SUITES:
                  problems.append(f"{name} is not in the gate table")
          for name, dims in SUITES.items():
              job = needs.get(name)
              if job is None:
                  problems.append(f"{name} is not among the jobs the gate waits for")
                  continue
              result = job.get("result")
              if result == "success":
                  continue
              if result == "skipped":
                  if plan.get("result") == "success" and dims and all(outputs.get(d) == "false" for d in dims):
                      continue
                  problems.append(f"{name} was skipped and the plan did not say it could be")
              else:
                  problems.append(f"{name} did not succeed (result: {result})")

          print(f"{'suite':<20} {'plan says':<28} result")
          for name, dims in SUITES.items():
              says = ",".join(f"{d}={outputs.get(d)}" for d in dims) or "always runs"
              print(f"{name:<20} {says:<28} {(needs.get(name) or {}).get('result')}")
          for problem in problems:
              print(f"::error::{problem}")
          if problems:
              sys.exit(1)
          print("The plan succeeded and every suite passed or was skipped by the plan.")
          PY
