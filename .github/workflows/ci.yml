name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    uses: ./.github/workflows/reusable-rust-ci.yml
    with:
      # Pin the toolchain so CI no longer floats to whatever `stable` is that
      # day — an unpinned toolchain turned every open PR red when Rust 1.97
      # widened a clippy lint. Now on 1.98 (the org default), with that lint
      # fixed; bump deliberately through this input, never by tracking stable.
      # Kept equal to the rust-supply-chain.yml default — a repo whose SBOM is
      # produced by a compiler its test suite never ran is podup#1487.
      toolchain: "1.98"
      # The floor CI builds on. It no longer comes from `debian/control`: the .deb
      # is built for musl with a rustup toolchain (`release.yml` pins 1.98.0), so
      # there is no packaging floor to promise. 1.94 is now derived from sqlx
      # 0.9's own `rust-version`, which makes it a measured floor on the build
      # graph rather than on the operating system, and tied to `rust-version` in
      # Cargo.toml by tests/msrv_agrees_with_ci.rs.
      #
      # 1.88 was the previous floor; it came from a build that failed (`rcgen`,
      # `time` and `icu_properties` each wanted more than `edition = "2024"`
      # implied), and was the one this input promised until sqlx 0.9 widened the
      # dep graph.
      msrv: "1.94"
      # The `Doc warnings` job is gated on this input and this repository never
      # passed it, so the job has been skipping since it existed. It had ten
      # findings waiting when I turned it on: three unresolved intra-doc links,
      # one redundant link target, and six public items documenting their
      # contract in terms of constants that lived in a private module, so a
      # reader could see the promise and not the value it named. All fixed in
      # the same change, because a gate that lands red is a gate somebody
      # silences.
      doc-warnings: true
      coverage-threshold: 90
      # Files the no-DB coverage job cannot fairly measure — each needs a live
      # service or is thin connection-accept glue, so they are excluded here
      # rather than padded with hollow tests:
      #   db/mod, antispam/{reputation,corpus,hook}, directory_store/sql — need
      #     PostgreSQL; the Database workflow exercises them (without measuring).
      #   directory_store/ldap — needs an LDAP server (tests/ldap.rs, gated on
      #     INTEROP_LDAP_URL).
      #   acme/renew — the certificate-renewal path needs a live ACME directory.
      #   pop3/server, managesieve/server — connection-accept glue, exercised
      #     end-to-end rather than by unit tests.
      # acme/transport and pop3/backend are well covered and deliberately NOT
      # excluded (they count toward the gate).
      coverage-ignore-regex: "(db/mod|antispam/(reputation|corpus|hook|bans_sql)|acme/renew|pop3/server|managesieve/server|directory_store/(sql|ldap))\\.rs"
  dependabot-freshness:
    uses: ./.github/workflows/reusable-dependabot-freshness.yml
    with:
      max-age-days: 15
