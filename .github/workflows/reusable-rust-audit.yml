name: Rust audit (reusable)

# Scheduled supply-chain audit for Rust crates: cargo-audit flags RUSTSEC
# advisories, cargo-deny enforces the license/ban/source policy in deny.toml.
# Callers wire the schedule (e.g. weekly cron) in their own workflow.
#
# Each invocation audits one ref. The caller is expected to put a matrix
# over `develop` and `main` in its own workflow file; the `report` and
# `close` jobs that read the artifacts are there, not here, because they
# need to see every matrix entry at once.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the Cargo workspace
        type: string
        default: "."
      # Ref to audit. Each matrix entry in the caller passes one ref, so
      # the reusable sees a single value per invocation. The default is
      # `develop` because that is the branch the org uses for in-progress
      # work; weekly callers audit main by passing it through their matrix.
      ref:
        description: Branch to audit, one of develop or main, or empty for the ref that triggered the run
        type: string
        default: "develop"
      # Pinned, not the runner's floating preinstalled Rust — see rust-ci.yml's
      # toolchain input for why an unpinned toolchain is a problem.
      toolchain:
        description: Rust toolchain to pin the audit and deny jobs to
        type: string
        default: "1.100.0"
      cargo-audit-version:
        description: Exact version of cargo-audit to download from its release
        type: string
        default: "0.23.0"
      cargo-audit-sha256:
        description: SHA-256 of the x86_64 musl archive of that release; moves with the version
        type: string
        default: "4f01c74ed84b2dffd0b1d37012a62cdf2a92c96e25bdf8eec7fcc0d4d3eb7811"
      extra-lockfiles:
        description: >
          Newline-separated lockfiles to audit in addition to the one in
          working-directory, given relative to it. A second workspace has its
          own Cargo.lock and its own dependency graph, and auditing only the
          root leaves it unexamined.
        type: string
        default: ""
      cargo-deny-version:
        description: Exact version of cargo-deny to download from its release
        type: string
        default: "0.22.1"
      cargo-deny-sha256:
        description: SHA-256 of the x86_64 musl archive of that release; moves with the version
        type: string
        default: "13f7e825e9cb811c2f8de63f29b0f45851dfb53004029f0f2501af524728364d"

permissions:
  contents: read

concurrency:
  # Per-ref concurrency so a ref's daily run cancels an older still-running
  # one. Different refs (develop vs main) must not cancel each other: a
  # slow `develop` run that finishes during the `main` run would close
  # open issues for advisories `main` still sees.
  # `github.ref` keeps pull requests apart: on a pull request `inputs.ref`
  # is empty, and without it every open PR shared one group and cancelled
  # the others' audit.
  group: rust-audit-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}-${{ inputs.working-directory }}
  cancel-in-progress: true

jobs:
  audit:
    # On a pull request the ref is empty and the name stays `cargo audit`,
    # the check name branch rules and the release PR already know.
    name: cargo audit${{ inputs.ref != '' && format(' ({0})', inputs.ref) || '' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      TOOL_VERSION: ${{ inputs.cargo-audit-version }}
      TOOL_SHA256: ${{ inputs.cargo-audit-sha256 }}
    steps:
      # The ref is checked against a fixed list and each branch is spelled
      # out literally. The scheduled run executes cargo on the tree it
      # checks out, in the default branch's context, so the ref must never
      # be an arbitrary string a dispatch could set. `persist-credentials:
      # false` keeps the token out of `.git/config`, where a later step
      # could read it.
      - name: Reject an unknown ref
        if: inputs.ref != '' && inputs.ref != 'develop' && inputs.ref != 'main'
        run: |
          echo "::error::ref must be empty, develop or main."
          exit 1

      # One checkout, always the code of the event. A scheduled run audits
      # another branch without bringing its tree: the history comes with the
      # checkout, and the step below takes only the lockfiles and the ignore
      # list of that branch with `git show`. Nothing of that branch is built or
      # run, and no local action or script comes from it. Depth 0 fetches every
      # branch. Keep the 0 after `||`: it counts as false, so as the value of
      # `&&` it would be skipped and the depth would always be 1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.ref == '' && 1 || 0 }}

      - name: Take the lockfiles of the audited branch
        id: audited
        if: inputs.ref != ''
        env:
          REF: ${{ inputs.ref }}
          WORKDIR: ${{ inputs.working-directory }}
          EXTRA_LOCKFILES: ${{ inputs.extra-lockfiles }}
        # Only data leaves the branch: the lockfiles and the ignore list, into a
        # directory made for this run outside the workspace. The audit below
        # points at them with `--file`; nothing else of the branch is read.
        run: |
          set -euo pipefail
          prefix=""
          [ "$WORKDIR" = . ] || prefix="${WORKDIR%/}/"
          dir="$(mktemp -d "$RUNNER_TEMP/audited.XXXXXX")"
          take() {
            mkdir -p "$dir/$(dirname "$1")"
            git show "origin/${REF}:${prefix}$1" > "$dir/$1"
          }
          take Cargo.lock
          while read -r lockfile; do
            [ -n "$lockfile" ] && take "$lockfile"
          done <<< "$EXTRA_LOCKFILES"
          # The audit runs with this directory as its working directory, and
          # cargo-audit reads `.cargo/audit.toml` from there. A branch without the
          # file gets an empty list, so no list of another branch or of the runner
          # can apply to it.
          if git cat-file -e "origin/${REF}:${prefix}.cargo/audit.toml" 2> /dev/null; then
            take .cargo/audit.toml
          else
            mkdir -p "$dir/.cargo"
            printf '[advisories]\nignore = []\n' > "$dir/.cargo/audit.toml"
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Install toolchain
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"

      # The tools that judge the code are downloaded on every run from the
      # project's own release, pinned by version in the URL and by SHA-256 here,
      # and checked before anything of the archive is read. They are not compiled
      # on the runner, not restored from a cache (a cache can be written by a run
      # nobody trusted), and not taken from a script of the tree the audit reads.
      - name: Install cargo-audit
        run: |
          set -euo pipefail
          [[ "$TOOL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the version is not a plain X.Y.Z"; exit 1; }
          [[ "$TOOL_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the digest is not a lowercase SHA-256"; exit 1; }
          work="$(mktemp -d "$RUNNER_TEMP/cargo-audit.XXXXXX")"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors \
            --proto '=https' --tlsv1.2 --output "$work/archive.tgz" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${TOOL_VERSION}/cargo-audit-x86_64-unknown-linux-musl-v${TOOL_VERSION}.tgz"
          echo "${TOOL_SHA256}  $work/archive.tgz" | sha256sum --check --strict --status - \
            || { echo "::error::the cargo-audit archive does not match the pinned SHA-256"; exit 1; }
          tar -xzf "$work/archive.tgz" -C "$work"
          install -d "$RUNNER_TEMP/tools/cargo-audit"
          install -m 0755 "$work/cargo-audit-x86_64-unknown-linux-musl-v${TOOL_VERSION}/cargo-audit" "$RUNNER_TEMP/tools/cargo-audit/cargo-audit"
          echo "$RUNNER_TEMP/tools/cargo-audit" >> "$GITHUB_PATH"

      - name: Run cargo audit
        env:
          AUDITED_DIR: ${{ steps.audited.outputs.dir }}
        # --deny warnings so unmaintained/unsound/yanked advisories also fail,
        # not just vulnerabilities. The JSON output is captured unconditionally
        # so the report job can read the full report whether the step passed
        # or failed; the exit code is preserved on a non-zero result so the
        # step still fails the workflow.
        # For another branch the working directory is the clean one holding only
        # its lockfile and its ignore list, so the one list of ignores cargo-audit
        # can see is that branch's; the report is written back to the workspace
        # by absolute path.
        run: |
          out="$PWD"
          args=()
          if [ -n "$AUDITED_DIR" ]; then
            cd "$AUDITED_DIR"
            args+=(--file "$AUDITED_DIR/Cargo.lock")
          fi
          if ! cargo audit --json --deny warnings "${args[@]}" > "$out/audit.json" 2> "$out/audit.stderr"; then
            cat "$out/audit.stderr" >&2
            exit 1
          fi

      - name: Run cargo audit on the extra lockfiles
        if: inputs.extra-lockfiles != ''
        env:
          EXTRA_LOCKFILES: ${{ inputs.extra-lockfiles }}
          AUDITED_DIR: ${{ steps.audited.outputs.dir }}
        # Deliberately run from working-directory with --file rather than
        # cd-ing into the other workspace. `cargo audit` resolves
        # `.cargo/audit.toml` relative to the process directory, so auditing
        # from inside the second workspace silently drops the ignore policy and
        # reports advisories this repository has already assessed. That is how
        # fuzz/Cargo.lock looked like it carried four findings when the same
        # graph audits clean from here.
        # This step runs before the upload below so its JSON travels in the
        # same artifact: an upload placed before it shipped an artifact with
        # the root audit only, and the extra workspace was invisible to the
        # open-issue decision.
        run: |
          set -euo pipefail
          out="$PWD"
          run_dir="${AUDITED_DIR:-$PWD}"
          echo "$EXTRA_LOCKFILES" | while read -r lockfile; do
            [ -n "$lockfile" ] || continue
            source="${AUDITED_DIR:+$AUDITED_DIR/}$lockfile"
            if [ ! -f "$source" ]; then
              echo "::error::$lockfile does not exist; the input is stale."
              exit 1
            fi
            # The name carries the whole path with the separators folded, so
            # two workspaces cannot land on the same report: `fuzz/Cargo.lock`
            # becomes `audit-fuzz-Cargo.json`. Naming it after the file alone
            # gives every workspace the name `audit-Cargo.json`.
            name="$(printf '%s' "${lockfile%.lock}" | tr '/' '-')"
            if ! (cd "$run_dir" && cargo audit --json --deny warnings --file "$source" \
                > "$out/audit-${name}.json" 2> "$out/audit-${name}.stderr"); then
              cat "$out/audit-${name}.stderr" >&2
              exit 1
            fi
          done

      - name: Upload cargo audit JSON
        # `if: always()` because the step must run when the audit failed
        # too: the report job needs the JSON either way to decide
        # whether to open an issue. The `hashFiles` check skips the step
        # only when no audit wrote JSON at all; a report written by a
        # failing step is still uploaded so the caller can read it.
        # The pattern covers the root audit and every extra lockfile, whose
        # names carry their own path.
        if: always() && hashFiles('audit*.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-json-${{ inputs.ref }}
          path: |
            audit.json
            audit-*.json
          if-no-files-found: error
          retention-days: 7

  deny:
    name: cargo deny${{ inputs.ref != '' && format(' ({0})', inputs.ref) || '' }}
    # cargo-deny reads the manifests of the tree it runs in, so it runs where the
    # tree is the event's own (a pull request, a push) and not on a branch a
    # scheduled run only audits by its lockfiles.
    if: inputs.ref == ''
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      TOOL_VERSION: ${{ inputs.cargo-deny-version }}
      TOOL_SHA256: ${{ inputs.cargo-deny-sha256 }}
    steps:
      # Same fixed list as the audit job.
      - name: Reject an unknown ref
        if: inputs.ref != '' && inputs.ref != 'develop' && inputs.ref != 'main'
        run: |
          echo "::error::ref must be empty, develop or main."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"


      # Downloaded and checked on every run, like cargo-audit above.
      - name: Install cargo-deny
        run: |
          set -euo pipefail
          [[ "$TOOL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the version is not a plain X.Y.Z"; exit 1; }
          [[ "$TOOL_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the digest is not a lowercase SHA-256"; exit 1; }
          work="$(mktemp -d "$RUNNER_TEMP/cargo-deny.XXXXXX")"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors \
            --proto '=https' --tlsv1.2 --output "$work/archive.tgz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${TOOL_VERSION}/cargo-deny-${TOOL_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${TOOL_SHA256}  $work/archive.tgz" | sha256sum --check --strict --status - \
            || { echo "::error::the cargo-deny archive does not match the pinned SHA-256"; exit 1; }
          tar -xzf "$work/archive.tgz" -C "$work"
          install -d "$RUNNER_TEMP/tools/cargo-deny"
          install -m 0755 "$work/cargo-deny-${TOOL_VERSION}-x86_64-unknown-linux-musl/cargo-deny" "$RUNNER_TEMP/tools/cargo-deny/cargo-deny"
          echo "$RUNNER_TEMP/tools/cargo-deny" >> "$GITHUB_PATH"

      - name: Run cargo deny
        run: cargo deny check
