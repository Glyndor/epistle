name: Rust CI (reusable)
on:
  workflow_call:
    inputs:
      run-lint:
        description: Run formatting and lint checks selected by the caller's plan
        type: boolean
        default: true
      run-tests:
        description: Run workspace tests and coverage selected by the caller's plan
        type: boolean
        default: true
      run-msrv:
        description: Check MSRV when selected by the caller's plan
        type: boolean
        default: true
      working-directory:
        description: Directory containing the Cargo workspace
        type: string
        default: "."
      # Pinned, not `stable`: an unpinned toolchain moves on its own the day
      # upstream ships a release, and every consumer's pull requests go red at
      # once for a change nobody made. That is not hypothetical — Rust 1.97.0
      # landed on 2026-07-07, widened a clippy lint, and reddened every open PR
      # in podup until the lint was fixed. Bump this pin via a new `.github`
      # release so each repo adopts the new toolchain deliberately, sees which
      # lints it gained, and fixes them on its own schedule.
      toolchain:
        description: Rust toolchain to pin the build, lint and test jobs to
        type: string
        default: "1.100.0"
      coverage-threshold:
        description: Minimum line coverage percentage (0 disables the gate)
        type: number
        default: 0
      coverage-ignore-regex:
        description: Regex of file paths to exclude from coverage (e.g. code covered only by a separate DB integration job)
        type: string
        default: ""
      llvm-cov-version:
        description: Exact version of the tool; bumped via .github releases
        type: string
        default: "0.9.2"
      extra-test-os:
        description: JSON array of extra runner images to also run tests on (e.g. '["macos-latest"]')
        type: string
        default: "[]"
      apt-packages:
        description: Space-separated apt packages the test job installs before running the suite
        type: string
        default: ""
      podman:
        description: Start rootless Podman socket before running the coverage job (ubuntu-latest only)
        type: boolean
        default: false
      msrv:
        description: Minimum supported Rust version to verify a --locked build against (empty disables the check)
        type: string
        default: ""
      package-check:
        description: Run cargo publish --dry-run on PRs to catch packaging breakage before tagging
        type: boolean
        default: false
      semver-check:
        description: Run cargo-semver-checks to flag public API breaks against the last published release
        type: boolean
        default: false
      semver-checks-version:
        description: Exact version of the tool; bumped via .github releases
        type: string
        default: "0.51.0"
      doc-warnings:
        description: Build the docs with -D warnings so broken doc links fail the build
        type: boolean
        default: false

# Tests that build the whole command line (`Cli::try_parse_from`) run on a test
# thread, whose stack is 2 MiB unless this says otherwise. clap 4.6.7 needed about
# 1.75 MiB of it for that in an unoptimised build, which left no room, and 4.6.8
# needs between 2 and 3 MiB: `account::switches::tests::parse` overflowed and
# aborted the whole run. The value is the 8 MiB a main thread has. A file under
# `.cargo/` cannot carry it: debian/rules reads the presence of
# `.cargo/config.toml` as "the vendored configuration is already written".
env:
  RUST_MIN_STACK: "8388608"

permissions:
  contents: read
concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.working-directory }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    name: Format & lint
    if: inputs.run-lint
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    # Measured 2026-10-30: the slowest of four green runs took 3 min.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$TOOLCHAIN"

      - id: cargo-cache
        uses: ./.github/actions/rust-cache
        with:
          prefix: rust-lint
          working-directory: ${{ inputs.working-directory }}

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # fuzz/ is its own workspace with its own Cargo.lock, and nothing else
      # resolves it on a pull request: fuzz.yml is path-filtered and nightly.
      # A dependency bump at the root left that lockfile stale twice, and both
      # times only the nightly run on main noticed. `cargo metadata --locked`
      # fails when the lockfile would have to change, without compiling.
      - name: fuzz lockfile in sync
        if: hashFiles('fuzz/Cargo.toml') != ''
        run: cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null

      - name: Save the cargo cache
        if: ${{ success() }}
        uses: ./.github/actions/rust-cache
        with:
          mode: save
          cache-hit: ${{ steps.cargo-cache.outputs.cache-hit }}
          prefix: rust-lint
          working-directory: ${{ inputs.working-directory }}

  # What the CodeQL analysis leaves out is judged by the compiler, in a job of its own
  # so the five builds below do not delay the lint that the later jobs wait for. The
  # production targets (library and binaries, no tests) are checked in debug and in
  # `--release`, each with the default features and with all of them; the tests are
  # checked with `--tests --all-features`. The dep-info `rustc` leaves next to each unit
  # lists every file it opened, those of `mod`, `#[path]`, `include!` and the build
  # script included. `check_paths.py` fails if a file the configuration leaves out is
  # read by a production build, or by no test build (which would leave it unproven to be
  # test code: another operating system, a feature that is off), or if a pattern is dead.
  codeql-paths:
    name: CodeQL leaves out only test code
    if: inputs.run-lint
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    # Not measured yet: the first run of this job says what the five checks cost.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"

      - id: cargo-cache
        uses: ./.github/actions/rust-cache
        with:
          prefix: rust-codeql-paths
          working-directory: ${{ inputs.working-directory }}

      - name: Check the production targets and the tests
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/codeql-paths"
          mkdir -p "$out"
          cargo check --locked --lib --bins --message-format=json > "$out/production-debug.json"
          cargo check --locked --lib --bins --all-features --message-format=json > "$out/production-debug-all.json"
          cargo check --locked --lib --bins --release --message-format=json > "$out/production-release.json"
          cargo check --locked --lib --bins --release --all-features --message-format=json > "$out/production-release-all.json"
          cargo check --locked --tests --all-features --message-format=json > "$out/tests.json"

      # The same dep-info judges the other list of paths: the workflows that run on any change to the
      # product (end-to-end, upgrade, container, database) have to be triggered by every source file a
      # production build reads, or a change to it would skip them.
      - name: The CodeQL configuration leaves out only files that only the tests read
        run: >-
          python3 -I .github/scripts/ci_codeql/check_paths.py .github/codeql/codeql-config.yml
          --production "$RUNNER_TEMP"/codeql-paths/production-*.json
          --tests "$RUNNER_TEMP/codeql-paths/tests.json"
          --watch-all .github/workflows/e2e.yml .github/workflows/upgrade.yml .github/workflows/container.yml .github/workflows/db.yml

      - name: Save the cargo cache
        if: ${{ success() }}
        uses: ./.github/actions/rust-cache
        with:
          mode: save
          cache-hit: ${{ steps.cargo-cache.outputs.cache-hit }}
          prefix: rust-codeql-paths
          working-directory: ${{ inputs.working-directory }}

  test:
    name: Test
    needs: [test-suite, coverage]
    # A skipped dependency must not hide a failed/cancelled suite. Coverage
    # already runs every workspace test; reflect it under the required name.
    if: ${{ always() && inputs.run-tests }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Reflect the workspace suite result
        env:
          RESULT: ${{ inputs.coverage-threshold > 0 && needs.coverage.result || needs.test-suite.result }}
        run: |
          case "$RESULT" in
            success) echo "Workspace tests passed" ;;
            *) echo "::error::workspace tests did not pass (result: $RESULT)"; exit 1 ;;
          esac

  test-suite:
    name: Workspace tests
    # The long suites wait for the cheap one: on a pull request a failed lint ends
    # the run here instead of after the suite. The condition names the one real
    # gate and is not applied to a push or a queue entry. A job skipped behind a
    # failed lint fails the sentinel below, which sees it as selected and not run.
    needs: lint
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.lint.result != 'failure') && inputs.run-tests && inputs.coverage-threshold == 0 }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    # Measured 2026-10-30: the slowest of four green runs took 34 min.
    timeout-minutes: 70
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"

      # Some tests need a program the runner image does not carry. `fakeroot`
      # is one: the packaging tests in tests/debian/ run the maintainer scripts
      # under it, because those scripts read root ownership off every path they
      # touch and an unprivileged run cannot exercise that without it. Ubuntu's
      # runner has it today, which is exactly why its absence would go unnoticed
      # until a different image, a minimal container, or a developer box broke
      # the suite. Naming it here makes the dependency explicit.
      - name: Install test tooling
        # Measured 2026-11-01: this step hung for 70 minutes on a runner in the
        # merge queue until the job timeout cancelled the whole entry. It takes
        # seconds when it works, so it gets its own short limit and apt retries
        # a mirror that does not answer.
        timeout-minutes: 10
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          set -euo pipefail
          if [ -n "$APT_PACKAGES" ]; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq
            # shellcheck disable=SC2086 # intentional word-splitting of the list
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends $APT_PACKAGES
          fi

      - id: cargo-cache
        uses: ./.github/actions/rust-cache
        with:
          prefix: rust-test
          working-directory: ${{ inputs.working-directory }}

      - name: Tests
        run: cargo test --locked --all-features --workspace

      - name: Save the cargo cache
        if: ${{ success() }}
        uses: ./.github/actions/rust-cache
        with:
          mode: save
          cache-hit: ${{ steps.cargo-cache.outputs.cache-hit }}
          prefix: rust-test
          working-directory: ${{ inputs.working-directory }}

  test-extra:
    name: Test (${{ matrix.os }})
    needs: lint
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.lint.result != 'failure') && inputs.run-tests && inputs.extra-test-os != '[]' }}
    runs-on: ${{ matrix.os }}
    # Measured 2026-10-30: the slowest of four green runs took 34 min.
    timeout-minutes: 70
    strategy:
      fail-fast: true
      matrix:
        os: ${{ fromJSON(inputs.extra-test-os) }}
    defaults:
      run:
        # This is the only job that can land on a Windows runner, where the
        # default shell is PowerShell — and there `$VAR` reads a PowerShell
        # variable, not the environment, so every `env:` value silently becomes
        # an empty string. Pin the shell so steps behave the same on all three
        # OSes, as release.yml's cross-OS matrix already does.
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"

      - id: cargo-cache
        uses: ./.github/actions/rust-cache
        with:
          prefix: rust-test
          working-directory: ${{ inputs.working-directory }}

      - name: Tests
        run: cargo test --locked --all-features --workspace

      - name: Save the cargo cache
        if: ${{ success() }}
        uses: ./.github/actions/rust-cache
        with:
          mode: save
          cache-hit: ${{ steps.cargo-cache.outputs.cache-hit }}
          prefix: rust-test
          working-directory: ${{ inputs.working-directory }}

  extra-platforms-gate:
    name: Extra platforms
    # A required status check is matched by name, so a name carrying a value makes
    # the pull request that changes the value block itself: the job emits a new
    # name, the ruleset still requires the old one, and nothing emits it. This job
    # carries a name that cannot move, so a ruleset gates on "the extra-platform
    # tests passed" without naming which platforms those are. Glyndor/podup#1552.
    needs: [lint, test-extra]
    # `needs` on its own SKIPS this job when the dependency fails, and a skipped
    # required check does not block a merge - which is the exact failure this job
    # exists to prevent. `if: always()` plus an explicit result check is what makes
    # it a gate rather than a decoration.
    if: ${{ always() && inputs.run-tests }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    # Measured 2026-10-30: the slowest of four green runs took 1 min.
    timeout-minutes: 5
    steps:
      - name: Reflect the extra-platform test result
        env:
          RESULT: ${{ needs.test-extra.result }}
          LINT: ${{ needs.lint.result }}
        run: |
          set -euo pipefail
          # `skipped` is a pass only when test-extra was not asked for: it is gated on
          # `extra-test-os != '[]'`, so a caller that asks for no extra platforms has
          # nothing to fail. A skip because lint failed is not that.
          [ "$LINT" != failure ] || { echo "::error::lint failed, so the extra-platform tests did not run"; exit 1; }
          case "$RESULT" in
            success | skipped) echo "extra-platform tests: $RESULT" ;;
            *) echo "::error::extra-platform tests did not pass (result: $RESULT)"; exit 1 ;;
          esac

  coverage:
    name: Coverage
    needs: lint
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.lint.result != 'failure') && inputs.run-tests && inputs.coverage-threshold > 0 }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    # Measured 2026-10-30: the slowest of four green runs took 36 min.
    timeout-minutes: 75
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component llvm-tools
          rustup default "$TOOLCHAIN"

      # The same dependency the test job names, because this job runs the
      # same workspace tests under `cargo llvm-cov`: without `fakeroot` the
      # packaging tests in tests/debian/ panic at launch, and the coverage
      # gate would go red for a reason that has nothing to do with coverage.
      - name: Install test tooling
        # Measured 2026-11-01: this step hung for 70 minutes on a runner in the
        # merge queue until the job timeout cancelled the whole entry. It takes
        # seconds when it works, so it gets its own short limit and apt retries
        # a mirror that does not answer.
        timeout-minutes: 10
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          set -euo pipefail
          if [ -n "$APT_PACKAGES" ]; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq
            # shellcheck disable=SC2086 # intentional word-splitting of the list
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends $APT_PACKAGES
          fi

      # The tool version is part of the key: a cache built under an older
      # pin must not survive a version bump via the `command -v ... ||`
      # short-circuit below, or the pin would be silently ignored.
      - id: cargo-cache
        uses: ./.github/actions/rust-cache
        with:
          prefix: rust-cov-${{ inputs.llvm-cov-version }}
          working-directory: ${{ inputs.working-directory }}
          extra-path: ~/.cargo/bin

      - name: Install cargo-llvm-cov
        env:
          LLVM_COV_VERSION: ${{ inputs.llvm-cov-version }}
        run: command -v cargo-llvm-cov >/dev/null || cargo install cargo-llvm-cov --locked --version "$LLVM_COV_VERSION"

      - name: Start Podman socket
        if: inputs.podman
        id: podman-socket
        run: |
          systemctl --user start podman.socket
          until [ -S "/run/user/$(id -u)/podman/podman.sock" ]; do sleep 0.1; done
          echo "path=unix:///run/user/$(id -u)/podman/podman.sock" >> "$GITHUB_OUTPUT"

      - name: Coverage gate
        env:
          PODMAN_SOCKET: ${{ steps.podman-socket.outputs.path }}
          COVERAGE_IGNORE_REGEX: ${{ inputs.coverage-ignore-regex }}
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          cargo llvm-cov --locked --workspace --all-features --summary-only --json --output-path coverage.json \
            ${COVERAGE_IGNORE_REGEX:+--ignore-filename-regex "$COVERAGE_IGNORE_REGEX"}
          PCT=$(python3 -c "import json; print(json.load(open('coverage.json'))['data'][0]['totals']['lines']['percent'])")
          echo "Coverage: ${PCT}% (threshold: ${COVERAGE_THRESHOLD}%)"
          echo "### Coverage: ${PCT}% (threshold: ${COVERAGE_THRESHOLD}%)" >> "$GITHUB_STEP_SUMMARY"
          python3 - "$PCT" "$COVERAGE_THRESHOLD" <<'EOF'
          import sys
          pct, threshold = float(sys.argv[1]), float(sys.argv[2])
          if pct < threshold:
              print(f"::error::Coverage {pct}% is below the {threshold}% threshold")
              sys.exit(1)
          sys.exit(0)
          EOF

      - name: Save the cargo cache
        if: ${{ success() }}
        uses: ./.github/actions/rust-cache
        with:
          mode: save
          cache-hit: ${{ steps.cargo-cache.outputs.cache-hit }}
          prefix: rust-cov-${{ inputs.llvm-cov-version }}
          working-directory: ${{ inputs.working-directory }}
          extra-path: ~/.cargo/bin

  msrv:
    name: MSRV (${{ inputs.msrv }})
    if: inputs.run-msrv && inputs.msrv != ''
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    # Measured 2026-10-30: the slowest of four green runs took 3 min.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install MSRV toolchain
        env:
          MSRV: ${{ inputs.msrv }}
        run: |
          rustup toolchain install "$MSRV" --profile minimal
          rustup default "$MSRV"

      - id: cargo-cache
        uses: ./.github/actions/rust-cache
        with:
          prefix: rust-msrv-${{ inputs.msrv }}
          working-directory: ${{ inputs.working-directory }}

      - name: Build on the declared MSRV
        run: cargo build --locked --all-features

      - name: Save the cargo cache
        if: ${{ success() }}
        uses: ./.github/actions/rust-cache
        with:
          mode: save
          cache-hit: ${{ steps.cargo-cache.outputs.cache-hit }}
          prefix: rust-msrv-${{ inputs.msrv }}
          working-directory: ${{ inputs.working-directory }}

  msrv-gate:
    name: MSRV
    # Same reason as extra-platforms-gate: `MSRV (1.85)` moves the day the MSRV
    # moves, and takes the gate with it. MSRV is the worse of the two because it is
    # not a matrix - a single job interpolating an input into its own name. The
    # number stays visible in the job log and in the `MSRV (x.y)` job itself.
    needs: msrv
    if: ${{ always() && inputs.run-msrv }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    # Measured 2026-10-30: the slowest of four green runs took 1 min.
    timeout-minutes: 5
    steps:
      - name: Reflect the MSRV result
        env:
          RESULT: ${{ needs.msrv.result }}
        run: |
          set -euo pipefail
          # `skipped` is a pass: msrv is gated on `inputs.msrv != ''`.
          case "$RESULT" in
            success | skipped) echo "MSRV: $RESULT" ;;
            *) echo "::error::MSRV job did not pass (result: $RESULT)"; exit 1 ;;
          esac

  package:
    name: Package check
    if: inputs.package-check
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    # Not measured (the job is skipped in this repository); a bound well above its work.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"

      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked

  semver:
    name: Semver checks
    if: inputs.semver-check
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    # Not measured (the job is skipped in this repository); a bound well above its work.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"

      - name: Install cargo-semver-checks
        env:
          SEMVER_CHECKS_VERSION: ${{ inputs.semver-checks-version }}
        run: command -v cargo-semver-checks >/dev/null || cargo install cargo-semver-checks --locked --version "$SEMVER_CHECKS_VERSION"

      - name: Check for public API breaks
        run: cargo semver-checks check-release

  doc:
    name: Doc warnings
    if: inputs.doc-warnings
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    # Measured 2026-10-30: the slowest of four green runs took 1 min.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"

      - name: Build docs with warnings denied
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features

  # The caller of this workflow ends in success when every job in here is skipped,
  # and a job skipped by a condition that drifted looks the same as one the plan
  # skipped. This one always runs and fails unless each job the inputs select
  # finished in success, and unless nothing failed or was cancelled whether it was
  # selected or not. The `Test` job above reflects the workspace suite; this one
  # checks the same for every other selected job, and for that one too.
  sentinel:
    name: Selected suites ran
    needs: [lint, codeql-paths, test, test-suite, coverage, test-extra, msrv, doc, package, semver]
    if: always()
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Every selected job ended in success
        env:
          WANT_LINT: ${{ inputs.run-lint }}
          WANT_PATHS: ${{ inputs.run-lint }}
          WANT_TEST: ${{ inputs.run-tests }}
          WANT_COVERAGE: ${{ inputs.run-tests && inputs.coverage-threshold > 0 }}
          WANT_SUITE: ${{ inputs.run-tests && inputs.coverage-threshold == 0 }}
          WANT_MSRV: ${{ inputs.run-msrv && inputs.msrv != '' }}
          WANT_DOC: ${{ inputs.doc-warnings }}
          WANT_PACKAGE: ${{ inputs.package-check }}
          WANT_SEMVER: ${{ inputs.semver-check }}
          GOT_LINT: ${{ needs.lint.result }}
          GOT_PATHS: ${{ needs.codeql-paths.result }}
          GOT_TEST: ${{ needs.test.result }}
          GOT_COVERAGE: ${{ needs.coverage.result }}
          GOT_SUITE: ${{ needs.test-suite.result }}
          GOT_MSRV: ${{ needs.msrv.result }}
          GOT_DOC: ${{ needs.doc.result }}
          GOT_PACKAGE: ${{ needs.package.result }}
          GOT_SEMVER: ${{ needs.semver.result }}
          GOT_EXTRA: ${{ needs.test-extra.result }}
        run: |
          set -u
          failed=0
          for name in LINT PATHS TEST COVERAGE SUITE MSRV DOC PACKAGE SEMVER; do
            want="WANT_$name"
            got="GOT_$name"
            case "${!want}" in
              true) [ "${!got}" = success ] || { echo "::error::$name was selected and ended in ${!got}"; failed=1; } ;;
              false) case "${!got}" in failure | cancelled) echo "::error::$name ended in ${!got}"; failed=1 ;; esac ;;
              *) echo "::error::$name: the selection is neither true nor false (${!want})"; failed=1 ;;
            esac
          done
          case "$GOT_EXTRA" in failure | cancelled) echo "::error::the extra-platform tests ended in $GOT_EXTRA"; failed=1 ;; esac
          exit "$failed"
