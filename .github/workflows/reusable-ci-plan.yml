name: CI plan

# Required callers keep their triggers and check names. Only their jobs skip.
# Use the base classifier; an absent script or unreadable diff runs everything.
on:
  workflow_call:
    outputs:
      lint:
        value: ${{ jobs.plan.outputs.lint }}
      tests:
        value: ${{ jobs.plan.outputs.tests }}
      doc:
        value: ${{ jobs.plan.outputs.doc }}
      msrv:
        value: ${{ jobs.plan.outputs.msrv }}
      debian:
        value: ${{ jobs.plan.outputs.debian }}
      supply:
        value: ${{ jobs.plan.outputs.supply }}
      freshness:
        value: ${{ jobs.plan.outputs.freshness }}
      lines:
        value: ${{ jobs.plan.outputs.lines }}
      folder:
        value: ${{ jobs.plan.outputs.folder }}
      wiring:
        value: ${{ jobs.plan.outputs.wiring }}

permissions:
  contents: read

concurrency:
  group: ci-plan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    outputs:
      lint: ${{ steps.diff.outputs.lint }}
      tests: ${{ steps.diff.outputs.tests }}
      doc: ${{ steps.diff.outputs.doc }}
      msrv: ${{ steps.diff.outputs.msrv }}
      debian: ${{ steps.diff.outputs.debian }}
      supply: ${{ steps.diff.outputs.supply }}
      freshness: ${{ steps.diff.outputs.freshness }}
      folder: ${{ steps.diff.outputs.folder }}
      lines: ${{ steps.diff.outputs.lines }}
      wiring: ${{ steps.diff.outputs.wiring }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          # A queue entry is the change of one pull request on top of the branch
          # as it is now, so it is classified by that change and not run whole.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/ci_plan.py"
          if { [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = merge_group ]; } \
            && git show "$BASE_SHA:.github/scripts/ci_plan/ci_plan.py" > "$script" \
            && python3 -I "$script"; then
            # The classifier is the base commit's, so one written before a job
            # existed does not name it. A job nobody classified runs.
            for job in lint tests doc msrv debian supply freshness folder lines wiring; do
              grep -q "^$job=" "$GITHUB_OUTPUT" || echo "$job=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          echo "No trusted PR plan; running all work on $EVENT_NAME"
          for job in lint tests doc msrv debian supply freshness folder lines wiring; do
            value=true
            # The nightly run exists to seed the cargo caches, which only the
            # Rust jobs use; the rest would be a second copy of the push to main.
            if [ "$EVENT_NAME" = schedule ]; then
              case "$job" in debian | supply | folder | lines) value=false ;; esac
            fi
            echo "$job=$value" >> "$GITHUB_OUTPUT"
          done
