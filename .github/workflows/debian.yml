name: Debian package

# Two different questions, answered by two different builds.
#
# This one asks "is epistle still a legitimate Debian package?" - it builds with
# Debian's own rustc through the shared reusable, and `dpkg-checkbuilddeps`
# proves Build-Depends is satisfiable rather than aspirational.
#
# release.yml asks a different question and answers it with a pinned upstream
# toolchain (1.98.0, the version ci.yml validates), so the .deb a user installs
# is built by the compiler that vouched for the code. Neither build subsumes the
# other.
#
# No path filter. One would fire on nearly every pull request anyway, since this
# repository keeps its code in src/, and a filter that silently stops matching is
# how a gate stops being a gate.

# Push is scoped to develop only, not main. The repo's flow keeps main
# reachable only via pull request (topic -> develop -> main, the path
# main-guard enforces), so a direct push to main never arrives here.
# Push to develop is the integration checkpoint where the Debian
# build needs to keep passing.

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  debian:
    uses: ./.github/workflows/reusable-rust-debian.yml
    with:
      package-name: epistle
      # Not the reusable's trixie default: trixie ships rustc 1.85 and the
      # dependency floor is 1.94 (set by sqlx 0.9's `rust-version`), which
      # edition 2024 alone does not reveal. sid carries 1.95. Digest-pinned so
      # the check runs against a fixed environment instead of a moving tag.
      debian-image: "debian:sid@sha256:24c766c06ebdbda66a026e92361ede7d9212819701b2fca82e347ef0c240cb2c"
      # Debian's toolchain ships no musl standard library, so debian/rules
      # builds for a target it has to bring itself. Keep this in step with
      # ci.yml's toolchain: the whole point is that the packaged binary comes
      # from the compiler CI validates with.
      rust-toolchain: "1.98"
      rust-target: x86_64-unknown-linux-musl
      # aws-lc-sys is the only -sys crate in the tree and it compiles C, so
      # cross-compiling to musl needs a C cross-compiler. ring and rcgen
      # compile C without being -sys crates; the same package covers all three.
      # Measured by .github/workflows/probe-musl.yml (epistle#757, closed):
      # without it the build fails at aws-lc-sys and the floor survives.
      apt-packages: "musl-tools"
