name: guard

on:
  pull_request:
    branches: ["main"]

permissions: {}

# This used to be an inline job named `develop-only`, which emitted the
# required-check context `develop-only`. Calling the shared reusable from a
# job with id `develop-only` emits `develop-only / develop-only` instead —
# the context name has to be updated in the `main` ruleset at the same
# time this PR merges, or `main` is blocked.
jobs:
  develop-only:
    uses: Glyndor/.github/.github/workflows/main-guard.yml@d4bbc5b6ec0c351ca4cb17d948ceaad818da4078 # v1.18.1
