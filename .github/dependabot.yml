version: 2

updates:
  # One pull request a week for every action bump that is not a major. Each
  # pull request costs a full CI run and a second one in the merge queue, so a
  # daily entry with no group opened a separate pull request per action. A
  # major bump stays alone because it is the one that can break a workflow.
  # Security updates ignore the schedule and the groups below.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["type:ci", "area:ci", "prio:P3", "effort:XS"]
    open-pull-requests-limit: 5
    target-branch: "develop"
    commit-message:
      prefix: "ci(deps)"
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The images the generated stack runs (deploy/images/Dockerfile, which the
  # binary reads at build time), the container image's base (Containerfile) and
  # the OpenLDAP image the directory tests run against, whose digest nothing
  # watched.
  # The mail base digest (gcr.io/distroless/static-debian13) must be the same
  # in the Containerfile and in deploy/images/Dockerfile, and a test compares
  # them. A group only gathers the updates of one directory unless it sets
  # `group-by: dependency-name`, which is the documented way to group the
  # same dependency across the `directories` of an entry, and it applies to
  # version updates only. The `images` group below also filters on minor and
  # patch, and a bump of a digest with the same tag has no semver level, so
  # #1563 and #1565 came out as two separate pull requests that each failed the
  # test. `distroless-base` has no `update-types` and groups by name, so the
  # digest moves in both files in one pull request. A group is matched first
  # to last, so it must stay above `images`. A PostgreSQL major is ignored: it
  # needs `epistle db upgrade`, not a new digest.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/deploy/images"
      - "/tests/fixtures/ldap"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["type:deps", "area:deploy", "prio:P3", "effort:XS"]
    open-pull-requests-limit: 5
    target-branch: "develop"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      distroless-base:
        patterns: ["*distroless*"]
        group-by: dependency-name
      images:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*postgres*"
        update-types: ["version-update:semver-major"]

  # The crate itself and the fuzz targets, which are their own crate outside the
  # root manifest and carry their own lockfile that also resolves the parent's
  # dependencies. One entry over both directories, so a crate that both
  # manifests name moves in the same pull request and neither lockfile is left
  # behind (a bump under /fuzz alone left the root lockfile stale and every job
  # died on --locked). Daily and ungrouped this opened a pull request per crate
  # per directory, and each one ran the whole suite twice. Minor and patch
  # bumps come together once a week; a major bump stays alone because it needs
  # a reading of its changelog. Without this entry nothing watches the
  # dependencies a mail server is built out of (TLS, DNS, hashing, the HTTP
  # stack), which is where an advisory hurts most. Security updates ignore the
  # schedule and the groups.
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/fuzz"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["type:deps", "prio:P3", "effort:XS"]
    open-pull-requests-limit: 5
    target-branch: "develop"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 3
    groups:
      rust-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The release-signing script (`.github/scripts/sign.py`) pulls `cryptography`
  # from `sign-requirements.txt`, and nothing was watching that file. Every
  # release artifact is signed with it, so a stale version there is not a
  # cosmetic lag.
  #
  # This entry covers version updates only. Security updates do not use a
  # configuration entry that sets `target-branch`, so they open against `main`,
  # where `main-guard` refuses any pull request whose source is not `develop`.
  # That is #676 and it is not fixed here.
  #
  # It is reported instead. `dependabot-security-watch.yml` lists the open
  # pull requests into `main` and fails when Dependabot authored one whose
  # head is not `develop`; re-land such a bump by hand off `develop` and close
  # the stuck one. Keep this entry's `target-branch` as it is: the watcher
  # exists so that the guard can stay strict.
  - package-ecosystem: "pip"
    directory: "/.github/scripts"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["type:deps", "area:ci", "prio:P3", "effort:XS"]
    open-pull-requests-limit: 5
    target-branch: "develop"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 3
    groups:
      signing-tooling:
        patterns: ["*"]
