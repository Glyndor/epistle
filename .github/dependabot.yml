version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels: ["type:deps", "type:ci"]
    open-pull-requests-limit: 10
    target-branch: "develop"

  # The crate itself. Without this entry nothing watches the dependencies a
  # mail server is actually built out of — TLS, DNS, hashing, the HTTP stack —
  # which is exactly where an advisory hurts most.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    labels: ["type:deps"]
    open-pull-requests-limit: 10
    target-branch: "develop"

  # The fuzz targets are their own crate, outside the root manifest, so the
  # entry above does not reach them.
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "daily"
    labels: ["type:deps"]
    open-pull-requests-limit: 5
    target-branch: "develop"

  # The release-signing script (`.github/scripts/sign.py`) pulls `cryptography`
  # from `sign-requirements.txt`, and nothing was watching that file. Every
  # release artifact is signed with it, so a stale version there is not a
  # cosmetic lag.
  #
  # This entry covers version updates only. Security updates do not use a
  # configuration entry that sets `target-branch`, so they open against `main`,
  # where `main-guard` refuses any pull request whose source is not `develop`.
  # That is #676 and it is not fixed here.
  - package-ecosystem: "pip"
    directory: "/.github/scripts"
    schedule:
      interval: "daily"
    labels: ["type:deps", "type:security"]
    open-pull-requests-limit: 5
    target-branch: "develop"
