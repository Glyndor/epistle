[package]
name = "epistle"
version = "0.6.0"
edition = "2024"
# The floor CI builds on, and the one `epistle` claims to support. It came from
# a build that failed rather than from this file: `rcgen`, `time` and
# `icu_properties` each wanted more than `edition = "2024"` implies, which is
# why standards/testing forbids deriving a packaging floor from the manifest.
#
# It lives here now because debian/control no longer carries one: the .deb is
# built for musl with a rustup toolchain, so `Build-Depends` has no rustc to
# declare. tests/msrv_agrees_with_ci.rs ties this to ci.yml's `msrv` input, and
# cargo itself refuses to build on anything older.
rust-version = "1.88"
license = "MIT"
description = "Self-hosted, headless mail server: SMTP, IMAP and modern email security through an API and CLI."
repository = "https://github.com/Glyndor/epistle"
publish = false

[dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["ws"] }
flate2 = "1.1.9"
base64 = "0.23.1"
clap = { version = "4.6.1", features = ["derive"] }
hickory-resolver = { version = "0.26.1", features = ["dnssec-ring"] }
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
libc = "0.2.186"
psl = "2.1.212"
rcgen = "0.14.8"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
ring = "0.17.14"
quick-xml = { version = "0.41", features = ["serialize"] }
rand = "0.8.5"
rustls-pki-types = "1.14.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros", "migrate", "uuid"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal"] }
tower-http = { version = "0.7.0", features = ["cors"] }
tokio-rustls = "0.26.4"
toml = "1.1.2"
url = "2.5.8"
percent-encoding = "2.3.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
tracing-opentelemetry = "0.33"
uuid = { version = "1.23.2", features = ["v7", "serde"] }
webpki-roots = "1.0.7"
x509-parser = "0.18.1"

[profile.release]
lto = "thin"
strip = "symbols"

[dev-dependencies]
criterion = "0.8.2"
serde_json = "1.0.150"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }

[[bench]]
name = "parsers"
harness = false

[[bench]]
name = "queue"
harness = false
