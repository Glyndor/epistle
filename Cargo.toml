[package]
name = "epistle"
version = "0.12.3"
edition = "2024"
# The floor CI builds on, and the one `epistle` claims to support. It now comes
# from sqlx 0.9's own `rust-version` (1.94), so it is a derived floor rather
# than a measured one; standards/testing forbids that derivation for packaging
# floors, but this one is not a packaging floor.
#
# The packaging path has none: debian/control carries no rustc on `Build-Depends`
# because the .deb is built for musl with a rustup toolchain, and
# `release.yml` pins that toolchain at 1.98.0. tests/msrv_agrees_with_ci.rs ties
# this to ci.yml's `msrv` input, and cargo itself refuses to build on anything
# older.
#
# 1.88 was the previous floor; it came from a build that failed (`rcgen`, `time`
# and `icu_properties` each wanted more than `edition = "2024"` implies).
rust-version = "1.94"
license = "MIT"
description = "Self-hosted, headless mail server: SMTP, IMAP and modern email security through an API and CLI."
repository = "https://github.com/Glyndor/epistle"
publish = false

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
flate2 = "1.1.9"
futures-core = "0.3.34"
base64 = "0.23.1"
# `aws-lc-rs` is the TLS provider `rustls` already installs, so it was in
# the tree and in the binary before this line existed. It is named here
# for one reason: the RSA DKIM key is generated in process, so a server
# whose image ships no `openssl` can rotate its keys
# (Glyndor/epistle#1376). `ring` cannot generate an RSA key and `rcgen`
# only makes certificates, so this is the crate that can.
#
# The features are the ones `rustls` already turns on, so the build does
# not grow a second crypto provider: `aws-lc-sys` is the C library both
# use, and `prebuilt-nasm` comes with it through `rustls`.
aws-lc-rs = { version = "1.18.0", default-features = false, features = ["aws-lc-sys"] }
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
hickory-resolver = { version = "0.26.1", features = ["dnssec-ring"] }
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "service"] }
idna = "1.1"
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
libc = "0.2.186"
# `ntp-proto` is pinned with `=` because every line below rides on an
# `__internal` feature whose set of exports changes between releases.
#
# `rustcrypto`: the crate ships two TLS stacks and its `aws-lc` default
# would link a second crypto provider next to the `ring` one we already
# install through `src/tls`.
#
# `__internal-api`: ntp-proto 1.9.0's public API exports neither the
# NTS-KE client nor the NTP packet, so `KeyExchangeClient`,
# `NtsClientConfig`, `NtpPacket`, `PollInterval`, `ProtocolVersion`,
# `SourceNtsData`, `Cipher`/`NoCipher` and `NtpTimestamp` only reach us
# through this feature.
#
# `__internal-test`: `SourceNtsData` keeps its fields private and gates
# the only accessors we need, `get_cookie` and `get_keys`, behind this
# feature, and production reads the cookie and the two ciphers, so it
# cannot move to `[dev-dependencies]`.
#
# `__internal-test` is the first of the two to go when ntp-proto exposes
# a stable accessor pair on `SourceNtsData`.
ntp-proto = { version = "=1.9.0", default-features = false, features = ["rustcrypto", "__internal-api", "__internal-test"] }
psl = "2.1.212"
rcgen = "0.14.8"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
ring = "0.17.14"
socket2 = "0.6.5"
quick-xml = { version = "0.42", features = ["serialize"] }
rand = "0.10.2"
rustls-pki-types = "1.14.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros", "migrate", "uuid"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tokio-rustls = "0.26.4"
toml = "1.1.2"
unicode-security = "0.1.2"
url = "2.5.8"
percent-encoding = "2.3.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
tracing-opentelemetry = "0.34"
uuid = { version = "1.23.2", features = ["v7", "serde"] }
webpki-roots = "1.0.7"
x509-parser = "0.18.1"
zeroize = "=1.9.1"
mail-parser = { version = "1.0.0", default-features = false }
toml_edit = "0.25"
unicode-normalization = "0.1.25"

# Interface enumeration without unsafe: only the `net` feature (ifaddrs).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["net"] }

[profile.release]
lto = "thin"
strip = "symbols"

[dev-dependencies]
criterion = "0.8.2"
serde_json = "1.0.150"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
# Reads src/api/openapi/openapi.yaml in the tests, as an independent check on
# the YAML subset the server itself reads. Not part of the shipped binary.
yaml-rust2 = { version = "0.13", default-features = false }

[[bench]]
name = "parsers"
harness = false

[[bench]]
name = "queue"
harness = false
